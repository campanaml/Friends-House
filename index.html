<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Friends Neighborhood - Personal Homes</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; touch-action: manipulation; }
    body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    #setup-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10; padding: 15px;
    }
    .card { border: 2px solid #fff; padding: 20px; background: #000; text-align: center; width: 100%; max-width: 380px; }
    input { width: 100%; padding: 10px; margin: 8px 0; background: #111; color: #fff; border: 1px solid #fff; outline: none; font-size: 13px; text-align: center; }
    .options-grid { display: flex; justify-content: space-between; margin: 8px 0; gap: 4px; }
    .opt-btn { border: 1px solid #fff; padding: 8px; cursor: pointer; background: #111; flex: 1; font-size: 11px; text-align: center; color: #fff; }
    .opt-btn.selected { background: #fff; color: #000; font-weight: bold; }
    .color-swatch { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #fff; display: inline-block; cursor: pointer; }
    .color-swatch.selected { outline: 2px solid #fff; outline-offset: 2px; }
    button.start { padding: 12px; background: #fff; color: #000; border: none; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; margin-top: 10px; }

    #version-tag { font-size: 10px; color: #888; margin-top: 8px; }

    #game-container { position: relative; display: none; width: 100vw; max-width: 800px; margin: 0 auto; }
    .canvas-wrapper { position: relative; width: 100%; padding-top: 75%; }
    canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: 2px solid #fff; background: #000; display: block; }
    
    #room-info { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.85); border: 1px solid #fff; padding: 6px; font-size: 11px; z-index: 2; }
    #player-list { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.85); border: 1px solid #fff; padding: 6px; font-size: 11px; z-index: 2; width: 140px; }
    
    #chat-container { position: absolute; bottom: 8px; left: 8px; width: 240px; max-width: 50%; background: rgba(0,0,0,0.85); border: 1px solid #fff; padding: 6px; z-index: 2; }
    #chat-header { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: bold; cursor: pointer; user-select: none; border-bottom: 1px solid #444; padding-bottom: 2px; margin-bottom: 4px; }
    #chat-header:hover { color: #ff0; }
    #chat-body { display: block; }
    #chat-container.minimized #chat-body { display: none; }
    #chat-container.minimized #chat-header { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    #chat-logs { height: 70px; overflow-y: auto; font-size: 10px; margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; word-break: break-word; }
    #chat-input { width: 100%; padding: 4px; background: #111; color: #fff; border: 1px solid #fff; outline: none; font-size: 10px; text-align: left; }

    #emote-bar { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
    .emote-btn { background: #111; border: 1px solid #fff; padding: 4px 8px; cursor: pointer; font-size: 14px; color: #fff; }
    .emote-btn:active { background: #fff; }

    #controls-container { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding: 0 10px; }
    #dpad { display: grid; grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 42px); gap: 4px; user-select: none; }
    .dbtn { background: #111; border: 1px solid #fff; color: #fff; font-size: 16px; font-weight: bold; display: flex; justify-content: center; align-items: center; border-radius: 4px; cursor: pointer; }
    .dbtn:active { background: #fff; color: #000; }
    
    .action-group { display: flex; flex-direction: column; gap: 6px; align-items: center; }
    #action-btn { width: 80px; height: 60px; background: #111; border: 2px solid #fff; color: #fff; font-size: 12px; font-weight: bold; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; user-select: none; text-align: center; }
    #action-btn:active { background: #fff; color: #000; }
    #reset-btn { background: #222; border: 1px solid #888; color: #aaa; font-size: 9px; padding: 4px 8px; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>

      <h2 style="margin-bottom: 8px;">NEIGHBORHOOD</h2>
      
      <p style="font-size: 10px; color: #aaa;">WORLD / ROOM NAME:</p>
      <input type="text" id="world-id-input" placeholder="e.g. main-town" value="main-town">

      <p style="font-size: 10px; margin-top: 4px; color: #aaa;">CHOOSE YOUR CHARACTER:</p>
      <div class="options-grid">
        <div class="opt-btn selected" onclick="selectAvatar('martin', this)">🕶️ Martin</div>
        <div class="opt-btn" onclick="selectAvatar('gaby', this)">🎧 Gaby</div>
        <div class="opt-btn" onclick="selectAvatar('facu', this)">🧢 Facu</div>
      </div>

      <p style="font-size: 10px; margin-top: 4px; color: #aaa;">SELECT COLOR TINT:</p>

        <div class="color-swatch selected" style="background:#ffffff;" onclick="selectColor('#ffffff', this)"></div>
        <div class="color-swatch" style="background:#aaaaaa;" onclick="selectColor('#aaaaaa', this)"></div>
        <div class="color-swatch" style="background:#555555;" onclick="selectColor('#555555', this)"></div>
        <div class="color-swatch" style="background:#e8a5
