<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Friends House</title>
  <!-- PeerJS for free serverless WebRTC multiplayer -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; touch-action: manipulation; }
    body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    /* Login Modal */
    #setup-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10; padding: 15px;
    }
    .card { border: 2px solid #fff; padding: 20px; background: #000; text-align: center; width: 100%; max-width: 340px; }
    input { width: 100%; padding: 10px; margin: 8px 0; background: #111; color: #fff; border: 1px solid #fff; outline: none; font-size: 14px; }
    .avatar-options { display: flex; justify-content: space-between; margin: 12px 0; }
    .avatar-btn { border: 1px solid #fff; padding: 8px; cursor: pointer; background: #111; flex: 1; margin: 0 3px; font-size: 12px; }
    .avatar-btn.selected { background: #fff; color: #000; font-weight: bold; }
    button.start { padding: 12px; background: #fff; color: #000; border: none; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; margin-top: 5px; }

    /* Game Layout */
    #game-container { 
      position: relative; 
      display: none; 
      width: 100vw; 
      max-width: 800px; 
      margin: 0 auto;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      padding-top: 75%; /* 4:3 Aspect Ratio */
    }

    canvas { 
      position: absolute;
      top: 0; left: 0;
      width: 100% !important; 
      height: 100% !important; 
      border: 2px solid #fff; 
      background: #000; 
      display: block; 
    }
    
    /* UI Overlays */
    #room-info { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.85); border: 1px solid #fff; padding: 6px; font-size: 10px; z-index: 2; }
    #player-list { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.85); border: 1px solid #fff; padding: 6px; font-size: 10px; z-index: 2; width: 120px; }
    
    /* Chat Box */
    #chat-container {
      position: absolute; bottom: 8px; left: 8px; width: 220px; max-width: 50%;
      background: rgba(0,0,0,0.85); border: 1px solid #fff; padding: 6px; z-index: 2;
    }
    #chat-logs { height: 60px; overflow-y: auto; font-size: 10px; margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
    #chat-input { width: 100%; padding: 4px; background: #111; color: #fff; border: 1px solid #fff; outline: none; font-size: 10px; }

    /* Emote Bar */
    #emote-bar {
      position: absolute; bottom: 8px; right: 8px; display: flex; gap: 4px; z-index: 2;
    }
    .emote-btn { background: #111; border: 1px solid #fff; padding: 4px 8px; cursor: pointer; font-size: 14px; }
    .emote-btn:active { background: #fff; }

    /* Mobile D-Pad & Controls */
    #controls-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding: 0 10px;
    }

    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(3, 40px);
      gap: 4px;
      user-select: none;
    }
    .dbtn {
      background: #111; border: 1px solid #fff; color: #fff;
      font-size: 16px; font-weight: bold; display: flex;
      justify-content: center; align-items: center; border-radius: 4px; cursor: pointer;
    }
    .dbtn:active { background: #fff; color: #000; }

    #action-btn {
      width: 80px; height: 80px; background: #111; border: 2px solid #fff; color: #fff;
      font-size: 12px; font-weight: bold; border-radius: 50%; display: flex;
      justify-content: center; align-items: center; cursor: pointer; user-select: none;
    }
    #action-btn:active { background: #fff; color: #000; }
  </style>
</head>
<body>

  <!-- Entry Setup Screen -->
  <div id="setup-modal">
    <div class="card">
      <h2 style="margin-bottom: 8px;">FRIENDS HOUSE</h2>
      <input type="text" id="username" placeholder="Your Name..." maxlength="12" />
      <p style="font-size: 11px; margin-top: 4px;">Select Avatar:</p>
      <div class="avatar-options">
        <div class="avatar-btn selected" onclick="selectAvatar('rat', this)">🐀<br>Rat</div>
        <div class="avatar-btn" onclick="selectAvatar('pig', this)">🐖<br>Pig</div>
        <div class="avatar-btn" onclick="selectAvatar('guy', this)">🧍<br>Guy</div>
      </div>
      <input type="text" id="room-code" placeholder="Room Code (Blank to Host)" />
      <button class="start" onclick="enterHouse()">ENTER APARTMENT</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-container">
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      
      <div id="room-info">
        <div>ROOM: <span id="display-room-code" style="font-weight:bold;">---</span></div>
        <div id="status-tag" style="font-size: 9px; color: #0f0; margin-top:2px;">Connecting...</div>
      </div>

      <div id="player-list">
        <div style="font-weight:bold; border-bottom:1px solid #fff; margin-bottom:4px;">PLAYERS</div>
        <div id="player-names"></div>
      </div>

      <div id="chat-container">
        <div id="chat-logs"></div>
        <input type="text" id="chat-input" placeholder="Chat... (Press Enter)" />
      </div>

      <div id="emote-bar">
        <button class="emote-btn" onclick="sendEmote('👋')">👋</button>
        <button class="emote-btn" onclick="sendEmote('❤️')">❤️</button>
        <button class="emote-btn" onclick="sendEmote('😂')">😂</button>
        <button class="emote-btn" onclick="sendEmote('🎵')">🎵</button>
      </div>
    </div>

    <!-- Touch Controls for Mobile -->
    <div id="controls-container">
      <div id="dpad">
        <div></div><div class="dbtn" id="btn-up">▲</div><div></div>
        <div class="dbtn" id="btn-left">◀</div><div></div><div class="dbtn" id="btn-right">▶</div>
        <div></div><div class="dbtn" id="btn-down">▼</div><div></div>
      </div>
      <div id="action-btn" onclick="triggerInteraction()">ACTION<br>(E)</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let selectedAvatar = 'rat';
    let localPlayer = { 
      id: '', name: '', avatar: 'rat', x: 400, y: 250, speed: 4, 
      dir: 'down', isMoving: false, isSeated: false, drink: null, bubble: null, emote: null 
    };
    
    let players = {}; 
    let keys = {};
    let peer = null;
    let connections = {};
    let animFrame = 0;

    // Interactive World State
    let tvChannel = 0; // 0: OFF, 1: Static, 2: Channel 1
    let doors = [
      { id: 1, x: 200, y: 360, w: 40, h: 8, isOpen: false },
      { id: 2, x: 460, y: 360, w: 40, h: 8, isOpen: false },
      { id: 3, x: 720, y: 360, w: 40, h: 8, isOpen: false }
    ];

    const walls = [
      { x: 0, y: 0, w: 800, h: 10 },
      { x: 0, y: 590, w: 800, h: 10 },
      { x: 0, y: 0, w: 10, h: 600 },
      { x: 790, y: 0, w: 10, h: 600 },
      { x: 250, y: 360, w: 540, h: 8 },
      { x: 270, y: 360, w: 8, h: 230 },
      { x: 530, y: 360, w: 8, h: 230 }
    ];

    function selectAvatar(type, el) {
      selectedAvatar = type;
      document.querySelectorAll('.avatar-btn').forEach(btn => btn.classList.remove('selected'));
      el.classList.add('selected');
    }

    function enterHouse() {
      const name = document.getElementById('username').value.trim();
      if (!name) return alert('Please enter your name!');
      
      localPlayer.name = name;
      localPlayer.avatar = selectedAvatar;
      localPlayer.id = Math.random().toString(36).substring(2, 7);
      
      const targetRoom = document.getElementById('room-code').value.trim().toLowerCase();
      
      document.getElementById('setup-modal').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      setupMobileControls();
      initMultiplayer(targetRoom);
      requestAnimationFrame(gameLoop);
    }

    function setupMobileControls() {
      const bindTouch = (id, keyName) => {
        const btn = document.getElementById(id);
        const start = (e) => { e.preventDefault(); keys[keyName] = true; };
        const end = (e) => { e.preventDefault(); keys[keyName] = false; };
        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
      };
      bindTouch('btn-up', 'ArrowUp');
      bindTouch('btn-down', 'ArrowDown');
      bindTouch('btn-left', 'ArrowLeft');
      bindTouch('btn-right', 'ArrowRight');
    }

    function initMultiplayer(targetRoom) {
      const isHost = !targetRoom;
      const roomID = isHost ? Math.random().toString(36).substring(2, 7) : targetRoom;
      
      document.getElementById('display-room-code').innerText = roomID;
      peer = new Peer(isHost ? roomID : undefined);

      peer.on('open', () => {
        document.getElementById('status-tag').innerText = isHost ? "HOSTING" : "CONNECTED";
        if (!isHost) bindConnectionEvents(peer.connect(roomID));
      });

      peer.on('connection', (conn) => bindConnectionEvents(conn));
    }

    function bindConnectionEvents(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.send({ type: 'sync', player: localPlayer, tvChannel, doors });
      });

      conn.on('data', (data) => {
        if (data.type === 'sync' || data.type === 'move') {
          players[data.player.id] = data.player;
          if (data.tvChannel !== undefined) tvChannel = data.tvChannel;
          if (data.doors) doors = data.doors;
          if (data.type === 'sync') conn.send({ type: 'move', player: localPlayer, tvChannel, doors });
        } else if (data.type === 'chat') {
          addChatMessage(data.name, data.message);
          if (players[data.id]) setSpeechBubble(players[data.id], data.message);
        } else if (data.type === 'emote') {
          if (players[data.id]) setEmote(players[data.id], data.emote);
        } else if (data.type === 'interact') {
          tvChannel = data.tvChannel;
          doors = data.doors;
        }
        updatePlayerList();
      });

      conn.on('close', () => {
        delete connections[conn.peer];
        delete players[conn.peer];
        updatePlayerList();
      });
    }

    function broadcast(data) {
      for (let peerId in connections) {
        if (connections[peerId].open) connections[peerId].send(data);
      }
    }

    function updatePlayerList() {
      const listEl = document.getElementById('player-names');
      let html = `<div>• ${localPlayer.name} (You)</div>`;
      for (let id in players) {
        if (id !== localPlayer.id) html += `<div>• ${players[id].name}</div>`;
      }
      listEl.innerHTML = html;
    }

    // Keyboard & Action Inputs
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === 'e' || e.key === 'E') triggerInteraction();
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    const chatInput = document.getElementById('chat-input');
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && chatInput.value.trim() !== '') {
        const msg = chatInput.value.trim();
        addChatMessage(localPlayer.name, msg);
        setSpeechBubble(localPlayer, msg);
        broadcast({ type: 'chat', id: localPlayer.id, name: localPlayer.name, message: msg });
        chatInput.value = '';
      }
    });

    function setSpeechBubble(p, text) {
      p.bubble = { text, timer: Date.now() + 4000 };
    }

    function sendEmote(emote) {
      setEmote(localPlayer, emote);
      broadcast({ type: 'emote', id: localPlayer.id, emote });
    }

    function setEmote(p, emote) {
      p.emote = { symbol: emote, timer: Date.now() + 3000 };
    }

    function addChatMessage(sender, text) {
      const logs = document.getElementById('chat-logs');
      logs.innerHTML += `<div><strong>${sender}:</strong> ${text}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }

    // Interactive Objects Logic (Sitting, TV, Fridge, Doors)
    function triggerInteraction() {
      // Couch / Chair Sitting
      if (localPlayer.x >= 300 && localPlayer.x <= 360 && localPlayer.y >= 50 && localPlayer.y <= 150) {
        localPlayer.isSeated = !localPlayer.isSeated;
        if (localPlayer.isSeated) { localPlayer.x = 330; localPlayer.y = 100; }
      } 
      // TV Toggle
      else if (localPlayer.x >= 250 && localPlayer.x <= 300 && localPlayer.y >= 30 && localPlayer.y <= 160) {
        tvChannel = (tvChannel + 1) % 3;
        broadcast({ type: 'interact', tvChannel, doors });
      } 
      // Fridge Drink
      else if (localPlayer.x >= 640 && localPlayer.x <= 770 && localPlayer.y >= 20 && localPlayer.y <= 120) {
        const drinks = ['🥤', '🧃', '☕', '🍺'];
        localPlayer.drink = drinks[Math.floor(Math.random() * drinks.length)];
      } 
      // Doors
      else {
        doors.forEach(d => {
          if (Math.abs(localPlayer.x - (d.x + 20)) < 30 && Math.abs(localPlayer.y - d.y) < 30) {
            d.isOpen = !d.isOpen;
            broadcast({ type: 'interact', tvChannel, doors });
          }
        });
      }
    }

    function checkCollision(newX, newY, radius) {
      // Check solid walls
      for (let wall of walls) {
        // Skip wall collision if passing through an open door
        let isDoorArea = doors.some(d => d.isOpen && newX >= d.x && newX <= d.x + d.w && Math.abs(newY - d.y) < 15);
        if (isDoorArea) continue;

        let closestX = Math.max(wall.x, Math.min(newX, wall.x + wall.w));
        let closestY = Math.max(wall.y, Math.min(newY, wall.y + wall.h));
        let distX = newX - closestX;
        let distY = newY - closestY;
        if (Math.sqrt((distX * distX) + (distY * distY)) < radius) return true;
      }
      return false;
    }

    function update() {
      animFrame++;
      let nextX = localPlayer.x;
      let nextY = localPlayer.y;
      localPlayer.isMoving = false;

      if (!localPlayer.isSeated) {
        if (keys['ArrowUp'] || keys['w']) { nextY -= localPlayer.speed; localPlayer.dir = 'up'; localPlayer.isMoving = true; }
        if (keys['ArrowDown'] || keys['s']) { nextY += localPlayer.speed; localPlayer.dir = 'down'; localPlayer.isMoving = true; }
        if (keys['ArrowLeft'] || keys['a']) { nextX -= localPlayer.speed; localPlayer.dir = 'left'; localPlayer.isMoving = true; }
        if (keys['ArrowRight'] || keys['d']) { nextX += localPlayer.speed; localPlayer.dir = 'right'; localPlayer.isMoving = true; }

        if (!checkCollision(nextX, localPlayer.y, 14)) localPlayer.x = nextX;
        if (!checkCollision(localPlayer.x, nextY, 14)) localPlayer.y = nextY;
      }

      if (localPlayer.isMoving && Object.keys(connections).length > 0) {
        broadcast({ type: 'move', player: localPlayer, tvChannel, doors });
      }
    }

    function drawApartment() {
      ctx.strokeStyle = '#fff';
      ctx.fillStyle = '#fff';
      ctx.lineWidth = 2;

      // Draw Base Walls
      walls.forEach(w => ctx.strokeRect(w.x, w.y, w.w, w.h));

      // Draw Doors
      doors.forEach(d => {
        if (!d.isOpen) {
          ctx.fillRect(d.x, d.y, d.w, d.h);
        } else {
          ctx.strokeRect(d.x, d.y - 20, 8, 20); // Open door graphic
        }
      });

      // Kitchen & Fridge
      ctx.strokeRect(640, 20, 130, 90); ctx.fillText("KITCHEN", 670, 50);
      ctx.strokeRect(730, 25, 35, 40); ctx.fillText("FRIDGE", 732, 50);

      // Living Room Table & Couch
      ctx.strokeRect(380, 150, 120, 70); ctx.fillText("TABLE", 420, 190);
      ctx.strokeRect(310, 60, 40, 80); ctx.fillText("COUCH", 312, 105);

      // Interactive TV Screen
      ctx.strokeRect(270, 50, 12, 100);
      if (tvChannel === 0) {
        ctx.fillText("TV: OFF", 250, 40);
      } else if (tvChannel === 1) {
        ctx.fillText("TV: STATIC", 250, 40);
        ctx.fillRect(272, 60 + (animFrame % 60), 8, 10); // Static noise effect
      } else {
        ctx.fillText("TV: CH 1", 250, 40);
        ctx.strokeRect(273, 80, 6, 20); // Animated bar on TV
      }

      // Rooms & Bathrooms
      ctx.fillText("BEDROOM 1", 30, 390);
      ctx.fillText("BEDROOM 2", 290, 390);
      ctx.fillText("BEDROOM 3", 550, 390);

      ctx.strokeRect(200, 360, 60, 60); ctx.fillText("BATH", 212, 395);
      ctx.strokeRect(460, 360, 60, 60); ctx.fillText("BATH", 472, 395);
      ctx.strokeRect(720, 360, 60, 60); ctx.fillText("BATH", 732, 395);
    }

    function drawAvatar(p) {
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;

      // Bobbing animation offset
      let bobY = (p.isMoving && !p.isSeated) ? Math.sin(animFrame * 0.3) * 3 : 0;
      let renderY = p.y + bobY;

      ctx.beginPath();
      if (p.avatar === 'rat') {
        ctx.arc(p.x, renderY, 12, 0, Math.PI * 2);
        let earOffset = p.dir === 'left' ? -4 : (p.dir === 'right' ? 4 : 0);
        ctx.arc(p.x - 8 + earOffset, renderY - 10, 5, 0, Math.PI * 2);
        ctx.arc(p.x + 8 + earOffset, renderY - 10, 5, 0, Math.PI * 2);
      } else if (p.avatar === 'pig') {
        ctx.rect(p.x - 12, renderY - 12, 24, 24);
        ctx.rect(p.x - 4, renderY - 4, 8, 8);
      } else {
        ctx.arc(p.x, renderY - 6, 8, 0, Math.PI * 2);
        ctx.rect(p.x - 8, renderY + 2, 16, 16);
      }
      ctx.stroke();

      // Seated Indicator
      if (p.isSeated) {
        ctx.fillText("🪑", p.x + 12, renderY);
      }

      // Drink Icon
      if (p.drink) {
        ctx.fillText(p.drink, p.x - 18, renderY);
      }

      // Player Name
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.name, p.x, renderY - 20);

      // Speech Bubble Overlay
      if (p.bubble && Date.now() < p.bubble.timer) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(p.x - 40, renderY - 45, 80, 18);
        ctx.fillStyle = '#000';
        ctx.font = '10px monospace';
        ctx.fillText(p.bubble.text.substring(0, 10), p.x, renderY - 32);
      }

      // Emote Overlay
      if (p.emote && Date.now() < p.emote.timer) {
        ctx.font = '16px monospace';
        ctx.fillText(p.emote.symbol, p.x, renderY - 50);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawApartment();
      
      drawAvatar(localPlayer);

      for (let id in players) {
        if (id !== localPlayer.id) drawAvatar(players[id]);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
