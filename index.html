<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Friends Neighborhood - Fixed Login</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0a10; color: #fff; }
    
    #setup-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 10, 16, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-box {
      background: #181824; border: 2px solid #3b3b54; padding: 30px; border-radius: 12px;
      width: 340px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal-box h2 { margin-bottom: 20px; color: #00d2ff; letter-spacing: 1px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 12px; color: #8888aa; margin-bottom: 5px; }
    .input-group input {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #3b3b54;
      background: #0f0f18; color: #fff; font-size: 14px; outline: none;
    }
    .avatar-select { display: flex; gap: 10px; margin-bottom: 20px; }
    .opt-btn {
      flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #3b3b54;
      background: #222235; color: #fff; cursor: pointer; transition: 0.2s;
    }
    .opt-btn.selected { border-color: #00d2ff; background: #00d2ff22; color: #00d2ff; font-weight: bold; }
    .color-picker { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
    .color-swatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-swatch.selected { border-color: #fff; transform: scale(1.15); }
    
    .btn-primary {
      width: 100%; padding: 12px; border: none; border-radius: 6px;
      background: #00d2ff; color: #000; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s;
    }
    .btn-primary:hover { background: #00b8e6; }

    #game-container { display: none; width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100%; height: 100%; background: #112211; }
    
    #ui-layer { position: absolute; top: 10px; left: 10px; display: flex; gap: 10px; }
    .tag { background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 4px; border: 1px solid #333; font-size: 12px; }
  </style>
</head>
<body>

  <!-- MODAL DE LOGIN -->
  <div id="setup-modal">
    <div class="modal-box">
      <h2>ENTER NEIGHBORHOOD</h2>
      <div class="input-group">
        <label>USERNAME</label>
        <input type="text" id="username-input" placeholder="Enter your name..." maxlength="12">
      </div>
      <div class="input-group">
        <label>WORLD ROOM CODE</label>
        <input type="text" id="world-id-input" placeholder="main-town" value="main-town" maxlength="15">
      </div>
      <div class="input-group">
        <label>CHOOSE AVATAR</label>
        <div class="avatar-select">
          <button class="opt-btn selected" id="btn-martin" onclick="selectAvatar('martin')">Martin</button>
          <button class="opt-btn" id="btn-gaby" onclick="selectAvatar('gaby')">Gaby</button>
          <button class="opt-btn" id="btn-facu" onclick="selectAvatar('facu')">Facu</button>
        </div>
      </div>
      <div class="input-group">
        <label>SHIRT COLOR</label>
        <div class="color-picker">
          <div class="color-swatch selected" style="background:#ffffff;" onclick="selectColor('#ffffff', this)"></div>
          <div class="color-swatch" style="background:#ff4444;" onclick="selectColor('#ff4444', this)"></div>
          <div class="color-swatch" style="background:#44ff44;" onclick="selectColor('#44ff44', this)"></div>
          <div class="color-swatch" style="background:#4488ff;" onclick="selectColor('#4488ff', this)"></div>
          <div class="color-swatch" style="background:#ffcc00;" onclick="selectColor('#ffcc00', this)"></div>
        </div>
      </div>
      <button class="btn-primary" onclick="enterHouse()">ENTER WORLD</button>
    </div>
  </div>

  <!-- JUEGO Y CANVAS -->
  <div id="game-container">
    <div id="ui-layer">
      <div class="tag" id="status-tag">OFFLINE</div>
      <div class="tag" id="display-room-code">MAIN-TOWN</div>
      <div class="tag" id="coins-tag">💰 COINS: $100</div>
    </div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    let canvas, ctx;
    let selectedAvatar = 'martin';
    let selectedColor = '#ffffff';
    let activeWorldRoom = 'main-town';
    let audioCtx = null;

    let localPlayer = {
      id: '', name: '', avatar: 'martin', color: '#ffffff',
      x: 400, y: 300, speed: 4, radius: 12, coins: 100, inventory: []
    };

    window.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('gameCanvas');
      if (canvas) {
        ctx = canvas.getContext('2d');
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
      }

      // Cargar persistencia si existe
      const savedName = localStorage.getItem('nh_name');
      if (savedName) document.getElementById('username-input').value = savedName;
    });

    function resizeCanvas() {
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    }

    function selectAvatar(type) {
      selectedAvatar = type;
      document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('selected'));
      const btn = document.getElementById(`btn-${type}`);
      if (btn) btn.classList.add('selected');
    }

    function selectColor(hex, el) {
      selectedColor = hex;
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function enterHouse() {
      try {
        initAudio();
      } catch (e) {
        console.warn("Audio Context error:", e);
      }

      const customName = document.getElementById('username-input').value.trim();
      activeWorldRoom = document.getElementById('world-id-input').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || "main-town";
      
      const finalName = customName || (selectedAvatar.charAt(0).toUpperCase() + selectedAvatar.slice(1));
      
      // Asignación de datos al usuario
      localPlayer.id = Math.random().toString(36).substring(2, 7);
      localPlayer.name = finalName;
      localPlayer.avatar = selectedAvatar;
      localPlayer.color = selectedColor;

      // Guardar en localStorage
      localStorage.setItem('nh_name', localPlayer.name);
      localStorage.setItem('nh_avatar', selectedAvatar);
      localStorage.setItem('nh_color', selectedColor);
      localStorage.setItem('nh_room', activeWorldRoom);

      // Transición UI
      document.getElementById('setup-modal').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      document.getElementById('display-room-code').innerText = activeWorldRoom.toUpperCase();
      document.getElementById('status-tag').innerText = "ONLINE";

      // Re-asegurar tamaño canvas
      resizeCanvas();

      // Iniciar Game Loop
      requestAnimationFrame(gameLoop);
    }

    function gameLoop() {
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fondo
      ctx.fillStyle = '#112211';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dibujar jugador
      ctx.fillStyle = localPlayer.color;
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, localPlayer.radius, 0, Math.PI * 2);
      ctx.fill();

      // Etiqueta Nombre
      ctx.fillStyle = '#ffffff';
      ctx.font = '12px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText(localPlayer.name, canvas.width / 2, (canvas.height / 2) - 18);

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
