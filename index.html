<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Multiplayer Base Template</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }

    /* Modal Overlay */
    #setup-modal {
      position: fixed; inset: 0; background: rgba(10, 10, 15, 0.95);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .card {
      background: #1a1a24; border: 1px solid #333; border-radius: 12px;
      padding: 24px; text-align: center; width: 300px;
    }
    input {
      width: 100%; padding: 10px; margin: 8px 0; background: #0a0a0f;
      color: #fff; border: 1px solid #444; border-radius: 6px; outline: none; user-select: text;
    }
    button {
      width: 100%; padding: 12px; background: #5c6ac4; color: #fff;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px;
    }

    /* Game Canvas & Overlay */
    #game-container { position: relative; width: 100vw; height: 100vh; display: none; }
    #canvas3d { width: 100%; height: 100%; display: block; }
    
    #hud { position: absolute; top: 12px; left: 12px; font-size: 12px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 6px; }
    
    /* Chat Overlay */
    #chat-container {
      position: absolute; bottom: 12px; left: 12px; width: 280px;
      background: rgba(0, 0, 0, 0.7); border-radius: 8px; padding: 8px; z-index: 10;
    }
    #chat-logs { height: 80px; overflow-y: auto; font-size: 11px; display: flex; flex-direction: column; gap: 2px; }
    #chat-input { width: 100%; padding: 6px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; outline: none; font-size: 11px; margin-top: 6px; }

    /* World Space Nametags */
    .avatar-label {
      position: absolute; transform: translate(-50%, -100%); pointer-events: none;
      font-size: 11px; font-weight: bold; color: #fff; text-shadow: 0 1px 3px #000;
      display: flex; flex-direction: column; align-items: center; z-index: 5;
    }
    .chat-bubble {
      background: #fff; color: #000; padding: 3px 6px; border-radius: 6px;
      font-size: 10px; margin-bottom: 3px; display: none; white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Entry Setup -->
  <div id="setup-modal">
    <div class="card">
      <h2>3D BASE ENGINE</h2>
      <input type="text" id="username" placeholder="Username..." maxlength="12" />
      <input type="text" id="room-code" placeholder="Room Code (Blank to Host)" />
      <button onclick="enterGame()">JOIN ROOM</button>
    </div>
  </div>

  <!-- Game Container -->
  <div id="game-container">
    <canvas id="canvas3d"></canvas>
    <div id="labels-container"></div>
    
    <div id="hud">
      <div>ROOM: <span id="display-room">---</span></div>
      <div>STATUS: <span id="display-status">Ready</span></div>
    </div>

    <div id="chat-container">
      <div id="chat-logs"></div>
      <input type="text" id="chat-input" placeholder="Type message and press Enter..." />
    </div>
  </div>

  <script>
    // --- STATE MANAGEMENT ---
    let scene, camera, renderer;
    let localPlayer = { id: '', name: '', x: 0, z: 0, rot: 0, mesh: null, labelEl: null };
    let players = {};
    let keys = {};
    let isChatFocused = false;
    let peer = null, connections = {};

    // --- 1. INITIALIZE THREE.JS EARLY ---
    function initEngine() {
      const canvas = document.getElementById('canvas3d');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111116);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 16, 16);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      // Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const light = new THREE.DirectionalLight(0xffffff, 0.5);
      light.position.set(10, 20, 10);
      scene.add(light);

      // Simple Room Floor
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 20),
        new THREE.MeshStandardMaterial({ color: 0x222530, side: THREE.DoubleSide })
      );
      floor.rotation.x = Math.PI / 2;
      scene.add(floor);

      window.addEventListener('resize', onResize);
    }

    // --- 2. AVATAR CREATION ---
    function createPlayerMesh(colorHex = 0x5c6ac4) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16),
        new THREE.MeshStandardMaterial({ color: colorHex })
      );
      body.position.y = 0.6;
      group.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xffe0bd })
      );
      head.position.y = 1.4;
      group.add(head);

      scene.add(group);
      return group;
    }

    function createUIOverlay(player) {
      const div = document.createElement('div');
      div.className = 'avatar-label';
      div.innerHTML = `<div class="chat-bubble"></div><div>${player.name}</div>`;
      document.getElementById('labels-container').appendChild(div);
      player.labelEl = div;
    }

    function updateLabelPositions() {
      const updateSingle = (p) => {
        if (!p.mesh || !p.labelEl) return;
        const tempV = new THREE.Vector3(p.x, 2.0, p.z);
        tempV.project(camera);
        const x = (tempV.x * .5 + .5) * window.innerWidth;
        const y = (tempV.y * -.5 + .5) * window.innerHeight;
        p.labelEl.style.transform = `translate(-50%, -100%) translate(${x}px,${y}px)`;
      };

      updateSingle(localPlayer);
      for (let id in players) updateSingle(players[id]);
    }

    // --- 3. INPUT & CHAT ISOLATION ---
    const chatInput = document.getElementById('chat-input');
    chatInput.addEventListener('focus', () => { isChatFocused = true; keys = {}; });
    chatInput.addEventListener('blur', () => { isChatFocused = false; });

    window.addEventListener('keydown', e => {
      if (isChatFocused) {
        if (e.key === 'Enter' && chatInput.value.trim()) {
          const text = chatInput.value.trim();
          addChatLog(localPlayer.name, text);
          showBubble(localPlayer, text);
          broadcast({ type: 'chat', id: localPlayer.id, name: localPlayer.name, text });
          chatInput.value = '';
          chatInput.blur();
        }
        return; // Mute game key inputs while typing
      }
      keys[e.key] = true;
    });

    window.addEventListener('keyup', e => { if (!isChatFocused) keys[e.key] = false; });

    function addChatLog(sender, text) {
      const logs = document.getElementById('chat-logs');
      logs.innerHTML += `<div><strong>${sender}:</strong> ${text}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }

    function showBubble(player, text) {
      if (!player.labelEl) return;
      const bubble = player.labelEl.querySelector('.chat-bubble');
      bubble.innerText = text;
      bubble.style.display = 'block';
      setTimeout(() => { bubble.style.display = 'none'; }, 4000);
    }

    // --- 4. MULTIPLAYER NETWORKING ---
    function initMultiplayer(targetRoom) {
      const isHost = !targetRoom;
      const roomID = isHost ? Math.random().toString(36).substring(2, 7) : targetRoom;
      document.getElementById('display-room').innerText = roomID;

      peer = new Peer(isHost ? roomID : undefined);

      peer.on('open', () => {
        document.getElementById('display-status').innerText = isHost ? "Hosting" : "Connected";
        if (!isHost) setupConnection(peer.connect(roomID));
      });

      peer.on('connection', conn => setupConnection(conn));
    }

    function setupConnection(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.send({ type: 'sync', player: getLocalData() });
      });

      conn.on('data', data => {
        if (data.type === 'sync' || data.type === 'move') {
          updateRemotePlayer(data.player);
          if (data.type === 'sync') conn.send({ type: 'move', player: getLocalData() });
        } else if (data.type === 'chat') {
          addChatLog(data.name, data.text);
          if (players[data.id]) showBubble(players[data.id], data.text);
        }
      });

      conn.on('close', () => {
        if (players[conn.peer]) {
          scene.remove(players[conn.peer].mesh);
          if (players[conn.peer].labelEl) players[conn.peer].labelEl.remove();
          delete players[conn.peer];
        }
        delete connections[conn.peer];
      });
    }

    function getLocalData() {
      return { id: localPlayer.id, name: localPlayer.name, x: localPlayer.x, z: localPlayer.z, rot: localPlayer.rot };
    }

    function updateRemotePlayer(data) {
      if (!players[data.id]) {
        players[data.id] = { ...data, mesh: createPlayerMesh(0x4caf50) };
        createUIOverlay(players[data.id]);
      }
      const p = players[data.id];
      p.x = data.x; p.z = data.z; p.rot = data.rot;
      if (p.mesh) {
        p.mesh.position.set(p.x, 0, p.z);
        p.mesh.rotation.y = p.rot;
      }
    }

    function broadcast(data) {
      for (let id in connections) {
        if (connections[id].open) connections[id].send(data);
      }
    }

    // --- 5. GAME LOOP & MOVEMENT ---
    function enterGame() {
      const name = document.getElementById('username').value.trim();
      if (!name) return alert("Enter a name!");

      localPlayer.name = name;
      localPlayer.id = Math.random().toString(36).substring(2, 7);

      document.getElementById('setup-modal').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      initEngine();
      onResize(); // Correct canvas sizing after display toggle

      localPlayer.mesh = createPlayerMesh(0x5c6ac4);
      createUIOverlay(localPlayer);

      initMultiplayer(document.getElementById('room-code').value.trim().toLowerCase());
      
      // Fixed 20 Ticks/Sec Network Sync Loop
      setInterval(() => {
        if (localPlayer.isMoving) broadcast({ type: 'move', player: getLocalData() });
      }, 50);

      requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
      if (isChatFocused) return;

      let dx = 0, dz = 0;
      if (keys['w'] || keys['W'] || keys['ArrowUp']) dz -= 1;
      if (keys['s'] || keys['S'] || keys['ArrowDown']) dz += 1;
      if (keys['a'] || keys['A'] || keys['ArrowLeft']) dx -= 1;
      if (keys['d'] || keys['D'] || keys['ArrowRight']) dx += 1;

      if (dx !== 0 || dz !== 0) {
        const len = Math.hypot(dx, dz);
        localPlayer.x += (dx / len) * 0.1;
        localPlayer.z += (dz / len) * 0.1;
        localPlayer.rot = Math.atan2(dx, dz);
        localPlayer.isMoving = true;

        // Clamp to room bounds
        localPlayer.x = Math.max(-9.5, Math.min(9.5, localPlayer.x));
        localPlayer.z = Math.max(-9.5, Math.min(9.5, localPlayer.z));
      } else {
        localPlayer.isMoving = false;
      }

      if (localPlayer.mesh) {
        localPlayer.mesh.position.set(localPlayer.x, 0, localPlayer.z);
        localPlayer.mesh.rotation.y = localPlayer.rot;
      }
    }

    function onResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function gameLoop() {
      updatePhysics();
      updateLabelPositions();
      renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
