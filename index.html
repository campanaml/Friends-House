          var defaultRadius = {tl: 0, tr: 0, br: 0, bl: 0};
          for (var side in defaultRadius) { r[side] = r[side] || defaultRadius[side]; }

        this.moveTo(x + r.tl, y);
        this.lineTo(x + w - r.tr, y);

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          startAmbientTrafficSound();
        } catch(e) {}
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startAmbientTrafficSound() {
      if (!audioCtx) return;
      try {
        let bufferSize = audioCtx.sampleRate * 2;
        let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

        let whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer; whiteNoise.loop = true;

        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.setValueAtTime(320, audioCtx.currentTime);

        let gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.018, audioCtx.currentTime);

        whiteNoise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        whiteNoise.start(0);
      } catch(e) {}
    }
    
    function playTone(freq, type, duration, vol) {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function setupMobileControls() {
      const bindTouch = (id, keyName) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        const start = (e) => { e.preventDefault(); keys[keyName] = true; };
        const end = (e) => { e.preventDefault(); keys[keyName] = false; };
        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
      };
      bindTouch('btn-up', 'ArrowUp'); bindTouch('btn-down', 'ArrowDown');
      bindTouch('btn-left', 'ArrowLeft'); bindTouch('btn-right', 'ArrowRight');
    }

    function initMultiplayerGlobal() {
      const hostRoomId = `nh-${activeWorldRoom}-host-v400`;
      setTimeout(() => {
        peer = new Peer(hostRoomId);
        peer.on('open', () => {
          isHost = true;
          document.getElementById('status-tag').innerText = "HOSTING MEGA CITY";
        });
        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            peer = new Peer();
            peer.on('open', () => {
              document.getElementById('status-tag').innerText = "CONNECTED";
              connectToHost(hostRoomId);
            });
            peer.on('connection', (conn) => bindConnectionEvents(conn));
          }
        });
        peer.on('connection', (conn) => bindConnectionEvents(conn));
      }, Math.floor(Math.random() * 300));
    }

    function connectToHost(hostRoomId) {
      let hostConn = peer.connect(hostRoomId, { reliable: true });
      bindConnectionEvents(hostConn);
    }

    function bindConnectionEvents(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.send({ type: 'sync', player: localPlayer, vehicles, version: GAME_VERSION });
      });

      conn.on('data', (data) => {
        if (data.type === 'leave') {
          delete players[data.id];
          updatePlayerList();
          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        } else if (data.type === 'sync' || data.type === 'move') {
          data.player.lastSeen = Date.now();
          players[data.player.id] = data.player;
          if (data.vehicles) vehicles = data.vehicles;
          
          if (data.type === 'sync' && !isHost) conn.send({ type: 'move', player: localPlayer, vehicles });

          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        } else if (data.type === 'chat') {
          let sameLocation = (data.location === localPlayer.location);
          let dist = Math.hypot(localPlayer.x - data.x, localPlayer.y - data.y);
          let isNear = sameLocation && dist < 500;
          let text = isNear ? data.message : "...[distant chat]...";
          addChatMessage(data.name, text);
          if (players[data.id] && sameLocation) setSpeechBubble(players[data.id], data.message);
          
          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        } else if (data.type === 'emote') {
          if (players[data.id]) setEmote(players[data.id], data.emote);
          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        } else if (data.type === 'beam') {
          beams.push(data.beam);
          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        }
        updatePlayerList();
      });

      conn.on('close', () => {
        delete connections[conn.peer];
        delete players[conn.peer];
        updatePlayerList();
      });
    }

    function broadcast(data) {
      for (let peerId in connections) {
        if (connections[peerId].open) connections[peerId].send(data);
      }
    }

    function cleanupGhostPlayers() {
      const now = Date.now();

      for (let id in players) {
        if (id !== localPlayer.id && players[id].lastSeen && (now - players[id].lastSeen > PLAYER_TIMEOUT_MS)) {

    function addChatMessage(sender, text) {

    function triggerInteraction() {
      if (localPlayer.location === 'world') {
        if (localPlayer.vehicle) {
          let v = vehicles.find(item => item.id === localPlayer.vehicle);
          if (v) { v.driver = null; localPlayer.x = v.x + 50; localPlayer.y = v.y + 50; }
          localPlayer.vehicle = null;
          broadcast({ type: 'move', player: localPlayer, vehicles });
          return;
        }
        vehicles.forEach(v => {
          if (!v.driver && Math.hypot(localPlayer.x - v.x, localPlayer.y - v.y) < 65) {
            v.driver = localPlayer.id; localPlayer.vehicle = v.id; localPlayer.isMounted = false;
          }
        });
        houses.forEach(h => {
          if (Math.hypot(localPlayer.x - h.doorX, localPlayer.y - h.doorY) < 45) {
            localPlayer.location = h.id; localPlayer.x = 350; localPlayer.y = 400;
            document.getElementById('location-tag').innerText = h.name.toUpperCase();
          }
        });
      } else {
        if (Math.hypot(localPlayer.x - 350, localPlayer.y - 480) < 50) {
          let h = houses.find(item => item.id === localPlayer.location);
          localPlayer.location = 'world'; localPlayer.x = h ? h.exitX : 300; localPlayer.y = h ? h.exitY : 370;
          document.getElementById('location-tag').innerText = "WORLD";
        }
      }
      broadcast({ type: 'move', player: localPlayer, vehicles });
      updatePlayerList();
    }

    function checkWallCollision(newX, newY, radius) {
      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v && v.type === 'plane') return false;
      }
      let solids = localPlayer.location === 'world' ? outdoorSolids : houseSolids;
      for (let s of solids) {
        let closestX = Math.max(s.x, Math.min(newX, s.x + s.w));
        let closestY = Math.max(s.y, Math.min(newY, s.y + s.h));
        if (Math.hypot(newX - closestX, newY - closestY) < radius) return true;
      }
      return false;
    }

    function checkCoinPickups() {
      if (localPlayer.location !== 'world') return;
      mapCoins.forEach(coin => {
        if (coin.active && Math.hypot(localPlayer.x - coin.x, localPlayer.y - coin.y) < 25) {
          coin.active = false; localPlayer.coins += 10; cameraShake = 7; 
          spawnParticle(coin.x, coin.y, '#ffd54a', 16, 2.8, 34, 3.5); 
          spawnParticle(coin.x, coin.y, '#00ffcc', 12, 2.0, 28, 2.5);
          savePlayerData(); playCoinSFX(); showNotification("+$10 Coins!", 'success');
          setTimeout(() => {
            coin.x = Math.floor(Math.random() * (WORLD_WIDTH - 200)) + 100;
            coin.y = Math.floor(Math.random() * (WORLD_HEIGHT - 200)) + 100;
            coin.active = true;
          }, 10000);
        }
      });
    }

    function updateNPCs() {
      if (animFrame % 180 === 0) {
        trafficLights.forEach(tl => {
          tl.state = (tl.state === 'green') ? 'red' : 'green';
        });
      }

      npcCitizens.forEach(npc => {
        npc.x += npc.vx;
        npc.y += npc.vy;
        npc.walkCycle += 0.15;
        if (npc.vx !== 0 && (npc.x < npc.minX || npc.x > npc.maxX)) npc.vx *= -1;
        if (npc.vy !== 0 && (npc.y < npc.minY || npc.y > npc.maxY)) npc.vy *= -1;
      });

      npcVehicles.forEach(car => {
        car.x += car.vx;
        car.y += car.vy;
        if (car.x < 100) car.x = WORLD_WIDTH - 200;
        if (car.x > WORLD_WIDTH - 100) car.x = 200;
        if (car.y < 100) car.y = WORLD_HEIGHT - 200;
        if (car.y > WORLD_HEIGHT - 100) car.y = 200;
      });
    }

    function update() {
      animFrame++;
      visualTime = performance.now();
      dayClock = (dayClock + 0.000018) % 1;
      cameraShake *= 0.88;
      drawMinimap();
      updateParticles();
      cleanupGhostPlayers();
      updateNPCs();

      // Actualizar Rayos Kamehameha
      for (let i = beams.length - 1; i >= 0; i--) {
        let b = beams[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        spawnParticle(b.x, b.y, '#61d3ff', 3, 2, 20, 4);
        if (b.life <= 0) beams.splice(i, 1);
      }

      clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > WORLD_WIDTH + 100) c.x = -100;
      });

      let currentSpeed = localPlayer.speed;
      if (localPlayer.hasAura) currentSpeed += 3;
      if (localPlayer.isSuperSaiyan) currentSpeed += 4.5;
      if (localPlayer.isMounted) currentSpeed += 2.2;
      
      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) currentSpeed = v.speed;
      }

      let moveX = 0, moveY = 0;
      if (keys['ArrowUp'] || keys['w']) moveY -= 1;
      if (keys['ArrowDown'] || keys['s']) moveY += 1;
      if (keys['ArrowLeft'] || keys['a']) moveX -= 1;
      if (keys['ArrowRight'] || keys['d']) moveX += 1;

      if (moveX !== 0 || moveY !== 0) {
        localPlayer.isMoving = true;
        let len = Math.hypot(moveX, moveY);
        let vx = (moveX / len) * currentSpeed;
        let vy = (moveY / len) * currentSpeed;

        if (Math.abs(moveX) > Math.abs(moveY)) localPlayer.dir = moveX > 0 ? 'right' : 'left';
        else localPlayer.dir = moveY > 0 ? 'down' : 'up';

        let nextX = localPlayer.x + vx;
        let nextY = localPlayer.y + vy;

        if (!checkWallCollision(nextX, localPlayer.y, localPlayer.radius)) localPlayer.x = nextX;
        if (!checkWallCollision(localPlayer.x, nextY, localPlayer.radius)) localPlayer.y = nextY;

        if (animFrame % 6 === 0 && localPlayer.location === 'world' && !localPlayer.vehicle) {
          spawnParticle(localPlayer.x, localPlayer.y + 12, 'rgba(255,255,255,0.3)', 2, 0.6, 15, 2);
        }
        if (localPlayer.isMounted && animFrame % 2 === 0) {
          spawnParticle(localPlayer.x, localPlayer.y + 14, '#00ffcc', 2, 0.8, 16, 2.5);
        }
      } else {
        localPlayer.isMoving = false;
      }

      checkCoinPickups();

      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) { v.x = localPlayer.x; v.y = localPlayer.y; }
        if (localPlayer.isMoving && animFrame % 8 === 0) { playVehicleSFX(); cameraShake = Math.min(2.5, cameraShake + 0.3); }
      } else if (localPlayer.isMoving && animFrame % 16 === 0) {
        playFootstepSFX();
      }

      if (localPlayer.isMoving && Object.keys(connections).length > 0) {
        broadcast({ type: 'move', player: localPlayer, vehicles });
      }
    }

    function spawnParticle(x, y, color, count = 8, speed = 1.8, life = 40, size = 3) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * speed + 0.4;
        particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life, maxLife: life, color, size: Math.random()*size+.8, gravity:.02 });
      }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.vx *= 0.98; p.vy *= 0.98; p.life--;
        if (p.life <= 0) particles.splice(i,1);
      }
    }

    function drawParticles() {

        const a = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    }

    function drawVehicleLights(){
      const state=getDayState(); if(state==='DAY') return;
      ctx.shadowBlur=12;ctx.shadowColor='#ffe7a0';ctx.fillStyle='#ffe9a3';
      ctx.fillRect(23,-10,4,5);ctx.fillRect(23,5,4,5);
      ctx.shadowBlur=0;ctx.fillStyle='rgba(255,80,80,0.85)';ctx.fillRect(-28,-10,3,5);ctx.fillRect(-28,5,3,5);
    }

    function drawDetailedVehicle(x, y, color, type, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      if (type === 'truck') {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(-45, -22, 90, 44);

        ctx.fillStyle = '#111';
        ctx.fillRect(-35, -26, 14, 8); ctx.fillRect(-15, -26, 14, 8); ctx.fillRect(20, -26, 14, 8);
        ctx.fillRect(-35, 18, 14, 8); ctx.fillRect(-15, 18, 14, 8); ctx.fillRect(20, 18, 14, 8);

        ctx.fillStyle = color; ctx.fillRect(20, -18, 22, 36);
        ctx.fillStyle = '#222'; ctx.fillRect(26, -14, 10, 28);

        ctx.fillStyle = '#ecf0f1'; ctx.fillRect(-42, -20, 60, 40);
        ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 2; ctx.strokeRect(-42, -20, 60, 40);

      } else if (type === 'moto') {
        ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(-16, -10, 32, 20);

        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(-10, 0, 7, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(10, 0, 7, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = color; ctx.fillRect(-12, -6, 24, 12);
        ctx.fillStyle = '#fff'; ctx.fillRect(8, -4, 4, 8);

      } else {
        ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(-32, -18, 64, 36);

        ctx.fillStyle = '#111';
        ctx.fillRect(-22, -22, 12, 6); ctx.fillRect(10, -22, 12, 6);
        ctx.fillRect(-22, 16, 12, 6); ctx.fillRect(10, 16, 12, 6);

        ctx.fillStyle = color;
        ctx.beginPath(); ctx.roundRect(-28, -16, 56, 32, 6); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();

        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.roundRect(-12, -12, 26, 24, 4); ctx.fill();

        ctx.fillStyle = '#4592c4';
        ctx.fillRect(-8, -10, 8, 20); ctx.fillRect(4, -10, 6, 20);

        ctx.fillStyle = '#f1c40f'; ctx.fillRect(26, -12, 3, 6); ctx.fillRect(26, 6, 3, 6);
        ctx.fillStyle = '#e74c3c'; ctx.fillRect(-28, -12, 3, 6); ctx.fillRect(-28, 6, 3, 6);
      }

      if(type!=='truck'||type==='car') drawVehicleLights();
      ctx.restore();
    }

    function drawHouseInterior() {
      ctx.fillStyle = '#1a1311'; ctx.fillRect(100, 100, 600, 400);
      ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2; ctx.strokeRect(100, 100, 600, 400);
      
      ctx.fillStyle = '#2d1b17'; ctx.fillRect(250, 200, 300, 200);
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.strokeRect(250, 200, 300, 100);

      ctx.fillStyle = '#00ffcc'; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffcc';
      ctx.fillRect(300, 490, 100, 10); ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff'; ctx.font = '700 12px monospace'; ctx.textAlign = 'center'; ctx.fillText("EXIT TO CITY", 350, 480);
      
      let houseObj = houses.find(h => h.id === localPlayer.location);
      ctx.fillText(houseObj ? houseObj.furniture : '🛋️ Modern Interior', 400, 255);
    }

    function drawCharacterEntity(x, y, color, nameText, cycleVal = 0, motionType = 'none') {
      ctx.save();
      const bob = motionType !== 'none' ? Math.abs(Math.sin(cycleVal))*2 : 0;
      const leg = motionType !== 'none' ? Math.sin(cycleVal)*4 : 0;
      
      ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x,y+15,10,4,0,0,Math.PI*2);ctx.fill();

      ctx.strokeStyle='#10141a';ctx.lineWidth=4;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(x-3,y+3+bob);ctx.lineTo(x-4+leg,y+13);ctx.moveTo(x+3,y+3+bob);ctx.lineTo(x+4-leg,y+13);ctx.stroke();

      const body=ctx.createLinearGradient(x-8,y-10,x+8,y+5);body.addColorStop(0,color);body.addColorStop(1,'rgba(255,255,255,0.2)');
      ctx.fillStyle=body;roundedRectPath(x-8,y-9+bob,16,14,5);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.stroke();

      ctx.fillStyle='#f0c6a8';ctx.beginPath();ctx.arc(x,y-16+bob,8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#1e2630';ctx.beginPath();ctx.arc(x,y-19+bob,8,Math.PI,Math.PI*2);ctx.fill();

      ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.arc(x+3,y-16+bob,1.2,0,Math.PI*2);ctx.fill();
      ctx.restore();

      if(nameText){
        ctx.save();ctx.font='700 10px system-ui,sans-serif';ctx.textAlign='center';
        const tw=ctx.measureText(nameText).width+14;
        ctx.fillStyle='rgba(8,12,18,0.82)';roundedRectPath(x-tw/2,y+25,tw,18,6);ctx.fill();
        ctx.fillStyle='#aeb8c4';ctx.fillText(nameText,x,y+37);
        ctx.restore();
      }
    }

    function drawAvatar(p) {
      if (p.vehicle) return;
      const isMe = p.id === localPlayer.id;
      
      const speedMag = (keys['ArrowUp']||keys['ArrowDown']||keys['ArrowLeft']||keys['ArrowRight']||keys['w']||keys['a']||keys['s']||keys['d']) ? 1 : 0;
      const cycle = isMe && speedMag ? (animFrame*0.35) : (animFrame*0.1);
      
      let renderY = p.y;

      // Aura Super Saiyajin DBZ
      if (p.isSuperSaiyan) {
        const pulse = 22 + Math.sin(animFrame * 0.2) * 8;
        const g = ctx.createRadialGradient(p.x, renderY, pulse * 0.2, p.x, renderY, pulse * 2.5);
        g.addColorStop(0, 'rgba(255, 216, 107, 0.7)');
        g.addColorStop(1, 'rgba(255, 216, 107, 0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, renderY, pulse * 2.5, 0, Math.PI * 2); ctx.fill();
      }

      if (p.hasAura) {
        const pulse = 16 + Math.sin(animFrame * 0.15) * 4;
        const g = ctx.createRadialGradient(p.x, renderY, pulse*0.2, p.x, renderY, pulse);
        g.addColorStop(0, 'rgba(0, 255, 204, 0.5)'); g.addColorStop(1, 'rgba(0, 255, 204, 0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, renderY, pulse, 0, Math.PI*2); ctx.fill();
      }

      if (p.isMounted) {
        const bob = Math.sin(animFrame*0.15)*3; renderY -= (10 + bob);
        ctx.fillStyle = '#00ffcc'; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffcc';
        roundedRectPath(p.x - 14, p.y + 12, 28, 6, 3); ctx.fill(); ctx.shadowBlur = 0;
      }

      drawCharacterEntity(p.x, renderY, p.color, p.name, cycle, (p.isMoving||speedMag)?'walk':'none');

      // Cabello Super Saiyajin DBZ
      if (p.isSuperSaiyan) {
        ctx.save();
        ctx.fillStyle = '#ffea00';
        ctx.shadowBlur = 15; ctx.shadowColor = '#ffea00';
        ctx.beginPath();
        let hy = renderY - 24;
        ctx.moveTo(p.x - 8, hy + 5);
        ctx.lineTo(p.x - 14, hy - 8);
        ctx.lineTo(p.x - 4, hy - 4);
        ctx.lineTo(p.x, hy - 16);
        ctx.lineTo(p.x + 4, hy - 4);
        ctx.lineTo(p.x + 14, hy - 8);
        ctx.lineTo(p.x + 8, hy + 5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      if (p.equippedHat) {
        ctx.save();
        if (p.equippedHat === 'item_sunglasses') { ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('😎', p.x, renderY - 14); }
        else if (p.equippedHat === 'item_crown') { ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('👑', p.x, renderY - 22); }
        ctx.restore();
      }

      if (p.bubble && p.bubble.timer > Date.now()) {
        ctx.save();
        ctx.font = '700 11px system-ui,sans-serif'; ctx.textAlign = 'center';
        let w = ctx.measureText(p.bubble.text).width + 16;
        ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0,0,0,0.5)';
        roundedRectPath(p.x - w/2, renderY - 50, w, 20, 8); ctx.fill();
        ctx.beginPath(); ctx.moveTo(p.x - 4, renderY - 30); ctx.lineTo(p.x, renderY - 22); ctx.lineTo(p.x + 4, renderY - 30); ctx.fill();
        ctx.fillStyle = '#080c14'; ctx.shadowBlur = 0; ctx.fillText(p.bubble.text, p.x, renderY - 36);
        ctx.restore();
      }

      if (p.emote && p.emote.timer > Date.now()) {
        ctx.save();
        ctx.font = '28px sans-serif'; ctx.textAlign = 'center';
        let pop = Math.max(0, (p.emote.timer - Date.now()) / 3000);
        ctx.globalAlpha = pop; ctx.fillText(p.emote.symbol, p.x, renderY - 45 - (1-pop)*20);
        ctx.restore();
      }
    }

    // Dibujar Rayos Kamehameha DBZ
    function drawBeams() {
      beams.forEach(b => {
        ctx.save();
        ctx.shadowBlur = 20; ctx.shadowColor = '#61d3ff';
        let angle = Math.atan2(b.vy, b.vx);
        ctx.translate(b.x, b.y);
        ctx.rotate(angle);
        
        ctx.fillStyle = 'rgba(0, 179, 240, 0.8)';
        ctx.beginPath(); ctx.ellipse(0, 0, 50, 15, 0, 0, Math.PI*2); ctx.fill();
        
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 30; ctx.shadowColor = '#ffffff';
        ctx.beginPath(); ctx.ellipse(0, 0, 45, 8, 0, 0, Math.PI*2); ctx.fill();
        
        ctx.restore();
      });
    }

    function draw() {
      ctx.fillStyle = '#080c14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(dpr, dpr);

      let targetZoom = localPlayer.location === 'world' ? 1.0 : 1.4;
      camera.zoom += (targetZoom - camera.zoom) * 0.1;

      let cx = localPlayer.x - (canvas.width / dpr) / (2 * camera.zoom);
      let cy = localPlayer.y - (canvas.height / dpr) / (2 * camera.zoom);

      if (localPlayer.location === 'world') {
        cx = Math.max(0, Math.min(cx, WORLD_WIDTH - (canvas.width / dpr) / camera.zoom));
        cy = Math.max(0, Math.min(cy, WORLD_HEIGHT - (canvas.height / dpr) / camera.zoom));
      }

      camera.x += (cx - camera.x) * 0.15;
      camera.y += (cy - camera.y) * 0.15;

      let dx = cameraShake * (Math.random() - 0.5);
      let dy = cameraShake * (Math.random() - 0.5);

      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(-camera.x + dx, -camera.y + dy);

      if (localPlayer.location === 'world') drawWorld(); else drawHouseInterior();

      for (let id in players) {
        if (players[id].location === localPlayer.location) drawAvatar(players[id]);
      }
      drawAvatar(localPlayer);
      drawBeams();

      if (localPlayer.location === 'world') {
        const hg = ctx.createRadialGradient(localPlayer.x, localPlayer.y, 100, localPlayer.x, localPlayer.y, 400);
        hg.addColorStop(0, 'rgba(0,0,0,0)'); hg.addColorStop(1, 'rgba(8,12,20,0.3)');
        ctx.fillStyle = hg; ctx.fillRect(camera.x - dx, camera.y - dy, canvas.width/dpr/camera.zoom, canvas.height/dpr/camera.zoom);
      }

      ctx.restore();
    }

    function gameLoop() {
      update(); draw();
      requestAnimationFrame(gameLoop);
    }
    function setSupabaseStatus(state, message) {
      const box = document.getElementById('supabase-status');
      const text = document.getElementById('supabase-status-text');
      if (!box || !text) return;
      box.classList.remove('ok', 'warn', 'error');
      if (state) box.classList.add(state);
      text.innerText = message;
    }

    function initSupabaseClient() {
      try {
        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
          throw new Error('Supabase JS no está disponible.');
        }
        if (!supabaseClient) {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
              persistSession: false,
              autoRefreshToken: false,
              detectSessionInUrl: false
            }
          });
        }
        supabaseEnabled = true;
        return true;
      } catch (err) {
        supabaseEnabled = false;
        setSupabaseStatus('warn', 'CLOUD SAVE OFFLINE · LOCAL SAVE');
        console.warn('[Supabase] No se pudo inicializar:', err);
        return false;
      }
    }

    async function iniciarJugador(nombreIngresado, colorIngresado = selectedColor) {
      if (!nombreIngresado) return false;
      if (!initSupabaseClient()) return false;

      setSupabaseStatus('', 'CONNECTING CLOUD...');

      try {
        let { data: user, error } = await supabaseClient
          .from('users')
          .select('id, username, coins, outfit_color, avatar, inventory, equipped_hat')
          .eq('username', nombreIngresado)
          .maybeSingle();

        if (error) throw error;

        if (!user) {
          const { data: newUser, error: insertError } = await supabaseClient
            .from('users')
            .insert([{
              username: nombreIngresado,
              coins: localPlayer.coins,
              outfit_color: colorIngresado || '#ffffff',
              avatar: selectedAvatar || 'martin',
              inventory: localPlayer.inventory || [],
              equipped_hat: localPlayer.equippedHat || null
            }])
            .select('id, username, coins, outfit_color, avatar, inventory, equipped_hat')
            .single();

          if (insertError) {
            // Si otro cliente creó el mismo username durante el INSERT,
            // recuperamos el registro existente.
            const { data: existingUser, error: retryError } = await supabaseClient
              .from('users')
              .select('id, username, coins, outfit_color, avatar, inventory, equipped_hat')
              .eq('username', nombreIngresado)
              .maybeSingle();

            if (retryError || !existingUser) throw insertError;
            user = existingUser;
          } else {
            user = newUser;
          }
        }

        supabasePlayerId = user.id;
        localPlayer.id = String(user.id);
        localPlayer.name = user.username || nombreIngresado;

        if (typeof user.avatar === 'string' && ['martin', 'gaby', 'default'].includes(user.avatar)) {
          localPlayer.avatar = user.avatar;
          selectedAvatar = user.avatar;
          const avatarSelect = document.getElementById('avatar-select');
          if (avatarSelect) avatarSelect.value = user.avatar;
        }

        if (Array.isArray(user.inventory)) {
          localPlayer.inventory = user.inventory;
        }

        if (typeof user.equipped_hat === 'string' && user.equipped_hat) {
          localPlayer.equippedHat = user.equipped_hat;
        } else if (user.equipped_hat === null) {
          localPlayer.equippedHat = null;
        }

        const cloudCoins = Number(user.coins);
        if (Number.isFinite(cloudCoins) && cloudCoins >= 0) {
          localPlayer.coins = Math.floor(cloudCoins);
        }

        if (typeof user.outfit_color === 'string' && user.outfit_color.trim()) {
          localPlayer.color = user.outfit_color;
          selectedColor = user.outfit_color;
          const colorSelect = document.getElementById('color-select');
          if (colorSelect && [...colorSelect.options].some(o => o.value === user.outfit_color)) {
            colorSelect.value = user.outfit_color;
          }
          localStorage.setItem('nh_last_color', user.outfit_color);
        }

        setSupabaseStatus('ok', 'CLOUD SAVE CONNECTED');
        console.log(`[Supabase] Perfil sincronizado: ${localPlayer.name} · ${localPlayer.coins} coins`);
        return true;
      } catch (err) {
        supabasePlayerId = null;
        supabaseEnabled = false;
        setSupabaseStatus('warn', 'CLOUD SAVE OFFLINE · LOCAL SAVE');
        console.warn('[Supabase] El juego continúa en modo local:', err?.message || err);
        return false;
      }
    }

    function queueSupabasePlayerSave() {
      if (!supabaseEnabled || !supabaseClient || !supabasePlayerId || !localPlayer.name) return;

      supabaseSaveQueued = true;
      clearTimeout(supabaseSaveTimer);
      supabaseSaveTimer = setTimeout(flushSupabasePlayerSave, 350);
    }

    async function flushSupabasePlayerSave() {
      if (!supabaseEnabled || !supabaseClient || !supabasePlayerId || !localPlayer.name) return;
      if (supabaseSaveInFlight) {
        supabaseSaveQueued = true;
        return;
      }

      supabaseSaveInFlight = true;
      supabaseSaveQueued = false;

      try {
        const { error } = await supabaseClient
          .from('users')
          .update({
            coins: Math.max(0, Math.floor(Number(localPlayer.coins) || 0)),
            outfit_color: localPlayer.color || selectedColor || '#ffffff',
            avatar: localPlayer.avatar || selectedAvatar || 'martin',
            inventory: Array.isArray(localPlayer.inventory) ? localPlayer.inventory : [],
            equipped_hat: localPlayer.equippedHat || null
          })
          .eq('id', supabasePlayerId);

        if (error) throw error;
      } catch (err) {
        supabaseEnabled = false;
        setSupabaseStatus('warn', 'CLOUD SAVE ERROR · LOCAL SAVE');
        console.warn('[Supabase] No se pudo guardar el perfil:', err?.message || err);
      } finally {
        supabaseSaveInFlight = false;
        if (supabaseSaveQueued) {
          clearTimeout(supabaseSaveTimer);
          supabaseSaveTimer = setTimeout(flushSupabasePlayerSave, 350);
        }
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flushSupabasePlayerSave();
    });

    // Inicialización temprana: no bloquea el menú.
    initSupabaseClient();
  </script>
