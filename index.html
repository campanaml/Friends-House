<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Friends Neighborhood - Personal Homes</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; touch-action: manipulation; }
    body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    #setup-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10; padding: 15px;
    }
    .card { border: 2px solid #fff; padding: 20px; background: #000; text-align: center; width: 100%; max-width: 380px; }
    input { width: 100%; padding: 10px; margin: 8px 0; background: #111; color: #fff; border: 1px solid #fff; outline: none; font-size: 13px; text-align: center; }
    .options-grid { display: flex; justify-content: space-between; margin: 8px 0; gap: 4px; }
    .opt-btn { border: 1px solid #fff; padding: 8px; cursor: pointer; background: #111; flex: 1; font-size: 11px; text-align: center; color: #fff; }
    .opt-btn.selected { background: #fff; color: #000; font-weight: bold; }
    .color-swatch { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #fff; display: inline-block; cursor: pointer; }
    .color-swatch.selected { outline: 2px solid #fff; outline-offset: 2px; }
    button.start { padding: 12px; background: #fff; color: #000; border: none; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; margin-top: 10px; }

    #version-tag { font-size: 10px; color: #888; margin-top: 8px; }

    #game-container { position: relative; display: none; width: 100vw; max-width: 800px; margin: 0 auto; }
    .canvas-wrapper { position: relative; width: 100%; padding-top: 75%; }
    canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: 2px solid #fff; background: #000; display: block; }
    
    #room-info { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.85); border: 1px solid #fff; padding: 6px; font-size: 11px; z-index: 2; }
    #player-list { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.85); border: 1px solid #fff; padding: 6px; font-size: 11px; z-index: 2; width: 140px; }
    
    #chat-container { position: absolute; bottom: 8px; left: 8px; width: 240px; max-width: 50%; background: rgba(0,0,0,0.85); border: 1px solid #fff; padding: 6px; z-index: 2; }
    #chat-header { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: bold; cursor: pointer; user-select: none; border-bottom: 1px solid #444; padding-bottom: 2px; margin-bottom: 4px; }
    #chat-header:hover { color: #ff0; }
    #chat-body { display: block; }
    #chat-container.minimized #chat-body { display: none; }
    #chat-container.minimized #chat-header { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    #chat-logs { height: 70px; overflow-y: auto; font-size: 10px; margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; word-break: break-word; }
    #chat-input { width: 100%; padding: 4px; background: #111; color: #fff; border: 1px solid #fff; outline: none; font-size: 10px; text-align: left; }

    #emote-bar { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
    .emote-btn { background: #111; border: 1px solid #fff; padding: 4px 8px; cursor: pointer; font-size: 14px; color: #fff; }
    .emote-btn:active { background: #fff; }

    #controls-container { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding: 0 10px; }
    #dpad { display: grid; grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 42px); gap: 4px; user-select: none; }
    .dbtn { background: #111; border: 1px solid #fff; color: #fff; font-size: 16px; font-weight: bold; display: flex; justify-content: center; align-items: center; border-radius: 4px; cursor: pointer; }
    .dbtn:active { background: #fff; color: #000; }
    
    .action-group { display: flex; flex-direction: column; gap: 6px; align-items: center; }
    #action-btn { width: 80px; height: 60px; background: #111; border: 2px solid #fff; color: #fff; font-size: 12px; font-weight: bold; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; user-select: none; text-align: center; }
    #action-btn:active { background: #fff; color: #000; }
    #reset-btn { background: #222; border: 1px solid #888; color: #aaa; font-size: 9px; padding: 4px 8px; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="setup-modal">
    <div class="card">
      <h2 style="margin-bottom: 8px;">NEIGHBORHOOD</h2>
      
      <p style="font-size: 10px; color: #aaa;">ENTER YOUR NAME:</p>
      <input type="text" id="username-input" placeholder="Your Name..." maxlength="15">

      <p style="font-size: 10px; color: #aaa; margin-top: 4px;">WORLD / ROOM NAME:</p>
      <input type="text" id="world-id-input" placeholder="e.g. main-town" value="main-town" maxlength="20">

      <p style="font-size: 10px; margin-top: 4px; color: #aaa;">CHOOSE YOUR AVATAR:</p>
      <div class="options-grid">
        <div class="opt-btn selected" id="btn-martin" onclick="selectAvatar('martin')">🕶️ Martin</div>
        <div class="opt-btn" id="btn-gaby" onclick="selectAvatar('gaby')">🎧 Gaby</div>
        <div class="opt-btn" id="btn-facu" onclick="selectAvatar('facu')">🧢 Facu</div>
      </div>

      <p style="font-size: 10px; margin-top: 4px; color: #aaa;">SELECT COLOR TINT:</p>
      <div class="options-grid" style="justify-content:center; gap:8px;">
        <div class="color-swatch selected" style="background:#ffffff;" onclick="selectColor('#ffffff', this)"></div>
        <div class="color-swatch" style="background:#aaaaaa;" onclick="selectColor('#aaaaaa', this)"></div>
        <div class="color-swatch" style="background:#555555;" onclick="selectColor('#555555', this)"></div>
        <div class="color-swatch" style="background:#e8a5a5;" onclick="selectColor('#e8a5a5', this)"></div>
        <div class="color-swatch" style="background:#a5e8c5;" onclick="selectColor('#a5e8c5', this)"></div>
      </div>

      <button class="start" onclick="enterHouse()">ENTER WORLD</button>
      <div id="version-tag">Build: v1.6.1 (Auto-Disconnect Cleaned)</div>
    </div>
  </div>

  <div id="game-container">
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      
      <div id="room-info">
        <div>WORLD: <span id="display-room-code" style="font-weight:bold; color:#0f0;">MAIN-TOWN</span></div>
        <div id="location-tag" style="font-weight:bold; color:#0f0; margin-top:2px;">HOME</div>
        <div id="status-tag" style="font-size: 9px; color: #0f0; margin-top:2px;">Connecting...</div>
      </div>

      <div id="player-list">
        <div style="font-weight:bold; border-bottom:1px solid #fff; margin-bottom:4px;">HERE NOW</div>
        <div id="player-names"></div>
      </div>

      <div id="chat-container">
        <div id="chat-header" onclick="toggleChat()">
          <span>CHAT</span>
          <span id="chat-toggle-icon">[–]</span>
        </div>
        <div id="chat-body">
          <div id="chat-logs"></div>
          <input type="text" id="chat-input" placeholder="Chat... (Enter)" maxlength="60" />
        </div>
      </div>

      <div id="emote-bar">
        <button class="emote-btn" onclick="sendEmote('👋')">👋</button>
        <button class="emote-btn" onclick="sendEmote('❤️')">❤️</button>
        <button class="emote-btn" onclick="sendEmote('😂')">😂</button>
        <button class="emote-btn" onclick="sendEmote('🎵')">🎵</button>
      </div>
    </div>

    <div id="controls-container">
      <div id="dpad">
        <div></div><div class="dbtn" id="btn-up">▲</div><div></div>
        <div class="dbtn" id="btn-left">◀</div><div></div><div class="dbtn" id="btn-right">▶</div>
        <div></div><div class="dbtn" id="btn-down">▼</div><div></div>
      </div>
      <div class="action-group">
        <div id="action-btn" onclick="triggerInteraction()">INTERACT<br>(E)</div>
        <button id="reset-btn" onclick="resetPosition()">Go Home</button>
      </div>
    </div>
  </div>

  <script>
    const GAME_VERSION = "1.6.1";
    let activeWorldRoom = "main-town";

    let selectedAvatar = 'martin';
    let selectedColor = '#ffffff';

    // Auto-load saved settings
    window.addEventListener('load', () => {
      const savedName = localStorage.getItem('nh_name');
      const savedAvatar = localStorage.getItem('nh_avatar');
      const savedColor = localStorage.getItem('nh_color');
      const savedRoom = localStorage.getItem('nh_room');

      if (savedName) document.getElementById('username-input').value = savedName;
      if (savedAvatar) selectAvatar(savedAvatar);
      if (savedColor) {
        selectedColor = savedColor;
        document.querySelectorAll('.color-swatch').forEach(s => {
          s.classList.toggle('selected', s.style.backgroundColor === savedColor || s.getAttribute('style').includes(savedColor));
        });
      }
      if (window.location.hash) {
        document.getElementById('world-id-input').value = window.location.hash.replace('#', '');
      } else if (savedRoom) {
        document.getElementById('world-id-input').value = savedRoom;
      }
    });

    // Handle immediate graceful disconnect on tab close/reload
    window.addEventListener('beforeunload', () => {
      if (localPlayer.id) {
        broadcast({ type: 'leave', id: localPlayer.id });
      }
      if (peer) peer.destroy();
    });

    function selectAvatar(type) {
      selectedAvatar = type;
      document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('selected'));
      let btn = document.getElementById(`btn-${type}`);
      if (btn) btn.classList.add('selected');
    }

    function selectColor(colorHex, el) {
      selectedColor = colorHex;
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
    }

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playAudioTone(freq, type = 'square', duration = 0.1, vol = 0.05) {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function playFootstepSFX() { playAudioTone(100 + Math.random()*40, 'triangle', 0.04, 0.02); }
    function playVehicleSFX() { playAudioTone(80 + Math.random()*20, 'sawtooth', 0.06, 0.03); }
    function playDoorSFX() { playAudioTone(150, 'sine', 0.15, 0.05); setTimeout(() => playAudioTone(300, 'sine', 0.2, 0.05), 100); }
    function playChatChime() { playAudioTone(587.33, 'sine', 0.08, 0.04); setTimeout(() => playAudioTone(880, 'sine', 0.12, 0.04), 80); }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const WORLD_WIDTH = 2400;
    const WORLD_HEIGHT = 1600;

    let localPlayer = { 
      id: '', name: 'Player', avatar: 'martin', color: '#ffffff', x: 400, y: 450, speed: 4, radius: 12,
      dir: 'down', isMoving: false, location: 'house_martin', vehicle: null, bubble: null, emote: null
    };
    
    let players = {}; 
    let keys = {};
    let peer = null;
    let connections = {};
    let isHost = false;
    let animFrame = 0;

    const houses = [
      { id: 'house_martin', name: "Martin's House", owner: 'martin', x: 100, y: 100, w: 400, h: 300, doorX: 300, doorY: 400, exitX: 300, exitY: 430, furniture: '🕶️ Martin Studio' },
      { id: 'house_gaby', name: "Gaby's House", owner: 'gaby', x: 1000, y: 100, w: 400, h: 300, doorX: 1200, doorY: 400, exitX: 1200, exitY: 430, furniture: '🎧 Gaby Lounge' },
      { id: 'house_facu', name: "Facu's House", owner: 'facu', x: 1800, y: 100, w: 400, h: 300, doorX: 2000, doorY: 400, exitX: 2000, exitY: 430, furniture: '🧢 Facu Room' }
    ];

    let vehicles = [
      { id: 'car1', type: 'car', icon: '🚗', x: 550, y: 450, w: 40, h: 40, driver: null, speed: 8, location: 'world' },
      { id: 'bike1', type: 'bike', icon: '🛵', x: 1450, y: 450, w: 30, h: 30, driver: null, speed: 10, location: 'world' },
      { id: 'plane1', type: 'plane', icon: '✈️', x: 1200, y: 1200, w: 60, h: 60, driver: null, speed: 13, location: 'world' }
    ];

    const outdoorSolids = [
      { x: 0, y: 0, w: WORLD_WIDTH, h: 10 },
      { x: 0, y: WORLD_HEIGHT - 10, w: WORLD_WIDTH, h: 10 },
      { x: 0, y: 0, w: 10, h: WORLD_HEIGHT },
      { x: WORLD_WIDTH - 10, y: 0, w: 10, h: WORLD_HEIGHT },
      { x: 100, y: 100, w: 400, h: 300 },
      { x: 1000, y: 100, w: 400, h: 300 },
      { x: 1800, y: 100, w: 400, h: 300 }
    ];

    const houseSolids = [
      { x: 100, y: 100, w: 600, h: 10 },
      { x: 100, y: 100, w: 10, h: 400 },
      { x: 690, y: 100, w: 10, h: 400 },
      { x: 100, y: 490, w: 250, h: 10 },
      { x: 450, y: 490, w: 250, h: 10 },
      { x: 250, y: 200, w: 300, h: 100 }
    ];

    function toggleChat() {
      const chatContainer = document.getElementById('chat-container');
      const toggleIcon = document.getElementById('chat-toggle-icon');
      chatContainer.classList.toggle('minimized');
      toggleIcon.innerText = chatContainer.classList.contains('minimized') ? '[+]' : '[–]';
    }

    function sanitizeText(str) {
      let temp = document.createElement('div');
      temp.textContent = str;
      return temp.innerHTML;
    }

    function resetPosition() {
      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) v.driver = null;
        localPlayer.vehicle = null;
      }
      localPlayer.location = `house_${localPlayer.avatar}`;
      localPlayer.x = 400;
      localPlayer.y = 450;
      let homeObj = houses.find(h => h.id === localPlayer.location);
      document.getElementById('location-tag').innerText = homeObj ? homeObj.name.toUpperCase() : "HOME";
      broadcast({ type: 'move', player: localPlayer, vehicles });
      updatePlayerList();
    }

    function enterHouse() {
      initAudio();
      
      const customName = document.getElementById('username-input').value.trim();
      activeWorldRoom = document.getElementById('world-id-input').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || "main-town";
      window.location.hash = activeWorldRoom;
      document.getElementById('display-room-code').innerText = activeWorldRoom.toUpperCase();

      localPlayer.name = customName || (selectedAvatar.charAt(0).toUpperCase() + selectedAvatar.slice(1));
      localPlayer.avatar = selectedAvatar;
      localPlayer.color = selectedColor;
      localPlayer.id = Math.random().toString(36).substring(2, 7);
      localPlayer.location = `house_${selectedAvatar}`;
      localPlayer.x = 400;
      localPlayer.y = 450;

      localStorage.setItem('nh_name', localPlayer.name);
      localStorage.setItem('nh_avatar', selectedAvatar);
      localStorage.setItem('nh_color', selectedColor);
      localStorage.setItem('nh_room', activeWorldRoom);

      let homeObj = houses.find(h => h.id === localPlayer.location);
      document.getElementById('location-tag').innerText = homeObj ? homeObj.name.toUpperCase() : "HOME";

      document.getElementById('setup-modal').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      setupMobileControls();
      initMultiplayerGlobal();
      requestAnimationFrame(gameLoop);
    }

    function setupMobileControls() {
      const bindTouch = (id, keyName) => {
        const btn = document.getElementById(id);
        const start = (e) => { e.preventDefault(); keys[keyName] = true; };
        const end = (e) => { e.preventDefault(); keys[keyName] = false; };
        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
      };
      bindTouch('btn-up', 'ArrowUp'); bindTouch('btn-down', 'ArrowDown');
      bindTouch('btn-left', 'ArrowLeft'); bindTouch('btn-right', 'ArrowRight');
    }

    function initMultiplayerGlobal() {
      const hostRoomId = `nh-${activeWorldRoom}-host-v16`;
      const joinDelay = Math.floor(Math.random() * 300);

      setTimeout(() => {
        peer = new Peer(hostRoomId);

        peer.on('open', () => {
          isHost = true;
          document.getElementById('status-tag').innerText = "HOSTING WORLD";
        });

        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            peer = new Peer();
            peer.on('open', () => {
              document.getElementById('status-tag').innerText = "CONNECTED";
              connectToHost(hostRoomId);
            });
            peer.on('connection', (conn) => bindConnectionEvents(conn));
          }
        });

        peer.on('connection', (conn) => bindConnectionEvents(conn));
      }, joinDelay);
    }

    function connectToHost(hostRoomId) {
      let hostConn = peer.connect(hostRoomId, { reliable: true });
      bindConnectionEvents(hostConn);
    }

    function bindConnectionEvents(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.send({ type: 'sync', player: localPlayer, vehicles, version: GAME_VERSION });
      });

      conn.on('data', (data) => {
        if (data.type === 'leave') {
          // Immediately purge leaving avatar
          delete players[data.id];
          updatePlayerList();

          if (isHost) {
            for (let pId in connections) {
              if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
            }
          }
        } else if (data.type === 'sync' || data.type === 'move') {
          data.player.lastSeen = Date.now(); // Timestamp heartbeat update
          players[data.player.id] = data.player;
          if (data.vehicles) vehicles = data.vehicles;
          
          if (data.type === 'sync' && !isHost) {
            conn.send({ type: 'move', player: localPlayer, vehicles, version: GAME_VERSION });
          }

          if (isHost) {
            for (let pId in connections) {
              if (pId !== conn.peer && connections[pId].open) {
                connections[pId].send(data);
              }
            }
          }
        } else if (data.type === 'chat') {
          let sameLocation = (data.location === localPlayer.location);
          let dist = Math.hypot(localPlayer.x - data.x, localPlayer.y - data.y);
          let isNear = sameLocation && dist < 500;
          let text = isNear ? data.message : "...[distant chat]...";
          
          addChatMessage(data.name, text);
          if (players[data.id] && sameLocation) setSpeechBubble(players[data.id], data.message);
          playChatChime();

          if (isHost) {
            for (let pId in connections) {
              if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
            }
          }
        } else if (data.type === 'emote') {
          if (players[data.id]) setEmote(players[data.id], data.emote);
          if (isHost) {
            for (let pId in connections) {
              if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
            }
          }
        }
        updatePlayerList();
      });

      conn.on('close', () => {
        delete connections[conn.peer];
        delete players[conn.peer];
        updatePlayerList();
      });
    }

    function broadcast(data) {
      for (let peerId in connections) {
        if (connections[peerId].open) connections[peerId].send(data);
      }
    }

    function cleanupGhostPlayers() {
      const now = Date.now();
      let changed = false;
      for (let id in players) {
        if (id !== localPlayer.id) {
          // Remove players who haven't sent state in over 4 seconds
          if (players[id].lastSeen && now - players[id].lastSeen > 4000) {
            delete players[id];
            changed = true;
          }
        }
      }
      if (changed) updatePlayerList();
    }

    function updatePlayerList() {
      const listEl = document.getElementById('player-names');
      let html = `<div>• ${localPlayer.name} (You)</div>`;
      for (let id in players) {
        if (id !== localPlayer.id && players[id].location === localPlayer.location) {
          html += `<div>• ${players[id].name}</div>`;
        }
      }
      listEl.innerHTML = html;
    }

    window.addEventListener('keydown', e => {
      if (document.activeElement === document.getElementById('chat-input')) return;
      keys[e.key] = true;
      if (e.key === 'e' || e.key === 'E') triggerInteraction();
    });
    window.addEventListener('keyup', e => {
      if (document.activeElement === document.getElementById('chat-input')) return;
      keys[e.key] = false;
    });

    const chatInput = document.getElementById('chat-input');
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && chatInput.value.trim() !== '') {
        const msg = sanitizeText(chatInput.value.trim());
        addChatMessage(localPlayer.name, msg);
        setSpeechBubble(localPlayer, msg);
        broadcast({ 
          type: 'chat', id: localPlayer.id, name: localPlayer.name, 
          message: msg, x: localPlayer.x, y: localPlayer.y, location: localPlayer.location 
        });
        chatInput.value = '';
        chatInput.blur();
      }
    });

    function setSpeechBubble(p, text) { p.bubble = { text, timer: Date.now() + 4000 }; }
    function sendEmote(emote) { setEmote(localPlayer, emote); broadcast({ type: 'emote', id: localPlayer.id, emote }); }
    function setEmote(p, emote) { p.emote = { symbol: emote, timer: Date.now() + 3000 }; }

    function addChatMessage(sender, text) {
      const logs = document.getElementById('chat-logs');
      const msgDiv = document.createElement('div');
      msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
      logs.appendChild(msgDiv);
      logs.scrollTop = logs.scrollHeight;
    }

    function triggerInteraction() {
      if (localPlayer.location === 'world') {
        if (localPlayer.vehicle) {
          let v = vehicles.find(item => item.id === localPlayer.vehicle);
          if (v) {
            v.driver = null;
            localPlayer.x = v.x + 40;
            localPlayer.y = v.y + 40;
          }
          localPlayer.vehicle = null;
          broadcast({ type: 'move', player: localPlayer, vehicles });
          return;
        }

        vehicles.forEach(v => {
          if (!v.driver && Math.hypot(localPlayer.x - v.x, localPlayer.y - v.y) < 50) {
            v.driver = localPlayer.id;
            localPlayer.vehicle = v.id;
          }
        });

        houses.forEach(h => {
          if (Math.hypot(localPlayer.x - h.doorX, localPlayer.y - h.doorY) < 40) {
            localPlayer.location = h.id;
            localPlayer.x = 400; localPlayer.y = 450;
            playDoorSFX();
            document.getElementById('location-tag').innerText = h.name.toUpperCase();
          }
        });
      } else {
        if (Math.hypot(localPlayer.x - 400, localPlayer.y - 480) < 50) {
          let h = houses.find(item => item.id === localPlayer.location);
          localPlayer.location = 'world';
          localPlayer.x = h ? h.exitX : 300;
          localPlayer.y = h ? h.exitY : 430;
          playDoorSFX();
          document.getElementById('location-tag').innerText = "WORLD";
        }
      }
      broadcast({ type: 'move', player: localPlayer, vehicles });
      updatePlayerList();
    }

    function checkWallCollision(newX, newY, radius) {
      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v && v.type === 'plane') return false;
      }

      let solids = localPlayer.location === 'world' ? outdoorSolids : houseSolids;
      for (let s of solids) {
        let closestX = Math.max(s.x, Math.min(newX, s.x + s.w));
        let closestY = Math.max(s.y, Math.min(newY, s.y + s.h));
        if (Math.hypot(newX - closestX, newY - closestY) < radius) return true;
      }
      return false;
    }

    function update() {
      animFrame++;
      cleanupGhostPlayers();

      let currentSpeed = localPlayer.speed;

      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) currentSpeed = v.speed;
      }

      let nextX = localPlayer.x;
      let nextY = localPlayer.y;
      localPlayer.isMoving = false;

      if (keys['ArrowUp'] || keys['w']) { nextY -= currentSpeed; localPlayer.dir = 'up'; localPlayer.isMoving = true; }
      if (keys['ArrowDown'] || keys['s']) { nextY += currentSpeed; localPlayer.dir = 'down'; localPlayer.isMoving = true; }
      if (keys['ArrowLeft'] || keys['a']) { nextX -= currentSpeed; localPlayer.dir = 'left'; localPlayer.isMoving = true; }
      if (keys['ArrowRight'] || keys['d']) { nextX += currentSpeed; localPlayer.dir = 'right'; localPlayer.isMoving = true; }

      if (!checkWallCollision(nextX, localPlayer.y, localPlayer.radius)) localPlayer.x = nextX;
      if (!checkWallCollision(localPlayer.x, nextY, localPlayer.radius)) localPlayer.y = nextY;

      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) { v.x = localPlayer.x; v.y = localPlayer.y; }
        if (localPlayer.isMoving && animFrame % 10 === 0) playVehicleSFX();
      } else if (localPlayer.isMoving && animFrame % 18 === 0) {
        playFootstepSFX();
      }

      if ((localPlayer.isMoving || animFrame % 60 === 0) && Object.keys(connections).length > 0) {
        broadcast({ type: 'move', player: localPlayer, vehicles });
      }
    }

    function drawWorld() {
      ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 2;

      ctx.strokeStyle = '#333'; ctx.lineWidth = 60; ctx.beginPath();
      ctx.moveTo(0, 500); ctx.lineTo(WORLD_WIDTH, 500);
      ctx.moveTo(800, 0); ctx.lineTo(800, WORLD_HEIGHT);
      ctx.moveTo(1600, 0); ctx.lineTo(1600, WORLD_HEIGHT);
      ctx.stroke();

      ctx.fillStyle = '#222'; ctx.fillRect(800, 1150, 900, 100);
      ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.fillText("AIRSTRIP", 1200, 1205);

      ctx.lineWidth = 2;
      houses.forEach(h => {
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(h.x, h.y, h.w, h.h);
        ctx.fillText(h.name, h.x + 150, h.y + 150);
        
        ctx.fillStyle = '#0f0';
        ctx.fillRect(h.doorX - 20, h.doorY - 5, 40, 10);
        ctx.fillStyle = '#fff';
      });

      vehicles.forEach(v => {
        if (v.location === 'world') {
          ctx.font = '24px monospace'; ctx.textAlign = 'center';
          ctx.fillText(v.icon, v.x, v.y);
        }
      });
    }

    function drawHouseInterior() {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
      ctx.strokeRect(100, 100, 600, 400);

      ctx.fillStyle = '#0f0';
      ctx.fillRect(350, 490, 100, 10);
      ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
      ctx.fillText("EXIT TO WORLD", 400, 480);

      ctx.strokeRect(250, 200, 300, 100);
      let houseObj = houses.find(h => h.id === localPlayer.location);
      ctx.fillText(houseObj ? houseObj.furniture : '🛋️ Interior', 400, 255);
    }

    function drawAvatar(p) {
      ctx.fillStyle = p.color || '#ffffff';
      ctx.strokeStyle = p.color || '#ffffff';
      ctx.lineWidth = 2;

      let bobY = (p.isMoving && !p.vehicle) ? Math.sin(animFrame * 0.3) * 3 : 0;
      let renderY = p.y + bobY;

      if (!p.vehicle) {
        ctx.beginPath();
        if (p.avatar === 'martin') {
          ctx.arc(p.x, renderY - 4, 10, 0, Math.PI * 2);
          ctx.rect(p.x - 8, renderY + 6, 16, 12);
          ctx.stroke();
          ctx.fillRect(p.x - 6, renderY - 6, 12, 4);
        } else if (p.avatar === 'gaby') {
          ctx.arc(p.x, renderY - 4, 10, 0, Math.PI * 2);
          ctx.rect(p.x - 8, renderY + 6, 16, 12);
          ctx.stroke();
          ctx.fillRect(p.x - 12, renderY - 8, 4, 8);
          ctx.fillRect(p.x + 8, renderY - 8, 4, 8);
        } else {
          ctx.arc(p.x, renderY - 4, 10, 0, Math.PI * 2);
          ctx.rect(p.x - 8, renderY + 6, 16, 12);
          ctx.stroke();
          ctx.fillRect(p.x - 10, renderY - 12, 16, 3);
        }
      }

      ctx.font = '12px monospace'; ctx.textAlign = 'center';
      ctx.fillText(p.name, p.x, renderY - 24);

      if (p.bubble && Date.now() < p.bubble.timer) {
        ctx.fillStyle = '#fff'; ctx.fillRect(p.x - 45, renderY - 50, 90, 20);
        ctx.fillStyle = '#000'; ctx.font = '10px monospace';
        ctx.fillText(p.bubble.text.substring(0, 12), p.x, renderY - 36);
      }

      if (p.emote && Date.now() < p.emote.timer) {
        ctx.font = '16px monospace'; ctx.fillText(p.emote.symbol, p.x, renderY - 54);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();

      if (localPlayer.location === 'world') {
        let camX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, localPlayer.x - canvas.width / 2));
        let camY = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, localPlayer.y - canvas.height / 2));
        ctx.translate(-camX, -camY);

        drawWorld();
      } else {
        drawHouseInterior();
      }

      drawAvatar(localPlayer);

      for (let id in players) {
        if (id !== localPlayer.id && players[id].location === localPlayer.location) {
          drawAvatar(players[id]);
        }
      }

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
