<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Multiplayer Virtual Space</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; color: #fff; }

    /* Modal Overlay */
    #setup-modal {
      position: fixed; inset: 0; background: rgba(10, 10, 15, 0.95);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .card {
      background: #181824; border: 1px solid #2d2d3f; border-radius: 12px;
      padding: 28px; text-align: center; width: 320px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .card h2 { margin-bottom: 16px; font-size: 20px; letter-spacing: 1px; color: #7c4dff; }
    input {
      width: 100%; padding: 12px; margin: 8px 0; background: #0f0f17;
      color: #fff; border: 1px solid #33334d; border-radius: 6px; outline: none; user-select: text;
    }
    input:focus { border-color: #7c4dff; }
    button {
      width: 100%; padding: 12px; background: #6200ea; color: #fff;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 12px;
      transition: background 0.2s;
    }
    button:hover { background: #7c4dff; }

    /* Game UI Elements */
    #game-container { position: relative; width: 100vw; height: 100vh; display: none; }
    #canvas3d { width: 100%; height: 100%; display: block; }
    
    #hud {
      position: absolute; top: 16px; left: 16px; font-size: 12px;
      background: rgba(15, 15, 23, 0.8); border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 14px; border-radius: 8px; backdrop-filter: blur(4px);
    }
    #hud span { font-weight: bold; color: #7c4dff; }
    
    #interact-prompt {
      position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
      background: rgba(124, 77, 255, 0.9); color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: 13px; font-weight: bold; display: none;
      pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }

    /* Integrated Chat */
    #chat-container {
      position: absolute; bottom: 16px; left: 16px; width: 300px;
      background: rgba(15, 15, 23, 0.85); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 10px; z-index: 10; backdrop-filter: blur(4px);
    }
    #chat-logs { height: 90px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    #chat-logs div { word-break: break-word; }
    #chat-input {
      width: 100%; padding: 8px; background: #0f0f17; color: #fff;
      border: 1px solid #33334d; border-radius: 4px; outline: none; font-size: 12px; margin-top: 8px;
    }

    /* World Space Overlays */
    .avatar-label {
      position: absolute; transform: translate(-50%, -100%); pointer-events: none;
      font-size: 11px; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      display: flex; flex-direction: column; align-items: center; z-index: 5;
    }
    .chat-bubble {
      background: #ffffff; color: #000; padding: 4px 8px; border-radius: 8px;
      font-size: 11px; margin-bottom: 4px; display: none; white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- Entry Setup -->
  <div id="setup-modal">
    <div class="card">
      <h2>VIRTUAL SPACE 3D</h2>
      <input type="text" id="username" placeholder="Username..." maxlength="12" />
      <input type="text" id="room-code" placeholder="Room Code (Blank to Host)" />
      <button onclick="enterGame()">JOIN ROOM</button>
    </div>
  </div>

  <!-- Main Display -->
  <div id="game-container">
    <canvas id="canvas3d"></canvas>
    <div id="labels-container"></div>
    <div id="interact-prompt">Press [E] to interact</div>
    
    <div id="hud">
      <div>ROOM: <span id="display-room">---</span></div>
      <div>STATUS: <span id="display-status">Connecting...</span></div>
    </div>

    <div id="chat-container">
      <div id="chat-logs"></div>
      <input type="text" id="chat-input" placeholder="Type message and press Enter..." />
    </div>
  </div>

  <script>
    // --- GLOBAL ENGINE STATE ---
    let scene, camera, renderer;
    let localPlayer = { id: '', name: '', x: 0, z: 0, rot: 0, mesh: null, labelEl: null, radius: 0.4, isMoving: false };
    let players = {};
    let keys = {};
    let isChatFocused = false;
    
    // Networking
    let peer = null, connections = {};
    let localAudioStream = null;

    // Interior & Interaction Registries
    let colliders = [];
    let interactables = [];
    let currentInteractable = null;

    // --- 1. THREE.JS INITIALIZATION ---
    function initEngine() {
      const canvas = document.getElementById('canvas3d');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0f);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 18, 18);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      // Lighting Setup
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const light = new THREE.DirectionalLight(0xffffff, 0.6);
      light.position.set(10, 20, 10);
      scene.add(light);

      buildRoom();
      window.addEventListener('resize', onResize);
    }

    // --- 2. ROOM & COLLISION SETUP ---
    function buildRoom() {
      // Floor
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 20),
        new THREE.MeshStandardMaterial({ color: 0x1f232a, side: THREE.DoubleSide })
      );
      floor.rotation.x = Math.PI / 2;
      scene.add(floor);

      // Outer Boundary Walls
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x2d3139 });
      const walls = [
        { x: 0, z: -10, w: 20, d: 0.5 }, // North
        { x: 0, z: 10, w: 20, d: 0.5 },  // South
        { x: -10, z: 0, w: 0.5, d: 20 }, // West
        { x: 10, z: 0, w: 0.5, d: 20 }   // East
      ];

      walls.forEach(w => {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w.w, 3, w.d), wallMat);
        mesh.position.set(w.x, 1.5, w.z);
        scene.add(mesh);
        addBoxCollider(w.x, w.z, w.w, w.d);
      });

      // Furniture Item 1: Terminal
      createFurniture(
        new THREE.BoxGeometry(3, 1.2, 1.8),
        0x5c6ac4,
        { x: -5, z: -5 },
        "Access Terminal",
        () => addChatLog("SYSTEM", "Terminal session initialized.")
      );

      // Furniture Item 2: Lounge Couch
      createFurniture(
        new THREE.BoxGeometry(4, 1, 1.8),
        0x2e7d32,
        { x: 4, z: 5 },
        "Sit on Couch",
        () => addChatLog("SYSTEM", "You sat down in the lounge area.")
      );
    }

    function createFurniture(geometry, color, pos, promptText, onInteract) {
      const mat = new THREE.MeshStandardMaterial({ color });
      const mesh = new THREE.Mesh(geometry, mat);
      geometry.computeBoundingBox();
      const size = geometry.boundingBox.getSize(new THREE.Vector3());

      mesh.position.set(pos.x, size.y / 2, pos.z);
      scene.add(mesh);

      addBoxCollider(pos.x, pos.z, size.x, size.z);

      interactables.push({
        x: pos.x,
        z: pos.z,
        radius: Math.max(size.x, size.z) / 2 + 1.2,
        prompt: promptText,
        action: onInteract
      });
    }

    function addBoxCollider(x, z, width, depth) {
      colliders.push({
        minX: x - width / 2,
        maxX: x + width / 2,
        minZ: z - depth / 2,
        maxZ: z + depth / 2
      });
    }

    function checkCollision(targetX, targetZ) {
      const r = localPlayer.radius;
      for (let box of colliders) {
        if (
          targetX + r > box.minX &&
          targetX - r < box.maxX &&
          targetZ + r > box.minZ &&
          targetZ - r < box.maxZ
        ) {
          return true;
        }
      }
      return false;
    }

    // --- 3. PLAYER CREATION & UI OVERLAYS ---
    function createPlayerMesh(colorHex = 0x7c4dff) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16),
        new THREE.MeshStandardMaterial({ color: colorHex })
      );
      body.position.y = 0.6;
      group.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xffe0bd })
      );
      head.position.y = 1.4;
      group.add(head);

      scene.add(group);
      return group;
    }

    function createUIOverlay(player) {
      const div = document.createElement('div');
      div.className = 'avatar-label';
      div.innerHTML = `<div class="chat-bubble"></div><div>${player.name}</div>`;
      document.getElementById('labels-container').appendChild(div);
      player.labelEl = div;
    }

    function updateLabelPositions() {
      const updateSingle = (p) => {
        if (!p.mesh || !p.labelEl) return;
        const tempV = new THREE.Vector3(p.x, 2.0, p.z);
        tempV.project(camera);
        const x = (tempV.x * .5 + .5) * window.innerWidth;
        const y = (tempV.y * -.5 + .5) * window.innerHeight;
        p.labelEl.style.transform = `translate(-50%, -100%) translate(${x}px,${y}px)`;
      };

      updateSingle(localPlayer);
      for (let id in players) updateSingle(players[id]);
    }

    // --- 4. INPUT & CHAT ISOLATION ---
    const chatInput = document.getElementById('chat-input');
    chatInput.addEventListener('focus', () => { isChatFocused = true; keys = {}; });
    chatInput.addEventListener('blur', () => { isChatFocused = false; });

    window.addEventListener('keydown', e => {
      if (isChatFocused) {
        if (e.key === 'Enter' && chatInput.value.trim()) {
          const text = chatInput.value.trim();
          addChatLog(localPlayer.name, text);
          showBubble(localPlayer, text);
          broadcast({ type: 'chat', id: localPlayer.id, name: localPlayer.name, text });
          chatInput.value = '';
          chatInput.blur();
        }
        return;
      }

      if ((e.key === 'e' || e.key === 'E') && currentInteractable) {
        currentInteractable.action();
      }

      keys[e.key] = true;
    });

    window.addEventListener('keyup', e => { if (!isChatFocused) keys[e.key] = false; });

    function addChatLog(sender, text) {
      const logs = document.getElementById('chat-logs');
      logs.innerHTML += `<div><strong>${sender}:</strong> ${text}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }

    function showBubble(player, text) {
      if (!player.labelEl) return;
      const bubble = player.labelEl.querySelector('.chat-bubble');
      bubble.innerText = text;
      bubble.style.display = 'block';
      setTimeout(() => { bubble.style.display = 'none'; }, 4000);
    }

    // --- 5. WEBRTC MULTIPLAYER & SPATIAL AUDIO ---
    async function initMicrophone() {
      try {
        localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (err) {
        console.warn("Microphone unavailable or blocked:", err);
      }
    }

    function initMultiplayer(targetRoom) {
      const isHost = !targetRoom;
      const roomID = isHost ? Math.random().toString(36).substring(2, 7) : targetRoom;
      document.getElementById('display-room').innerText = roomID;

      peer = new Peer(isHost ? roomID : undefined);

      peer.on('open', () => {
        document.getElementById('display-status').innerText = isHost ? "Hosting" : "Connected";
        if (!isHost) setupConnection(peer.connect(roomID));
      });

      peer.on('connection', conn => setupConnection(conn));

      peer.on('call', call => {
        call.answer(localAudioStream);
        setupAudioCall(call, call.peer);
      });
    }

    function setupConnection(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.send({ type: 'sync', player: getLocalData() });

        if (localAudioStream) {
          const call = peer.call(conn.peer, localAudioStream);
          setupAudioCall(call, conn.peer);
        }
      });

      conn.on('data', data => {
        if (data.type === 'sync' || data.type === 'move') {
          updateRemotePlayer(data.player);
          if (data.type === 'sync') conn.send({ type: 'move', player: getLocalData() });
        } else if (data.type === 'chat') {
          addChatLog(data.name, data.text);
          if (players[data.id]) showBubble(players[data.id], data.text);
        }
      });

      conn.on('close', () => {
        if (players[conn.peer]) {
          scene.remove(players[conn.peer].mesh);
          if (players[conn.peer].labelEl) players[conn.peer].labelEl.remove();
          if (players[conn.peer].audioEl) players[conn.peer].audioEl.remove();
          delete players[conn.peer];
        }
        delete connections[conn.peer];
      });
    }

    function setupAudioCall(call, peerId) {
      call.on('stream', remoteStream => {
        let audio = document.getElementById(`audio-${peerId}`);
        if (!audio) {
          audio = document.createElement('audio');
          audio.id = `audio-${peerId}`;
          audio.autoplay = true;
          document.body.appendChild(audio);
        }
        audio.srcObject = remoteStream;

        if (players[peerId]) {
          players[peerId].audioEl = audio;
        }
      });
    }

    function updateSpatialAudio() {
      const maxDistance = 12;
      for (let id in players) {
        const p = players[id];
        if (p.audioEl) {
          const dist = Math.hypot(localPlayer.x - p.x, localPlayer.z - p.z);
          p.audioEl.volume = Math.max(0, 1 - dist / maxDistance);
        }
      }
    }

    function getLocalData() {
      return { id: localPlayer.id, name: localPlayer.name, x: localPlayer.x, z: localPlayer.z, rot: localPlayer.rot };
    }

    function updateRemotePlayer(data) {
      if (!players[data.id]) {
        players[data.id] = { ...data, mesh: createPlayerMesh(0x00e676) };
        createUIOverlay(players[data.id]);
      }
      const p = players[data.id];
      p.x = data.x; p.z = data.z; p.rot = data.rot;
      if (p.mesh) {
        p.mesh.position.set(p.x, 0, p.z);
        p.mesh.rotation.y = p.rot;
      }
    }

    function broadcast(data) {
      for (let id in connections) {
        if (connections[id].open) connections[id].send(data);
      }
    }

    // --- 6. PHYSICS, INTERACTIONS & GAME LOOP ---
    function updateInteractions() {
      currentInteractable = null;
      const promptEl = document.getElementById('interact-prompt');

      for (let item of interactables) {
        const dist = Math.hypot(localPlayer.x - item.x, localPlayer.z - item.z);
        if (dist <= item.radius) {
          currentInteractable = item;
          promptEl.innerText = `Press [E] to ${item.prompt}`;
          promptEl.style.display = 'block';
          return;
        }
      }

      promptEl.style.display = 'none';
    }

    function updatePhysics() {
      if (isChatFocused) return;

      let dx = 0, dz = 0;
      if (keys['w'] || keys['W'] || keys['ArrowUp']) dz -= 1;
      if (keys['s'] || keys['S'] || keys['ArrowDown']) dz += 1;
      if (keys['a'] || keys['A'] || keys['ArrowLeft']) dx -= 1;
      if (keys['d'] || keys['D'] || keys['ArrowRight']) dx += 1;

      if (dx !== 0 || dz !== 0) {
        const len = Math.hypot(dx, dz);
        const speed = 0.1;
        const nextX = localPlayer.x + (dx / len) * speed;
        const nextZ = localPlayer.z + (dz / len) * speed;

        if (!checkCollision(nextX, localPlayer.z)) localPlayer.x = nextX;
        if (!checkCollision(localPlayer.x, nextZ)) localPlayer.z = nextZ;

        localPlayer.rot = Math.atan2(dx, dz);
        localPlayer.isMoving = true;
      } else {
        localPlayer.isMoving = false;
      }

      if (localPlayer.mesh) {
        localPlayer.mesh.position.set(localPlayer.x, 0, localPlayer.z);
        localPlayer.mesh.rotation.y = localPlayer.rot;
      }

      updateInteractions();
    }

    async function enterGame() {
      const name = document.getElementById('username').value.trim();
      if (!name) return alert("Please enter a username!");

      localPlayer.name = name;
      localPlayer.id = Math.random().toString(36).substring(2, 7);

      await initMicrophone();

      document.getElementById('setup-modal').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      initEngine();
      onResize();

      localPlayer.mesh = createPlayerMesh(0x7c4dff);
      createUIOverlay(localPlayer);

      initMultiplayer(document.getElementById('room-code').value.trim().toLowerCase());
      
      // Throttled Network Position Loop (20 updates/sec)
      setInterval(() => {
        if (localPlayer.isMoving) broadcast({ type: 'move', player: getLocalData() });
      }, 50);

      requestAnimationFrame(gameLoop);
    }

    function onResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function gameLoop() {
      updatePhysics();
      updateLabelPositions();
      updateSpatialAudio();
      renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
