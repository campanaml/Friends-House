<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Multiplayer Game - v1.6.2</title>
  <!-- PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 4px solid #444;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      background: #2e7d32;
    }
    #ui-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      pointer-events: none;
    }
    #status-tag {
      font-weight: bold;
      color: #4caf50;
    }
    #room-bar {
      margin-bottom: 10px;
      display: flex;
      gap: 8px;
    }
    input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
    }
    button {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      background: #2196f3;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1e88e5; }
  </style>
</head>
<body>

  <div id="room-bar">
    <input type="text" id="world-id-input" placeholder="Nombre de sala (ej. main-town)" value="main-town">
    <button onclick="changeRoom()">Entrar a Sala</button>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui-overlay">
      Estado: <span id="status-tag">CONECTANDO...</span> | Jugadores: <span id="player-count">1</span>
      <br><small>Build: v1.6.2 (5-Min Timeout & Heartbeat Fixed)</small>
    </div>
  </div>

<script>
  // --- CONFIGURACIÓN PRINCIPAL ---
  const CANVAS_WIDTH = 800;
  const CANVAS_HEIGHT = 600;
  const INACTIVITY_TIMEOUT = 5 * 60 * 1000; // 5 minutos (300,000 ms)
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  let activeWorldRoom = "main-town";
  if (window.location.hash) {
    activeWorldRoom = window.location.hash.replace('#', '');
    document.getElementById('world-id-input').value = activeWorldRoom;
  }

  // --- JUGADOR LOCAL ---
  const myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9);
  const player = {
    x: Math.floor(Math.random() * 600) + 100,
    y: Math.floor(Math.random() * 400) + 100,
    size: 30,
    speed: 4,
    color: '#' + Math.floor(Math.random()*16777215).toString(16),
    name: 'Jugador-' + myPlayerId.substr(0, 4)
  };

  const otherPlayers = {};
  const keys = {};

  // --- RED & PEERJS ---
  let peer = null;
  let isHost = false;
  let hostConn = null;
  const connections = [];

  function initMultiplayerGlobal() {
    const hostRoomId = `nh-room-${activeWorldRoom}-v162`;
    const joinDelay = Math.floor(Math.random() * 300);

    setTimeout(() => {
      const peerOptions = {
        debug: 1,
        secure: location.protocol === 'https:'
      };

      peer = new Peer(hostRoomId, peerOptions);

      peer.on('open', () => {
        isHost = true;
        document.getElementById('status-tag').innerText = "HOST (SALA CREADA)";
        setupConnections();
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          // Si el ID ya existe, nos unimos como cliente
          isHost = false;
          peer = new Peer(null, peerOptions);
          peer.on('open', () => {
            document.getElementById('status-tag').innerText = "CONECTADO A HOST";
            connectToHost(hostRoomId);
          });
        }
      });
    }, joinDelay);
  }

  function connectToHost(hostRoomId) {
    hostConn = peer.connect(hostRoomId);
    
    hostConn.on('open', () => {
      bindConnectionEvents(hostConn);
      // Enviar presencia inicial
      sendPositionUpdate();
    });
  }

  function setupConnections() {
    peer.on('connection', (conn) => {
      connections.push(conn);
      bindConnectionEvents(conn);
    });
  }

  function bindConnectionEvents(conn) {
    conn.on('data', (data) => {
      handleIncomingData(data);
    });

    conn.on('close', () => {
      cleanUpDisconnectedPeer(conn.peer);
    });
  }

  // --- DIFUSIÓN DE DATOS (BROADCAST) ---
  function broadcastData(data) {
    if (isHost) {
      connections.forEach(c => {
        if (c.open) c.send(data);
      });
    } else if (hostConn && hostConn.open) {
      hostConn.send(data);
    }
  }

  function sendPositionUpdate() {
    if (!peer) return;
    broadcastData({
      type: 'POS_UPDATE',
      id: myPlayerId,
      x: player.x,
      y: player.y,
      color: player.color,
      name: player.name,
      timestamp: Date.now()
    });
  }

  // --- RECEPCIÓN Y CORRECCIÓN DE HEARTBEAT (v1.6.2) ---
  function handleIncomingData(data) {
    if (data.type === 'POS_UPDATE') {
      if (data.id === myPlayerId) return;

      if (!otherPlayers[data.id]) {
        // Crear nuevo avatar e inicializar lastUpdate inmediatamente
        otherPlayers[data.id] = {
          x: data.x,
          y: data.y,
          color: data.color || '#ff0000',
          name: data.name || 'Jugador',
          lastUpdate: Date.now()
        };
      } else {
        // Actualizar datos y renovar lastUpdate
        otherPlayers[data.id].x = data.x;
        otherPlayers[data.id].y = data.y;
        otherPlayers[data.id].lastUpdate = Date.now();
      }

      // Si el Host recibe actualización, la retransmite a los demás clientes
      if (isHost) {
        broadcastData(data);
      }
    } else if (data.type === 'DISCONNECT') {
      removePlayer(data.id);
    }
  }

  function removePlayer(id) {
    if (otherPlayers[id]) {
      delete otherPlayers[id];
      console.log(`[v1.6.2] Jugador ${id} eliminado.`);
    }
  }

  function cleanUpDisconnectedPeer(peerId) {
    Object.keys(otherPlayers).forEach(id => {
      removePlayer(id);
    });
  }

  // --- HEARTBEAT & TIMEOUTS DE 5 MINUTOS (v1.6.2) ---
  // 1. Envío periódico continuo (evita que el jugador desaparezca si está quieto)
  setInterval(() => {
    sendPositionUpdate();
  }, 2000);

  // 2. Limpieza de inactivos solo después de 5 minutos sin señal
  setInterval(() => {
    const now = Date.now();
    Object.keys(otherPlayers).forEach(id => {
      if (now - otherPlayers[id].lastUpdate > INACTIVITY_TIMEOUT) {
        console.log(`[Timeout] Jugador ${id} inactivo por más de 5 minutos.`);
        removePlayer(id);
      }
    });
  }, 30000);

  // --- CONTROLES Y MOVIMIENTO ---
  window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
  });

  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function update() {
    let moved = false;
    if (keys['w'] || keys['arrowup']) { player.y -= player.speed; moved = true; }
    if (keys['s'] || keys['arrowdown']) { player.y += player.speed; moved = true; }
    if (keys['a'] || keys['arrowleft']) { player.x -= player.speed; moved = true; }
    if (keys['d'] || keys['arrowright']) { player.x += player.speed; moved = true; }

    // Limites de la pantalla
    player.x = Math.max(0, Math.min(CANVAS_WIDTH - player.size, player.x));
    player.y = Math.max(0, Math.min(CANVAS_HEIGHT - player.size, player.y));

    if (moved) {
      sendPositionUpdate();
    }
  }

  // --- RENDERIZADO ---
  function draw() {
    // Limpiar canvas
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Dibujar otros jugadores
    const activeIds = Object.keys(otherPlayers);
    document.getElementById('player-count').innerText = activeIds.length + 1;

    activeIds.forEach(id => {
      const p = otherPlayers[id];
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, player.size, player.size);
      
      // Nombre sobre la cabeza
      ctx.fillStyle = '#ffffff';
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(p.name, p.x + (player.size / 2), p.y - 6);
    });

    // Dibujar mi jugador
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.size, player.size);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(player.x, player.y, player.size, player.size);

    // Nombre propio sobre la cabeza
    ctx.fillStyle = '#ffffff';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(player.name + ' (Tú)', player.x + (player.size / 2), player.y - 6);
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // --- MANEJO DE DESCONEXIÓN LIMPIA (v1.6.1) ---
  window.addEventListener('beforeunload', () => {
    broadcastData({ type: 'DISCONNECT', id: myPlayerId });
  });

  function changeRoom() {
    const inputVal = document.getElementById('world-id-input').value.trim();
    if (inputVal) {
      window.location.hash = inputVal;
      window.location.reload();
    }
  }

  // Inicializar juego y multijugador
  initMultiplayerGlobal();
  gameLoop();
</script>
</body>
</html>
