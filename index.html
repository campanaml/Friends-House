    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body { background: #000; color: #fff; overflow: hidden; }

    #setup-modal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
    }
    .setup-box {
      border: 2px solid #00ffcc; padding: 30px; background: rgba(10, 10, 10, 0.95);
      display: flex; flex-direction: column; gap: 18px; width: 380px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.25);
      border-radius: 8px;
    }
    .setup-box h2 {
      color: #00ffcc; letter-spacing: 2px; font-size: 20px; text-shadow: 0 0 10px rgba(0,255,204,0.5);
    }
    .setup-box label {
      font-size: 10px; color: #aaa; margin-bottom: -12px; text-transform: uppercase;
    }
    .setup-box input, .setup-box select {
      background: #050505; color: #fff; border: 1px solid #444; padding: 12px;
      font-family: monospace; border-radius: 4px; outline: none; transition: border-color 0.3s;
    }
    .setup-box input:focus, .setup-box select:focus {
      border-color: #00ffcc; box-shadow: 0 0 8px rgba(0,255,204,0.3);
    }
    .setup-box button {
      background: #00ffcc; color: #000; border: none; padding: 14px;
      font-family: monospace; font-weight: bold; cursor: pointer; border-radius: 4px;
      transition: all 0.2s; margin-top: 5px; letter-spacing: 1px;
    }
    .setup-box button:hover { background: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.6); }

    #game-container { display: none; width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; background: #27ae60; width: 100vw; height: 100vh; }

    #hud {
      position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.85);
      border: 1px solid #fff; padding: 10px; z-index: 10; font-size: 12px;
      display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    }
    
    #hud-controls {
      position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; max-width: 480px;
    }
    #hud-controls button {
      background: rgba(0,0,0,0.85); color: #fff; border: 1px solid #fff;
      padding: 6px 10px; font-family: monospace; cursor: pointer;
    }
    #hud-controls button:hover { background: #fff; color: #000; }

    .game-modal {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); background: #111; border: 2px solid #fff;
      padding: 15px; width: 340px; z-index: 20; color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }
    .game-modal h3 { border-bottom: 1px solid #fff; padding-bottom: 5px; margin-bottom: 10px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; }
    .item-row button { background: #000; color: #fff; border: 1px solid #fff; padding: 4px 8px; cursor: pointer; }
    .item-row button:hover { background: #fff; color: #000; }

    #chat-container {
      position: absolute; bottom: 10px; left: 10px; width: 320px;
      background: rgba(0,0,0,0.85); border: 1px solid #fff; z-index: 10;
    }
    #chat-container.minimized #chat-logs { display: none; }
    #chat-header {
      background: #222; padding: 5px 10px; cursor: pointer;
      display: flex; justify-content: space-between; border-bottom: 1px solid #fff;
    }
    #chat-logs { height: 130px; overflow-y: auto; padding: 8px; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
    #chat-input-box { border-top: 1px solid #fff; display: flex; }
    #chat-input { background: #000; color: #fff; border: none; padding: 8px; width: 100%; font-family: monospace; }

      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);

    }
    .toast {
      background: rgba(0,0,0,0.9); border: 1px solid #fff; padding: 6px 14px;
      font-size: 11px; text-align: center; box-shadow: 0 0 10px rgba(255,255,255,0.2);

    .toast.success { border-color: #0f0; color: #0f0; }
    .toast.error { border-color: #f00; color: #f00; }

    }
    .dpad-row { display: flex; justify-content: center; }
    .dpad-btn {

    #hud-controls { gap: 8px; max-width: 560px; }
    #hud-controls button {

    .game-modal h3 { border-bottom-color: rgba(255,255,255,.15); }
    .item-row button { border-color: rgba(255,255,255,.2); border-radius: 8px; }
    #chat-container { border:1px solid rgba(255,255,255,.16); border-radius:14px; overflow:hidden; background:rgba(8,12,18,.78); backdrop-filter:blur(10px); box-shadow:0 12px 32px rgba(0,0,0,.3); }
    #chat-header { background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.03)); border-bottom-color:rgba(255,255,255,.1); }
    #chat-input { background:rgba(0,0,0,.28); }

    .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;box-shadow:0 0 6px currentColor}

    const GAME_VERSION = "4.3.0";

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    window.addEventListener('DOMContentLoaded', () => {
      const lastUser = localStorage.getItem('nh_last_username');
      const lastColor = localStorage.getItem('nh_last_color');
      if (lastUser) document.getElementById('username-input').value = lastUser;
      if (lastColor) document.getElementById('color-select').value = lastColor;
    });

    if (!ctx.roundRect) {
      ctx.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'number') r = {tl: r, tr: r, br: r, bl: r};
        else {
          var defaultRadius = {tl: 0, tr: 0, br: 0, bl: 0};
          for (var side in defaultRadius) {
            r[side] = r[side] || defaultRadius[side];
          }
        }
        this.beginPath();
        this.moveTo(x + r.tl, y);
        this.lineTo(x + w - r.tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
        this.lineTo(x + w, y + h - r.br);
        this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
        this.lineTo(x + r.bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
        this.lineTo(x, y + r.tl);
        this.quadraticCurveTo(x, y, x + r.tl, y);
        this.closePath();
        return this;
      };
    }

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          startAmbientTrafficSound();
        } catch(e) {}
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startAmbientTrafficSound() {
      if (!audioCtx) return;
      try {
        let bufferSize = audioCtx.sampleRate * 2;
        let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

        let whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer; whiteNoise.loop = true;

        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.setValueAtTime(320, audioCtx.currentTime);

        let gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.018, audioCtx.currentTime);

        whiteNoise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        whiteNoise.start(0);
      } catch(e) {}
    }
    
    function playTone(freq, type, duration, vol) {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function playCoinSFX() { playTone(987, 'sine', 0.2, 0.1); }
    function playFootstepSFX() { playTone(120, 'triangle', 0.05, 0.02); }

    function setupMobileControls() {
      const bindTouch = (id, keyName) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        const start = (e) => { e.preventDefault(); keys[keyName] = true; };
        const end = (e) => { e.preventDefault(); keys[keyName] = false; };
        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
      };
      bindTouch('btn-up', 'ArrowUp'); bindTouch('btn-down', 'ArrowDown');
      bindTouch('btn-left', 'ArrowLeft'); bindTouch('btn-right', 'ArrowRight');
    }

    function initMultiplayerGlobal() {
      const hostRoomId = `nh-${activeWorldRoom}-host-v400`;
      setTimeout(() => {
        peer = new Peer(hostRoomId);
        peer.on('open', () => {
          isHost = true;
          document.getElementById('status-tag').innerText = "HOSTING MEGA CITY";
        });
        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            peer = new Peer();
            peer.on('open', () => {
              document.getElementById('status-tag').innerText = "CONNECTED";
              connectToHost(hostRoomId);
            });
            peer.on('connection', (conn) => bindConnectionEvents(conn));
          }
        });
        peer.on('connection', (conn) => bindConnectionEvents(conn));
      }, Math.floor(Math.random() * 300));
    }

    function connectToHost(hostRoomId) {
      let hostConn = peer.connect(hostRoomId, { reliable: true });
      bindConnectionEvents(hostConn);
    }

    function bindConnectionEvents(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.send({ type: 'sync', player: localPlayer, vehicles, version: GAME_VERSION });
      });

      conn.on('data', (data) => {
        if (data.type === 'leave') {
          delete players[data.id];
          updatePlayerList();
          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        } else if (data.type === 'sync' || data.type === 'move') {
          data.player.lastSeen = Date.now();
          players[data.player.id] = data.player;
          if (data.vehicles) vehicles = data.vehicles;
          
          if (data.type === 'sync' && !isHost) conn.send({ type: 'move', player: localPlayer, vehicles });

          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        } else if (data.type === 'chat') {
          let sameLocation = (data.location === localPlayer.location);
          let dist = Math.hypot(localPlayer.x - data.x, localPlayer.y - data.y);
          let isNear = sameLocation && dist < 500;
          let text = isNear ? data.message : "...[distant chat]...";
          addChatMessage(data.name, text);
          if (players[data.id] && sameLocation) setSpeechBubble(players[data.id], data.message);
          
          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        } else if (data.type === 'emote') {
          if (players[data.id]) setEmote(players[data.id], data.emote);
          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        }
        updatePlayerList();
      });

      conn.on('close', () => {
        delete connections[conn.peer];
        delete players[conn.peer];
        updatePlayerList();
      });
    }

    function broadcast(data) {
      for (let peerId in connections) {
        if (connections[peerId].open) connections[peerId].send(data);
      }
    }

    function cleanupGhostPlayers() {
      const now = Date.now();
      let changed = false;
      for (let id in players) {
        if (id !== localPlayer.id && players[id].lastSeen && (now - players[id].lastSeen > PLAYER_TIMEOUT_MS)) {
          delete players[id]; changed = true;
        }
      }
      if (changed) updatePlayerList();
    }

    function updatePlayerList() {
      const listEl = document.getElementById('player-names');
      let html = `<div>• ${localPlayer.name} (You)</div>`;
      for (let id in players) {
        if (id !== localPlayer.id && players[id].location === localPlayer.location) {
          html += `<div>• ${players[id].name}</div>`;
        }
      }
      listEl.innerHTML = html;

    window.addEventListener('keydown', e => {
      if (document.activeElement === document.getElementById('chat-input')) return;
      keys[e.key] = true;
      if (e.key.toLowerCase() === 'e') triggerInteraction();
      if (e.key.toLowerCase() === 'b') toggleShop();
      if (e.key.toLowerCase() === 'i') toggleInventory();

    window.addEventListener('keyup', e => {
      if (document.activeElement === document.getElementById('chat-input')) return;
      keys[e.key] = false;
    });

    const chatInput = document.getElementById('chat-input');
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && chatInput.value.trim() !== '') {

        addChatMessage(localPlayer.name, msg);

        broadcast({ type: 'chat', id: localPlayer.id, name: localPlayer.name, message: msg, x: localPlayer.x, y: localPlayer.y, location: localPlayer.location });
        chatInput.value = ''; chatInput.blur();
      }
    });

    function setSpeechBubble(p, text) { p.bubble = { text, timer: Date.now() + 4500 }; }
    function sendEmote(emote) { setEmote(localPlayer, emote); broadcast({ type: 'emote', id: localPlayer.id, emote }); }
    function setEmote(p, emote) { p.emote = { symbol: emote, timer: Date.now() + 3000 }; }
    function addChatMessage(sender, text) {
      const logs = document.getElementById('chat-logs');
      const msgDiv = document.createElement('div');
      msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
      logs.appendChild(msgDiv); logs.scrollTop = logs.scrollHeight;

    function triggerInteraction() {
      if (localPlayer.location === 'world') {
        if (localPlayer.vehicle) {
          let v = vehicles.find(item => item.id === localPlayer.vehicle);
          if (v) { v.driver = null; localPlayer.x = v.x + 50; localPlayer.y = v.y + 50; }
          localPlayer.vehicle = null;
          broadcast({ type: 'move', player: localPlayer, vehicles });
          return;
        }
        vehicles.forEach(v => {
          if (!v.driver && Math.hypot(localPlayer.x - v.x, localPlayer.y - v.y) < 65) {
            v.driver = localPlayer.id; localPlayer.vehicle = v.id; localPlayer.isMounted = false;
          }
        });
        houses.forEach(h => {
          if (Math.hypot(localPlayer.x - h.doorX, localPlayer.y - h.doorY) < 45) {
            localPlayer.location = h.id; localPlayer.x = 350; localPlayer.y = 400;
            document.getElementById('location-tag').innerText = h.name.toUpperCase();
          }
        });
      } else {
        if (Math.hypot(localPlayer.x - 350, localPlayer.y - 480) < 50) {
          let h = houses.find(item => item.id === localPlayer.location);
          localPlayer.location = 'world'; localPlayer.x = h ? h.exitX : 300; localPlayer.y = h ? h.exitY : 370;
          document.getElementById('location-tag').innerText = "WORLD";
        }
      }
      broadcast({ type: 'move', player: localPlayer, vehicles });
      updatePlayerList();
    }

    function checkWallCollision(newX, newY, radius) {
      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v && v.type === 'plane') return false;
      }
      let solids = localPlayer.location === 'world' ? outdoorSolids : houseSolids;
      for (let s of solids) {
        let closestX = Math.max(s.x, Math.min(newX, s.x + s.w));
        let closestY = Math.max(s.y, Math.min(newY, s.y + s.h));
        if (Math.hypot(newX - closestX, newY - closestY) < radius) return true;
      }
      return false;
    }

    function checkCoinPickups() {
      if (localPlayer.location !== 'world') return;
      mapCoins.forEach(coin => {
        if (coin.active && Math.hypot(localPlayer.x - coin.x, localPlayer.y - coin.y) < 25) {
          coin.active = false; localPlayer.coins += 10; cameraShake = 7; spawnParticle(coin.x,coin.y,'#ffd54a',16,2.8,34,3.5); spawnParticle(coin.x, coin.y, '#ffd54a', 18, 2.6, 42, 3.2);
          savePlayerData(); playCoinSFX(); showNotification("+$10 Coins!", 'success');
          setTimeout(() => {
            coin.x = Math.floor(Math.random() * (WORLD_WIDTH - 200)) + 100;
            coin.y = Math.floor(Math.random() * (WORLD_HEIGHT - 200)) + 100;
            coin.active = true;
          }, 10000);
        }
      });
    }

    function updateNPCs() {
      if (animFrame % 180 === 0) {
        trafficLights.forEach(tl => {
          tl.state = (tl.state === 'green') ? 'red' : 'green';
        });
      }

      npcCitizens.forEach(npc => {
        npc.x += npc.vx;
        npc.y += npc.vy;
        npc.walkCycle += 0.15;
        if (npc.vx !== 0 && (npc.x < npc.minX || npc.x > npc.maxX)) npc.vx *= -1;
        if (npc.vy !== 0 && (npc.y < npc.minY || npc.y > npc.maxY)) npc.vy *= -1;
      });

      npcVehicles.forEach(car => {
        car.x += car.vx;
        car.y += car.vy;
        if (car.x < 100) car.x = WORLD_WIDTH - 200;
        if (car.x > WORLD_WIDTH - 100) car.x = 200;
        if (car.y < 100) car.y = WORLD_HEIGHT - 200;
        if (car.y > WORLD_HEIGHT - 100) car.y = 200;
      });
    }

    function update() {
      animFrame++;
      visualTime = performance.now();
      dayClock = (dayClock + 0.000018) % 1;
      cameraShake *= .9;
      drawMinimap();
      updateParticles();
      cleanupGhostPlayers();
      updateNPCs();

      clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > WORLD_WIDTH + 100) c.x = -100;
      });

      let currentSpeed = localPlayer.speed;
      if (localPlayer.hasAura) currentSpeed += 3;
      if (localPlayer.isMounted) currentSpeed += 2;
      
      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) currentSpeed = v.speed;
      }

      let nextX = localPlayer.x; let nextY = localPlayer.y;
      localPlayer.isMoving = false;

      if (keys['ArrowUp'] || keys['w']) { nextY -= currentSpeed; localPlayer.dir = 'up'; localPlayer.isMoving = true; }
      if (keys['ArrowDown'] || keys['s']) { nextY += currentSpeed; localPlayer.dir = 'down'; localPlayer.isMoving = true; }
      if (keys['ArrowLeft'] || keys['a']) { nextX -= currentSpeed; localPlayer.dir = 'left'; localPlayer.isMoving = true; }
      if (keys['ArrowRight'] || keys['d']) { nextX += currentSpeed; localPlayer.dir = 'right'; localPlayer.isMoving = true; }

      if (!checkWallCollision(nextX, localPlayer.y, localPlayer.radius)) localPlayer.x = nextX;
      if (localPlayer.isMoving && animFrame % 7 === 0 && localPlayer.location === 'world' && !localPlayer.vehicle) {
        spawnParticle(localPlayer.x, localPlayer.y+10, 'rgba(210,220,210,.65)', 2, .7, 18, 2);
      }
      if (localPlayer.isMounted && localPlayer.isMoving && animFrame % 3 === 0) {
        spawnParticle(localPlayer.x - Math.cos(({up: -Math.PI/2,down:Math.PI/2,left:Math.PI,right:0}[localPlayer.dir]||0))*8, localPlayer.y - Math.sin(({up: -Math.PI/2,down:Math.PI/2,left:Math.PI,right:0}[localPlayer.dir]||0))*8, '#ff4fd8', 2, .7, 18, 2.5);
      }

      if (!checkWallCollision(localPlayer.x, nextY, localPlayer.radius)) localPlayer.y = nextY;

      checkCoinPickups();

      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) { v.x = localPlayer.x; v.y = localPlayer.y; }
        if (localPlayer.isMoving && animFrame % 10 === 0) { playVehicleSFX(); cameraShake = Math.min(2.5,cameraShake+.3); }

    function spawnParticle(x, y, color, count = 8, speed = 1.8, life = 40, size = 3) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * speed + .4;
        particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life, maxLife: life, color, size: Math.random()*size+.8, gravity:.03 });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.vx *= .985; p.vy *= .985; p.life--;
        if (p.life <= 0) particles.splice(i,1);
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        const a = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

      ctx.fillStyle='rgba(0,0,0,.23)';ctx.beginPath();ctx.ellipse(x,y+15,10,4,0,0,Math.PI*2);ctx.fill();
      // legs / shoes
      ctx.strokeStyle='#12171d';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-3,y+3+bob);ctx.lineTo(x-4+leg,y+13);ctx.moveTo(x+3,y+3+bob);ctx.lineTo(x+4-leg,y+13);ctx.stroke();
      // torso
      const body=ctx.createLinearGradient(x-8,y-10,x+8,y+5);body.addColorStop(0,color);body.addColorStop(1,'rgba(255,255,255,.18)');ctx.fillStyle=body;roundedRectPath(x-8,y-9+bob,16,14,5);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.stroke();
      // head + hair
      ctx.fillStyle='#f0c6a8';ctx.beginPath();ctx.arc(x,y-16+bob,8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#26313a';ctx.beginPath();ctx.arc(x,y-19+bob,8,Math.PI,Math.PI*2);ctx.fill();
      // tiny face highlight
      ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.arc(x+3,y-16+bob,1.2,0,Math.PI*2);ctx.fill();
      ctx.restore();
      if(nameText){ctx.save();ctx.font='600 10px system-ui,sans-serif';ctx.textAlign='center';const tw=ctx.measureText(nameText).width+14;ctx.fillStyle='rgba(8,12,18,.72)';roundedRectPath(x-tw/2,y+27,tw,16,8);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(nameText,x,y+38);ctx.restore();}
    }

    function drawAvatar(p) {
      ctx.save();
      let renderY=p.y;
      if(p.hasAura){const pulse=18+Math.sin(animFrame*.12)*5;const g=ctx.createRadialGradient(p.x,p.y,pulse*.15,p.x,p.y,pulse*2.4);g.addColorStop(0,'rgba(0,255,255,.42)');g.addColorStop(1,'rgba(0,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,pulse*2.4,0,Math.PI*2);ctx.fill();}
      if(p.isMounted && !p.vehicle){ctx.shadowBlur=18;ctx.shadowColor='#d946ef';ctx.fillStyle='#d946ef';roundedRectPath(p.x-18,p.y+10,36,7,4);ctx.fill();ctx.fillStyle='#67e8f9';ctx.fillRect(p.x-12,p.y+17,7,2);ctx.fillRect(p.x+5,p.y+17,7,2);ctx.shadowBlur=0;renderY-=5;}
      const cycle=p.isMoving?animFrame*.34:0;drawCharacterEntity(p.x,renderY,p.color||'#fff','',cycle,p.isMoving?'walk':'none');
      // equipment
      if(!p.vehicle){if(p.equippedHat==='item_sunglasses'){ctx.fillStyle='#10151c';ctx.strokeStyle='#78e8ff';ctx.lineWidth=1.5;roundedRectPath(p.x-7,renderY-19,14,5,2);ctx.fill();ctx.stroke();}else if(p.equippedHat==='item_crown'){ctx.fillStyle='#ffd54a';ctx.shadowBlur=10;ctx.shadowColor='#ffd54a';ctx.beginPath();ctx.moveTo(p.x-7,renderY-24);ctx.lineTo(p.x-8,renderY-33);ctx.lineTo(p.x-2,renderY-27);ctx.lineTo(p.x,renderY-35);ctx.lineTo(p.x+3,renderY-27);ctx.lineTo(p.x+8,renderY-33);ctx.lineTo(p.x+7,renderY-24);ctx.closePath();ctx.fill();ctx.shadowBlur=0;}}
      ctx.restore();
      // nameplate
      ctx.save();ctx.font='600 11px system-ui,sans-serif';ctx.textAlign='center';const label=p.name+(p.id===localPlayer.id?'  • YOU':'');const w=ctx.measureText(label).width+18;ctx.fillStyle='rgba(8,12,18,.78)';roundedRectPath(p.x-w/2,p.y+27,w,18,9);ctx.fill();ctx.strokeStyle=p.id===localPlayer.id?'rgba(0,255,204,.7)':'rgba(255,255,255,.15)';ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(label,p.x,p.y+40);ctx.restore();
      if(p.bubble && Date.now()<p.bubble.timer){ctx.save();const display=p.bubble.text.length>28?p.bubble.text.slice(0,28)+'…':p.bubble.text;ctx.font='11px system-ui,sans-serif';const bw=Math.max(ctx.measureText(display).width+18,44);const bx=p.x-bw/2,by=renderY-52;ctx.fillStyle='rgba(255,255,255,.96)';roundedRectPath(bx,by,bw,24,10);ctx.fill();ctx.fillStyle='#131820';ctx.fillText(display,p.x,by+16);ctx.restore();}
      if(p.emote&&Date.now()<p.emote.timer){ctx.save();ctx.font='22px sans-serif';ctx.textAlign='center';ctx.shadowBlur=12;ctx.shadowColor='#fff';ctx.fillText(p.emote.symbol,p.x,renderY-40-Math.sin((Date.now()-p.emote.timer+3000)/180)*6);ctx.restore();}
    }

    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const targetX=localPlayer.x-canvas.width/(2*camera.zoom), targetY=localPlayer.y-canvas.height/(2*camera.zoom);
      const maxX=Math.max(0,WORLD_WIDTH-canvas.width/camera.zoom), maxY=Math.max(0,WORLD_HEIGHT-canvas.height/camera.zoom);
      const clampedX=Math.max(0,Math.min(maxX,targetX)),clampedY=Math.max(0,Math.min(maxY,targetY));
      camera.x += (clampedX-camera.x)*.12; camera.y += (clampedY-camera.y)*.12;
      ctx.save();
      if(cameraShake>.1) ctx.translate((Math.random()-.5)*cameraShake,(Math.random()-.5)*cameraShake);
      if(localPlayer.location==='world'){
        ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);drawWorld();
      }else drawHouseInterior();
      drawAvatar(localPlayer);for(let id in players)if(id!==localPlayer.id&&players[id].location===localPlayer.location)drawAvatar(players[id]);
      ctx.restore();
      // vignette
      const vg=ctx.createRadialGradient(canvas.width/2,canvas.height/2,Math.min(canvas.width,canvas.height)*.15,canvas.width/2,canvas.height/2,Math.max(canvas.width,canvas.height)*.72);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.28)');ctx.fillStyle=vg;ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
  </script>
</body>
