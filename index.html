<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Friends House - 3D Full Edition (Fixed)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, monospace; touch-action: manipulation; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0e0e12; color: #fff; }

    /* Login Modal */
    #setup-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(14, 14, 18, 0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px);
    }
    .card { 
      background: #1a1a22; border: 1px solid #33343f; border-radius: 12px; 
      padding: 24px; text-align: center; width: 90%; max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .card h2 { font-size: 20px; font-weight: 700; margin-bottom: 14px; color: #646cff; }
    input { 
      width: 100%; padding: 10px 12px; margin: 6px 0; background: #0e0e12; color: #fff; 
      border: 1px solid #33343f; border-radius: 6px; outline: none; font-size: 13px; user-select: text;
    }
    input:focus { border-color: #646cff; }
    .options-grid { display: flex; justify-content: space-between; margin: 8px 0; gap: 6px; }
    .opt-btn { 
      border: 1px solid #33343f; padding: 8px; cursor: pointer; background: #0e0e12; 
      flex: 1; font-size: 12px; text-align: center; border-radius: 6px; transition: all 0.2s;
    }
    .opt-btn.selected { background: #646cff; color: #fff; border-color: #646cff; font-weight: bold; }
    .color-swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #33343f; cursor: pointer; transition: transform 0.2s; }
    .color-swatch.selected { transform: scale(1.25); border-color: #fff; }
    button.start { 
      padding: 12px; background: #646cff; color: #fff; border: none; font-weight: bold; 
      cursor: pointer; width: 100%; font-size: 14px; margin-top: 12px; border-radius: 6px;
    }
    button.start:hover { background: #535bf2; }

    /* Game Layout */
    #game-container { position: relative; width: 100vw; height: 100vh; display: none; }
    #canvas3d { width: 100%; height: 100%; display: block; }
    
    /* UI Overlays */
    #room-info { 
      position: absolute; top: 12px; left: 12px; background: rgba(26, 26, 34, 0.85); 
      border: 1px solid #33343f; border-radius: 8px; padding: 8px 12px; font-size: 11px; z-index: 10; backdrop-filter: blur(4px);
    }
    #player-list { 
      position: absolute; top: 12px; right: 12px; background: rgba(26, 26, 34, 0.85); 
      border: 1px solid #33343f; border-radius: 8px; padding: 8px 12px; font-size: 11px; z-index: 10; width: 130px; backdrop-filter: blur(4px);
    }
    
    #chat-container {
      position: absolute; bottom: 12px; left: 12px; width: 260px; max-width: 60vw;
      background: rgba(26, 26, 34, 0.85); border: 1px solid #33343f; border-radius: 8px; padding: 8px; z-index: 10; backdrop-filter: blur(4px);
    }
    #chat-logs { height: 70px; overflow-y: auto; font-size: 10px; margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
    #chat-input { width: 100%; padding: 6px; background: #0e0e12; color: #fff; border: 1px solid #33343f; border-radius: 4px; outline: none; font-size: 10px; user-select: text; }

    #emote-bar { position: absolute; bottom: 12px; right: 12px; display: flex; gap: 4px; z-index: 10; }
    .emote-btn { background: rgba(26, 26, 34, 0.85); border: 1px solid #33343f; border-radius: 6px; padding: 6px 8px; cursor: pointer; font-size: 14px; backdrop-filter: blur(4px); }

    /* Mobile Controls */
    #controls-container { 
      position: absolute; bottom: 90px; right: 12px; display: flex; flex-direction: column; 
      align-items: center; gap: 4px; z-index: 10;
    }
    #dpad { display: grid; grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(3, 38px); gap: 2px; }
    .dbtn { background: rgba(26, 26, 34, 0.85); border: 1px solid #33343f; color: #fff; font-size: 14px; border-radius: 6px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .dbtn:active { background: #646cff; }
    #action-btn { width: 48px; height: 48px; background: #646cff; border: 1px solid #fff; color: #fff; font-size: 10px; font-weight: bold; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; margin-top: 4px; }

    /* Floating Labels & Speech Bubbles */
    .avatar-label {
      position: absolute; transform: translate(-50%, -100%); pointer-events: none;
      font-size: 11px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      display: flex; flex-direction: column; align-items: center; z-index: 5;
    }
    .chat-bubble {
      background: rgba(255, 255, 255, 0.95); color: #121216; padding: 4px 8px; border-radius: 8px;
      font-size: 10px; font-weight: bold; margin-bottom: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Entry Setup Screen -->
  <div id="setup-modal">
    <div class="card">
      <h2>FRIENDS HOUSE 3D</h2>
      <input type="text" id="username" placeholder="Your Name..." maxlength="12" />
      
      <p style="font-size: 10px; margin-top: 6px; color: #aaa;">AVATAR TYPE:</p>
      <div class="options-grid">
        <div class="opt-btn selected" onclick="selectAvatar('guy', this)">🧍 Guy</div>
        <div class="opt-btn" onclick="selectAvatar('bot', this)">🤖 Bot</div>
        <div class="opt-btn" onclick="selectAvatar('cat', this)">🐱 Cat</div>
      </div>

      <p style="font-size: 10px; margin-top: 6px; color: #aaa;">AVATAR COLOR:</p>
      <div class="options-grid" style="justify-content:center; gap:8px;">
        <div class="color-swatch selected" style="background:#ffffff;" onclick="selectColor('#ffffff', this)"></div>
        <div class="color-swatch" style="background:#aaaaaa;" onclick="selectColor('#aaaaaa', this)"></div>
        <div class="color-swatch" style="background:#555555;" onclick="selectColor('#555555', this)"></div>
        <div class="color-swatch" style="background:#e8a5a5;" onclick="selectColor('#e8a5a5', this)"></div>
        <div class="color-swatch" style="background:#a5e8c5;" onclick="selectColor('#a5e8c5', this)"></div>
      </div>

      <input type="text" id="room-code" placeholder="Room Code (Blank to Host)" />
      <button class="start" onclick="enterHouse()">ENTER APARTMENT</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-container">
    <canvas id="canvas3d"></canvas>
    <div id="labels-container"></div>
    
    <div id="room-info">
      <div>ROOM: <span id="display-room-code" style="font-weight:bold; color:#646cff;">---</span></div>
      <div id="status-tag" style="font-size: 9px; color: #4CAF50; margin-top:2px;">Connecting...</div>
    </div>

    <div id="player-list">
      <div style="font-weight:bold; border-bottom:1px solid #33343f; padding-bottom:4px; margin-bottom:4px;">PLAYERS</div>
      <div id="player-names"></div>
    </div>

    <div id="chat-container">
      <div id="chat-logs"></div>
      <input type="text" id="chat-input" placeholder="Chat... (Enter)" />
    </div>

    <div id="emote-bar">
      <button class="emote-btn" onclick="sendEmote('👋')">👋</button>
      <button class="emote-btn" onclick="sendEmote('❤️')">❤️</button>
      <button class="emote-btn" onclick="sendEmote('😂')">😂</button>
      <button class="emote-btn" onclick="sendEmote('🎵')">🎵</button>
    </div>

    <div id="controls-container">
      <div id="dpad">
        <div></div><div class="dbtn" id="btn-up">▲</div><div></div>
        <div class="dbtn" id="btn-left">◀</div><div></div><div class="dbtn" id="btn-right">▶</div>
        <div></div><div class="dbtn" id="btn-down">▼</div><div></div>
      </div>
      <div id="action-btn" onclick="triggerInteraction()">ACT (E)</div>
    </div>
  </div>

  <script>
    // --- AUDIO ENGINE ---
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playTone(freq, type = 'square', dur = 0.1, vol = 0.03) {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }
    function playStepSFX() { playTone(110 + Math.random()*30, 'triangle', 0.04, 0.015); }
    function playDoorSFX() { playTone(180, 'sawtooth', 0.12, 0.03); }
    function playTVSFX() { playTone(520, 'square', 0.08, 0.02); }
    function playChatChime() { playTone(600, 'sine', 0.08, 0.03); setTimeout(() => playTone(900, 'sine', 0.1, 0.03), 80); }

    // --- THREE.JS ENGINE & WORLD STATE ---
    let scene, camera, renderer;
    let tvScreenMesh, tvLight;
    let doorMeshes = [];
    let selectedAvatar = 'guy', selectedColor = '#ffffff', isHost = false;

    let localPlayer = {
      id: '', name: '', avatar: 'guy', color: '#ffffff',
      x: 0, z: 2, rot: 0, speed: 0.12, isMoving: false, state: 'normal', drinkColor: null,
      bubble: null, mesh: null, labelEl: null, drinkMesh: null, bubbleTimer: null
    };

    let players = {};
    let keys = {};
    let peer = null, connections = {};
    let animFrame = 0;
    
    let tvChannel = 1;
    let doorsState = [false, false, false];

    const solids = [
      { minX: -10, maxX: 10, minZ: -8.2, maxZ: -7.8 },
      { minX: -10.2, maxX: -9.8, minZ: -8, maxZ: 8 },
      { minX: 9.8, maxX: 10.2, minZ: -8, maxZ: 8 },
      { minX: -10, maxX: 10, minZ: 7.8, maxZ: 8.2 },
      { minX: -10, maxX: 10, minZ: 1.8, maxZ: 2.2 },
      { minX: 5.5, maxX: 10, minZ: -8, maxZ: -3 }
    ];

    function selectAvatar(type, el) {
      selectedAvatar = type;
      document.querySelectorAll('#setup-modal .opt-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
    }

    function selectColor(colorHex, el) {
      selectedColor = colorHex;
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
    }

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0e0e12);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 22, 22);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));

      const dirLight = new THREE.DirectionalLight(0xffefa6, 0.7);
      dirLight.position.set(15, 25, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      buildApartment3D();
      window.addEventListener('resize', onWindowResize);
    }

    function buildApartment3D() {
      // Floor
      const floor = new THREE.Mesh(new THREE.BoxGeometry(20, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0xc29468, roughness: 0.5 }));
      floor.position.y = -0.1; floor.receiveShadow = true; scene.add(floor);

      // Walls
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x222431, roughness: 0.8 });
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(20, 5, 0.4), wallMat); backWall.position.set(0, 2.5, -8); scene.add(backWall);
      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5, 16), wallMat); leftWall.position.set(-10, 2.5, 0); scene.add(leftWall);
      const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5, 16), wallMat); rightWall.position.set(10, 2.5, 0); scene.add(rightWall);

      // Bedroom Partition Wall
      const partWall = new THREE.Mesh(new THREE.BoxGeometry(20, 5, 0.3), wallMat);
      partWall.position.set(0, 2.5, 2); scene.add(partWall);

      // Doors
      const doorGeo = new THREE.BoxGeometry(2.4, 4, 0.15);
      const doorMat = new THREE.MeshStandardMaterial({ color: 0x5c3d2e });
      [-6, 0, 6].forEach((xPos, idx) => {
        const doorPivot = new THREE.Group();
        doorPivot.position.set(xPos - 1.2, 2, 2);
        const doorMesh = new THREE.Mesh(doorGeo, doorMat);
        doorMesh.position.set(1.2, 0, 0); doorMesh.castShadow = true;
        doorPivot.add(doorMesh); scene.add(doorPivot); doorMeshes.push(doorPivot);
      });

      // Furniture
      const couchMat = new THREE.MeshStandardMaterial({ color: 0x2a9d8f });
      const couchBase = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.8, 1.8), couchMat);
      couchBase.position.set(-4, 0.4, -4); couchBase.castShadow = true; scene.add(couchBase);

      const table = new THREE.Mesh(new THREE.BoxGeometry(3, 0.6, 1.5), new THREE.MeshStandardMaterial({ color: 0x8d99ae }));
      table.position.set(-4, 0.3, -1.8); table.castShadow = true; scene.add(table);

      // Working Desk & PC
      const desk = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.2, 1.5), new THREE.MeshStandardMaterial({ color: 0x4a3b32 }));
      desk.position.set(-8, 0.6, -7); desk.castShadow = true; scene.add(desk);
      const pcScreen = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.1), new THREE.MeshStandardMaterial({ color: 0x00f5d4, emissive: 0x00f5d4, emissiveIntensity: 0.4 }));
      pcScreen.position.set(-8, 1.6, -7.2); scene.add(pcScreen);

      // TV Unit
      const tvStand = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1, 0.8), new THREE.MeshStandardMaterial({ color: 0x111111 }));
      tvStand.position.set(3.5, 0.5, -7.5); scene.add(tvStand);
      tvScreenMesh = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.4, 0.15), new THREE.MeshStandardMaterial({ color: 0x00f5d4, emissive: 0x00f5d4, emissiveIntensity: 0.6 }));
      tvScreenMesh.position.set(3.5, 1.8, -7.5); scene.add(tvScreenMesh);
      tvLight = new THREE.PointLight(0x00f5d4, 1.5, 8); tvLight.position.set(3.5, 1.8, -7); scene.add(tvLight);

      // Kitchen & Fridge
      const kitchenCounter = new THREE.Mesh(new THREE.BoxGeometry(4, 1.4, 4), new THREE.MeshStandardMaterial({ color: 0xedf2f4 }));
      kitchenCounter.position.set(7.5, 0.7, -5.5); kitchenCounter.castShadow = true; scene.add(kitchenCounter);
      const fridge = new THREE.Mesh(new THREE.BoxGeometry(1.6, 3.2, 1.6), new THREE.MeshStandardMaterial({ color: 0xd8e2dc }));
      fridge.position.set(8.5, 1.6, -1.5); fridge.castShadow = true; scene.add(fridge);

      // 3 Bedroom Beds
      const bedMat = new THREE.MeshStandardMaterial({ color: 0xe63946 });
      [-6, 0, 6].forEach(xPos => {
        const bed = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 3.5), bedMat);
        bed.position.set(xPos, 0.3, 5.5); bed.castShadow = true; scene.add(bed);
      });
    }

    function createAvatarMesh(avatarType, colorHex) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(colorHex), roughness: 0.3 });

      if (avatarType === 'bot') {
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat); head.position.y = 1.4; group.add(head);
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.6), mat); body.position.y = 0.6; group.add(body);
      } else if (avatarType === 'cat') {
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), mat); head.position.y = 1.1; group.add(head);
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.8, 16), mat); body.position.y = 0.4; group.add(body);
      } else {
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), mat); head.position.y = 1.5; group.add(head);
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.3, 1.1, 16), mat); body.position.y = 0.75; group.add(body);
      }

      // Hand Item Pivot
      const drinkPivot = new THREE.Group();
      drinkPivot.name = 'drinkPivot';
      drinkPivot.position.set(0.4, 0.8, 0.3);
      group.add(drinkPivot);

      scene.add(group);
      return group;
    }

    function updateHeldDrinkMesh(player) {
      if (!player.mesh) return;
      const pivot = player.mesh.getObjectByName('drinkPivot');
      if (!pivot) return;

      while(pivot.children.length > 0) pivot.remove(pivot.children[0]);

      if (player.drinkColor) {
        const canGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.35, 12);
        const canMat = new THREE.MeshStandardMaterial({ color: player.drinkColor });
        const canMesh = new THREE.Mesh(canGeo, canMat);
        pivot.add(canMesh);
      }
    }

    function createLabelOverlay(player) {
      const div = document.createElement('div');
      div.className = 'avatar-label';
      div.innerHTML = `<div class="chat-bubble" id="bubble-${player.id}" style="display:none;"></div><div id="name-${player.id}">${player.name}</div>`;
      document.getElementById('labels-container').appendChild(div);
      player.labelEl = div;
    }

    function updateLabelPosition(player) {
      if (!player.mesh || !player.labelEl) return;
      const tempV = new THREE.Vector3(player.x, player.state === 'sleeping' ? 1.0 : 2.2, player.z);
      tempV.project(camera);
      const x = (tempV.x * .5 + .5) * window.innerWidth;
      const y = (tempV.y * -.5 + .5) * window.innerHeight;
      player.labelEl.style.transform = `translate(-50%, -100%) translate(${x}px,${y}px)`;
    }

    function enterHouse() {
      initAudio();
      const name = document.getElementById('username').value.trim();
      if (!name) return alert('Please enter your name!');
      
      localPlayer.name = name; localPlayer.avatar = selectedAvatar; localPlayer.color = selectedColor;
      localPlayer.id = Math.random().toString(36).substring(2, 7);
      
      const targetRoom = document.getElementById('room-code').value.trim().toLowerCase();
      
      document.getElementById('setup-modal').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      init3D();
      localPlayer.mesh = createAvatarMesh(localPlayer.avatar, localPlayer.color);
      createLabelOverlay(localPlayer);

      setupMobileControls();
      initMultiplayer(targetRoom);
      requestAnimationFrame(gameLoop);
    }

    function setupMobileControls() {
      const bind = (id, key) => {
        const btn = document.getElementById(id);
        const on = (e) => { e.preventDefault(); keys[key] = true; };
        const off = (e) => { e.preventDefault(); keys[key] = false; };
        btn.addEventListener('touchstart', on); btn.addEventListener('touchend', off);
        btn.addEventListener('mousedown', on); btn.addEventListener('mouseup', off);
      };
      bind('btn-up', 'ArrowUp'); bind('btn-down', 'ArrowDown');
      bind('btn-left', 'ArrowLeft'); bind('btn-right', 'ArrowRight');
    }

    function initMultiplayer(targetRoom) {
      isHost = !targetRoom;
      const roomID = isHost ? Math.random().toString(36).substring(2, 7) : targetRoom;
      document.getElementById('display-room-code').innerText = roomID;
      
      peer = new Peer(isHost ? roomID : undefined);

      peer.on('open', () => {
        document.getElementById('status-tag').innerText = isHost ? "HOSTING" : "CONNECTED";
        if (!isHost) bindEvents(peer.connect(roomID));
      });

      peer.on('connection', conn => bindEvents(conn));
    }

    function bindEvents(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.send({ type: 'sync', player: getPlayerData(), tvChannel, doorsState });
      });

      conn.on('data', data => {
        if (data.type === 'sync' || data.type === 'move') {
          updateRemotePlayer(data.player);
          if (data.tvChannel !== undefined) setTVState(data.tvChannel);
          if (data.doorsState) setDoorsState(data.doorsState);
          if (data.type === 'sync') conn.send({ type: 'move', player: getPlayerData(), tvChannel, doorsState });
        } else if (data.type === 'chat') {
          let dist = Math.hypot(localPlayer.x - data.x, localPlayer.z - data.z);
          let text = dist < 8 ? data.message : "...[muffled]...";
          addChatMessage(data.name, text);
          if (players[data.id]) setSpeechBubble(players[data.id], text);
          playChatChime();
        } else if (data.type === 'interact') {
          setTVState(data.tvChannel);
          setDoorsState(data.doorsState);
        }
        updatePlayerList();
      });

      conn.on('close', () => {
        if (players[conn.peer]) {
          scene.remove(players[conn.peer].mesh);
          if (players[conn.peer].labelEl) players[conn.peer].labelEl.remove();
          delete players[conn.peer];
        }
        delete connections[conn.peer];
        updatePlayerList();
      });
    }

    function getPlayerData() {
      return {
        id: localPlayer.id, name: localPlayer.name, avatar: localPlayer.avatar,
        color: localPlayer.color, x: localPlayer.x, z: localPlayer.z, rot: localPlayer.rot,
        state: localPlayer.state, drinkColor: localPlayer.drinkColor
      };
    }

    function updateRemotePlayer(data) {
      if (!players[data.id]) {
        players[data.id] = { ...data, mesh: createAvatarMesh(data.avatar, data.color) };
        createLabelOverlay(players[data.id]);
      }
      let p = players[data.id];
      p.x = data.x; p.z = data.z; p.rot = data.rot; p.state = data.state;
      if (p.drinkColor !== data.drinkColor) {
        p.drinkColor = data.drinkColor;
        updateHeldDrinkMesh(p);
      }
      if (p.mesh) {
        if (p.state === 'sleeping') {
          p.mesh.position.set(p.x, 0.4, p.z);
          p.mesh.rotation.x = Math.PI / 2;
        } else {
          p.mesh.position.set(p.x, p.state === 'seated' ? -0.3 : 0, p.z);
          p.mesh.rotation.x = 0;
          p.mesh.rotation.y = p.rot;
        }
      }
    }

    function broadcast(data) {
      for (let id in connections) {
        if (connections[id].open) connections[id].send(data);
      }
    }

    function updatePlayerList() {
      let html = `<div>• ${localPlayer.name} (You)</div>`;
      for (let id in players) html += `<div>• ${players[id].name}</div>`;
      document.getElementById('player-names').innerHTML = html;
    }

    // --- KEYBOARD & ISOLATED CHAT FOCUS LOGIC ---
    const chatInput = document.getElementById('chat-input');
    let isChatFocused = false;

    chatInput.addEventListener('focus', () => { isChatFocused = true; keys = {}; });
    chatInput.addEventListener('blur', () => { isChatFocused = false; });

    window.addEventListener('keydown', e => {
      if (isChatFocused) {
        if (e.key === 'Enter' && chatInput.value.trim()) {
          let msg = chatInput.value.trim();
          addChatMessage(localPlayer.name, msg);
          setSpeechBubble(localPlayer, msg);
          broadcast({ type: 'chat', id: localPlayer.id, name: localPlayer.name, message: msg, x: localPlayer.x, z: localPlayer.z });
          chatInput.value = '';
          chatInput.blur();
        }
        return; // Prevent WASD or E keys from moving avatar while typing!
      }

      keys[e.key] = true;
      if (e.key === 'e' || e.key === 'E') triggerInteraction();
    });

    window.addEventListener('keyup', e => {
      if (!isChatFocused) keys[e.key] = false;
    });

    function setSpeechBubble(p, text) {
      if (!p.labelEl) return;
      const bubble = p.labelEl.querySelector('.chat-bubble');
      bubble.innerText = text; bubble.style.display = 'block';

      if (p.bubbleTimer) clearTimeout(p.bubbleTimer);
      p.bubbleTimer = setTimeout(() => { bubble.style.display = 'none'; }, 4000);
    }

    function sendEmote(symbol) {
      setSpeechBubble(localPlayer, symbol);
      broadcast({ type: 'chat', id: localPlayer.id, name: localPlayer.name, message: symbol, x: localPlayer.x, z: localPlayer.z });
    }

    function addChatMessage(sender, text) {
      const logs = document.getElementById('chat-logs');
      logs.innerHTML += `<div><strong>${sender}:</strong> ${text}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }

    function setTVState(ch) {
      tvChannel = ch;
      if (ch === 0) {
        tvScreenMesh.material.emissive.setHex(0x000000); tvLight.intensity = 0;
      } else if (ch === 1) {
        tvScreenMesh.material.emissive.setHex(0x00f5d4); tvLight.color.setHex(0x00f5d4); tvLight.intensity = 1.5;
      } else {
        tvScreenMesh.material.emissive.setHex(0x38b000); tvLight.color.setHex(0x38b000); tvLight.intensity = 1.8;
      }
    }

    function setDoorsState(stateArray) {
      doorsState = stateArray;
      doorMeshes.forEach((mesh, idx) => {
        mesh.rotation.y = doorsState[idx] ? Math.PI / 2 : 0;
      });
    }

    function triggerInteraction() {
      // Sit on Couch
      if (Math.hypot(localPlayer.x - (-4), localPlayer.z - (-4)) < 2.2) {
        localPlayer.state = localPlayer.state === 'seated' ? 'normal' : 'seated';
        if (localPlayer.state === 'seated') { localPlayer.x = -4; localPlayer.z = -4; }
        broadcast({ type: 'move', player: getPlayerData(), tvChannel, doorsState });
      }
      // Beds / Sleeping
      else if (localPlayer.z > 3.5) {
        [-6, 0, 6].forEach(xPos => {
          if (Math.hypot(localPlayer.x - xPos, localPlayer.z - 5.5) < 2.2) {
            localPlayer.state = localPlayer.state === 'sleeping' ? 'normal' : 'sleeping';
            if (localPlayer.state === 'sleeping') {
              localPlayer.x = xPos; localPlayer.z = 5.5;
              setSpeechBubble(localPlayer, "Zzz...");
            }
            broadcast({ type: 'move', player: getPlayerData(), tvChannel, doorsState });
          }
        });
      }
      // TV Toggle
      else if (Math.hypot(localPlayer.x - 3.5, localPlayer.z - (-7)) < 2.5) {
        tvChannel = (tvChannel + 1) % 3;
        setTVState(tvChannel); playTVSFX();
        broadcast({ type: 'interact', tvChannel, doorsState });
      }
      // Fridge Beverage
      else if (Math.hypot(localPlayer.x - 8.5, localPlayer.z - (-1.5)) < 2.2) {
        const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00];
        localPlayer.drinkColor = colors[Math.floor(Math.random() * colors.length)];
        updateHeldDrinkMesh(localPlayer);
        setSpeechBubble(localPlayer, `Got a cold drink! 🥤`);
        broadcast({ type: 'move', player: getPlayerData(), tvChannel, doorsState });
      }
      // Doors
      else {
        [-6, 0, 6].forEach((xPos, idx) => {
          if (Math.hypot(localPlayer.x - xPos, localPlayer.z - 2) < 2) {
            doorsState[idx] = !doorsState[idx];
            setDoorsState(doorsState); playDoorSFX();
            broadcast({ type: 'interact', tvChannel, doorsState });
          }
        });
      }
    }

    function checkCollision(nextX, nextZ) {
      for (let s of solids) {
        if (nextX > s.minX && nextX < s.maxX && nextZ > s.minZ && nextZ < s.maxZ) return true;
      }
      return false;
    }

    function updatePhysics() {
      animFrame++;
      let dx = 0, dz = 0;

      if (localPlayer.state === 'normal' && !isChatFocused) {
        if (keys['ArrowUp'] || keys['w']) dz -= 1;
        if (keys['ArrowDown'] || keys['s']) dz += 1;
        if (keys['ArrowLeft'] || keys['a']) dx -= 1;
        if (keys['ArrowRight'] || keys['d']) dx += 1;

        if (dx !== 0 || dz !== 0) {
          let len = Math.hypot(dx, dz);
          dx /= len; dz /= len;

          let nextX = localPlayer.x + dx * localPlayer.speed;
          let nextZ = localPlayer.z + dz * localPlayer.speed;

          if (!checkCollision(nextX, localPlayer.z)) localPlayer.x = nextX;
          if (!checkCollision(localPlayer.x, nextZ)) localPlayer.z = nextZ;

          localPlayer.rot = Math.atan2(dx, dz);
          localPlayer.isMoving = true;

          if (animFrame % 16 === 0) playStepSFX();
        } else {
          localPlayer.isMoving = false;
        }
      }

      // Local Mesh Transformations
      if (localPlayer.mesh) {
        if (localPlayer.state === 'sleeping') {
          localPlayer.mesh.position.set(localPlayer.x, 0.4, localPlayer.z);
          localPlayer.mesh.rotation.x = Math.PI / 2;
        } else {
          let posY = localPlayer.state === 'seated' ? -0.3 : (localPlayer.isMoving ? Math.abs(Math.sin(animFrame * 0.2)) * 0.15 : 0);
          localPlayer.mesh.position.set(localPlayer.x, posY, localPlayer.z);
          localPlayer.mesh.rotation.x = 0;
          localPlayer.mesh.rotation.y = localPlayer.rot;
        }
      }

      updateLabelPosition(localPlayer);
      for (let id in players) updateLabelPosition(players[id]);

      if (localPlayer.isMoving) {
        broadcast({ type: 'move', player: getPlayerData(), tvChannel, doorsState });
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function gameLoop() {
      updatePhysics();
      renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
