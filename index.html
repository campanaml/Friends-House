<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neighborhood World - Mega City PRO (v4.1.0)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body { background: #000; color: #fff; overflow: hidden; }

    #setup-modal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100;
    }
    .setup-box {
      border: 2px solid #fff; padding: 25px; background: #111;
      display: flex; flex-direction: column; gap: 15px; width: 340px;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    .setup-box input, .setup-box button, .setup-box select {
      background: #000; color: #fff; border: 1px solid #fff; padding: 10px;
      font-family: monospace; cursor: pointer;
    }
    .setup-box button:hover { background: #fff; color: #000; }

    #game-container { display: none; width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; background: #27ae60; width: 100vw; height: 100vh; }

    #hud {
      position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.85);
      border: 1px solid #fff; padding: 10px; z-index: 10; font-size: 12px;
      display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    }
    
    #hud-controls {
      position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; max-width: 480px;
    }
    #hud-controls button {
      background: rgba(0,0,0,0.85); color: #fff; border: 1px solid #fff;
      padding: 6px 10px; font-family: monospace; cursor: pointer;
    }
    #hud-controls button:hover { background: #fff; color: #000; }

    .game-modal {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); background: #111; border: 2px solid #fff;
      padding: 15px; width: 340px; z-index: 20; color: #fff;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }
    .game-modal h3 { border-bottom: 1px solid #fff; padding-bottom: 5px; margin-bottom: 10px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; }
    .item-row button { background: #000; color: #fff; border: 1px solid #fff; padding: 4px 8px; cursor: pointer; }
    .item-row button:hover { background: #fff; color: #000; }

    #chat-container {
      position: absolute; bottom: 10px; left: 10px; width: 320px;
      background: rgba(0,0,0,0.85); border: 1px solid #fff; z-index: 10;
    }
    #chat-container.minimized #chat-logs { display: none; }
    #chat-header {
      background: #222; padding: 5px 10px; cursor: pointer;
      display: flex; justify-content: space-between; border-bottom: 1px solid #fff;
    }
    #chat-logs { height: 130px; overflow-y: auto; padding: 8px; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
    #chat-input-box { border-top: 1px solid #fff; display: flex; }
    #chat-input { background: #000; color: #fff; border: none; padding: 8px; width: 100%; font-family: monospace; }

    #notification-zone {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      z-index: 30; pointer-events: none; display: flex; flex-direction: column; gap: 5px;
    }
    .toast {
      background: rgba(0,0,0,0.9); border: 1px solid #fff; padding: 6px 14px;
      font-size: 11px; text-align: center; box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    .toast.success { border-color: #0f0; color: #0f0; }
    .toast.error { border-color: #f00; color: #f00; }

    #mobile-controls {
      display: none; position: absolute; bottom: 20px; right: 20px; z-index: 10;
    }
    .dpad-row { display: flex; justify-content: center; }
    .dpad-btn {
      width: 48px; height: 48px; background: rgba(255,255,255,0.2);
      border: 1px solid #fff; color: #fff; font-size: 18px; display: flex;
      align-items: center; justify-content: center; user-select: none;
    }
    @media (pointer: coarse) { #mobile-controls { display: block; } }
  </style>
</head>
<body>

  </div>

  <div id="game-container">
    <div id="hud">
      <div>BUILD: <span style="color:#0f0;">v4.1.0 MEGA</span></div>
      <div>ROOM: <span id="display-room-code">MAIN-CITY</span></div>
      <div>STATUS: <span id="status-tag" style="color:#0f0;">CONNECTING...</span></div>
      <div>LOCATION: <span id="location-tag">HOME</span></div>
      <div>COINS: $<span id="coins-display">100</span></div>
      <div id="player-names" style="margin-top:5px; font-size:10px; color:#aaa;"></div>
    </div>

    <div id="hud-controls">
      <button onclick="sendEmote('👋')">👋</button>
      <button onclick="sendEmote('❤️')">❤️</button>
      <button onclick="sendEmote('😂')">😂</button>
      <button onclick="toggleShop()">SHOP (B)</button>
      <button onclick="toggleInventory()">BACKPACK (I)</button>
      <button onclick="resetPosition()">RESET (SAFE)</button>
    </div>

    <div id="notification-zone"></div>

    <div id="shop-modal" class="game-modal">
      <h3>CITY SHOP</h3>
      <div id="shop-item-list"></div>
      <button onclick="toggleShop()" style="width:100%; margin-top:10px; background:#000; color:#fff; border:1px solid #fff; padding:6px; cursor:pointer;">CLOSE</button>
    </div>

    <div id="inventory-modal" class="game-modal">
      <h3>BACKPACK</h3>
      <div id="inventory-item-list"></div>
      <button onclick="toggleInventory()" style="width:100%; margin-top:10px; background:#000; color:#fff; border:1px solid #fff; padding:6px; cursor:pointer;">CLOSE</button>
    </div>

    <div id="chat-container">
      <div id="chat-header" onclick="toggleChat()">
        <span>WORLD CHAT</span>
        <span id="chat-toggle-icon">[–]</span>
      </div>
      <div id="chat-logs"></div>
      <div id="chat-input-box">
        <input type="text" id="chat-input" placeholder="Press Enter to chat..." maxlength="60">
      </div>
    </div>

    <div id="mobile-controls">
      <div class="dpad-row"><div class="dpad-btn" id="btn-up">▲</div></div>
      <div class="dpad-row">
        <div class="dpad-btn" id="btn-left">◄</div>
        <div class="dpad-btn" style="opacity:0;"></div>
        <div class="dpad-btn" id="btn-right">►</div>
      </div>
      <div class="dpad-row"><div class="dpad-btn" id="btn-down">▼</div></div>
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <script>

    let players = {};

    // Manzanas estrictamente estructuradas (Máximo 4 casas por manzana, con garages integrados)

      { id: 'house_hospital', name: "General Hospital 🏥", x: 1950, y: 180, w: 200, h: 140, doorX: 2050, doorY: 320, exitX: 2050, exitY: 370, furniture: '💊 Medical Beds', hasGarage: true, garageX: 2160, garageY: 180, garageW: 100, garageH: 140 },
      { id: 'house_bar', name: "The Neon Pub 🍻", x: 2350, y: 180, w: 200, h: 140, doorX: 2450, doorY: 320, exitX: 2450, exitY: 370, furniture: '🍸 Jukebox & Bar', hasGarage: true, garageX: 2560, garageY: 180, garageW: 100, garageH: 140 },
      { id: 'house_shop', name: "Mini Mart 🛒", x: 2750, y: 180, w: 200, h: 140, doorX: 2850, doorY: 320, exitX: 2850, exitY: 370, furniture: '📦 Snack Shelves', hasGarage: true, garageX: 2960, garageY: 180, garageW: 100, garageH: 140 },

      // --- Manzana 3: Ocio y Recreación (3 casas/locales) ---
      { id: 'house_arcade', name: "Retro Arcade 🕹️", x: 3250, y: 180, w: 220, h: 140, doorX: 3360, doorY: 320, exitX: 3360, exitY: 370, furniture: '👾 Pinball Machines', hasGarage: true, garageX: 3480, garageY: 180, garageW: 100, garageH: 140 },
      { id: 'house_pizzeria', name: "Pizza Palace 🍕", x: 3650, y: 180, w: 220, h: 140, doorX: 3760, doorY: 320, exitX: 3760, exitY: 370, furniture: '🍕 Oven & Tables', hasGarage: true, garageX: 3880, garageY: 180, garageW: 100, garageH: 140 },

      // --- Manzana 4: Zona Sur Residencial (4 casas) ---
      { id: 'house_sub2', name: "Suburban Villa B", x: 150, y: 1640, w: 180, h: 140, doorX: 240, doorY: 1780, exitX: 240, exitY: 1830, furniture: '💻 Office & PC', hasGarage: true, garageX: 340, garageY: 1640, garageW: 100, garageH: 140 },
      { id: 'house_sub3', name: "Modern Loft A", x: 470, y: 1640, w: 180, h: 140, doorX: 560, doorY: 1780, exitX: 560, exitY: 1830, furniture: '🎨 Art Studio', hasGarage: true, garageX: 660, garageY: 1640, garageW: 100, garageH: 140 },
      { id: 'house_sub4', name: "Modern Loft B", x: 790, y: 1640, w: 180, h: 140, doorX: 880, doorY: 1780, exitX: 880, exitY: 1830, furniture: '📚 Library & Desk', hasGarage: true, garageX: 980, garageY: 1640, garageW: 100, garageH: 140 },
      { id: 'house_hotel', name: "Grand Hotel 🏨", x: 1110, y: 1640, w: 180, h: 140, doorX: 1200, doorY: 1780, exitX: 1200, exitY: 1830, furniture: '🛎️ Lobby Suite', hasGarage: true, garageX: 1300, garageY: 1640, garageW: 100, garageH: 140 }
    ];

    let outdoorSolids = houses.map(h => ({ x: h.x, y: h.y, w: h.w, h: h.h })).concat(
      houses.filter(h => h.hasGarage).map(h => ({ x: h.garageX, y: h.garageY, w: h.garageW, h: h.garageH }))
    ).concat([
      { x: 1000, y: 900, w: 350, h: 300 }
    ]);

    let houseSolids = [
      { x: 100, y: 100, w: 600, h: 10 },
      { x: 100, y: 100, w: 10, h: 400 },
      { x: 690, y: 100, w: 10, h: 400 },
      { x: 100, y: 490, w: 250, h: 10 },
      { x: 450, y: 490, w: 250, h: 10 },
      { x: 250, y: 200, w: 300, h: 100 }
    ];

    let npcCitizens = [
      { id: 'npc_1', name: 'Lucas', avatar: 'martin', color: '#00ffff', x: 500, y: 365, vx: 1.2, vy: 0, minX: 150, maxX: 850, minY: 365, maxY: 365, radius: 12, walkCycle: 0 },
      { id: 'npc_2', name: 'Sofia', avatar: 'gaby', color: '#ff00ff', x: 965, y: 700, vx: 0, vy: 1.2, minX: 965, maxX: 965, minY: 500, maxY: 1300, radius: 12, walkCycle: 0 },
      { id: 'npc_3', name: 'Mateo', avatar: 'facu', color: '#ffff00', x: 2400, y: 365, vx: 1.0, vy: 0, minX: 2050, maxX: 2850, minY: 365, maxY: 365, radius: 12, walkCycle: 0 },
      { id: 'npc_4', name: 'Valentina', avatar: 'gaby', color: '#ff5722', x: 1965, y: 1000, vx: 0, vy: -1.0, minX: 1965, maxX: 1965, minY: 600, maxY: 1400, radius: 12, walkCycle: 0 },
      { id: 'npc_5', name: 'Diego', avatar: 'martin', color: '#00ff00', x: 2000, y: 1465, vx: 1.2, vy: 0, minX: 1500, maxX: 2800, minY: 1465, maxY: 1465, radius: 12, walkCycle: 0 }
    ];

    let npcVehicles = [
      { id: 'npcc_1', type: 'car', color: '#e74c3c', x: 300, y: 445, vx: 3.5, vy: 0, angle: 0 },
      { id: 'npcc_2', type: 'truck', color: '#34495e', x: 1200, y: 495, vx: -2.0, vy: 0, angle: Math.PI },
      { id: 'npcc_3', type: 'moto', color: '#e67e22', x: 2000, y: 435, vx: 5.0, vy: 0, angle: 0 }
    ];

    let trafficLights = [
      { x: 935, y: 380, state: 'green', timer: 0 },
      { x: 1935, y: 380, state: 'red', timer: 0 },
      { x: 2935, y: 380, state: 'green', timer: 0 }
    ];

    let sceneryTrees = [
      { x: 100, y: 100, r: 45 }, { x: 800, y: 100, r: 50 }, { x: 1750, y: 100, r: 52 }, { x: 3000, y: 100, r: 50 }
    ];

    let streetLights = [
      { x: 840, y: 350 }, { x: 1450, y: 350 }, { x: 1950, y: 350 }, { x: 2850, y: 350 }
    ];

    let clouds = [
      { x: 300, y: 70, speed: 0.18 }, { x: 1400, y: 110, speed: 0.12 }, { x: 2800, y: 80, speed: 0.22 }
    ];

    let vehicles = [
      { id: 'v_car1', type: 'car', color: '#e67e22', x: 340, y: 350, speed: 8, driver: null, location: 'world' },
      { id: 'v_car2', type: 'car', color: '#2980b9', x: 660, y: 350, speed: 8, driver: null, location: 'world' },
      { id: 'v_car3', type: 'car', color: '#f1c40f', x: 980, y: 350, speed: 8, driver: null, location: 'world' },
      { id: 'v_plane1', type: 'plane', color: '#ecf0f1', x: 1800, y: 2330, speed: 11, driver: null, location: 'world' }
    ];

    let mapCoins = [
      { id: 1, x: 500, y: 550, active: true },
      { id: 2, x: 1500, y: 800, active: true },
      { id: 3, x: 2400, y: 450, active: true }
    ];

    let shopItems = [
      { id: 'item_sunglasses', name: 'Cool Shades 😎', price: 20, type: 'hat' },
      { id: 'item_crown', name: 'Golden Crown 👑', price: 250, type: 'hat' },
      { id: 'item_energy', name: 'Energy Drink ⚡', price: 15, type: 'consumable' },
      { id: 'item_teleport', name: 'Home Teleport 🛸', price: 50, type: 'consumable' },
      { id: 'item_hoverboard', name: 'Hoverboard 🛹', price: 150, type: 'mount' }
    ];

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq, type, duration, vol) {
      if (!audioCtx) return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }
    function playCoinSFX() { playTone(987, 'sine', 0.2, 0.1); }
    function playFootstepSFX() { playTone(120, 'triangle', 0.05, 0.02); }
    function playVehicleSFX() { playTone(55, 'sawtooth', 0.08, 0.025); }
    function playEquipSFX() { playTone(880, 'sine', 0.15, 0.08); }
    function playPowerupSFX() { playTone(440, 'square', 0.3, 0.05); }

    function showNotification(msg, type = 'normal') {
      const zone = document.getElementById('notification-zone');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerText = msg;
      zone.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3000);
    }

    function savePlayerData() {
      document.getElementById('coins-display').innerText = localPlayer.coins;
      localStorage.setItem(`nh_coins_${localPlayer.name}`, localPlayer.coins);
      localStorage.setItem(`nh_inventory_${localPlayer.name}`, JSON.stringify(localPlayer.inventory));
      localStorage.setItem(`nh_hat_${localPlayer.name}`, localPlayer.equippedHat || '');
    }

    function toggleShop() {
      const modal = document.getElementById('shop-modal');
      modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
      if (modal.style.display === 'block') renderShop();
    }

    function renderShop() {
      const container = document.getElementById('shop-item-list');
      container.innerHTML = '';
      shopItems.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `<span>${item.name} ($${item.price})</span><button onclick="buyItem('${item.id}')">BUY</button>`;
        container.appendChild(div);
      });
    }

    function buyItem(itemId) {
      const item = shopItems.find(i => i.id === itemId);
      if (!item) return;
      if (localPlayer.coins >= item.price) {
        localPlayer.coins -= item.price;
        localPlayer.inventory.push({ ...item, instanceId: Math.random().toString(36).substring(2, 7) });
        savePlayerData();
        playCoinSFX();
        showNotification(`Purchased ${item.name}!`, 'success');
        if (document.getElementById('inventory-modal').style.display === 'block') renderInventory();
      } else {
        showNotification("Not enough coins!", 'error');
      }
    }

    function toggleInventory() {
      const modal = document.getElementById('inventory-modal');
      modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
      if (modal.style.display === 'block') renderInventory();
    }

    function renderInventory() {
      const container = document.getElementById('inventory-item-list');
      container.innerHTML = '';
      if (localPlayer.inventory.length === 0) {
        container.innerHTML = '<div style="font-size:10px; color:#aaa; text-align:center;">Empty Backpack</div>';
        return;
      }

      localPlayer.inventory.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'item-row';
        let btnHTML = '';
        
        if (item.type === 'hat') {
          const isEq = localPlayer.equippedHat === item.id;
          btnHTML = `<button onclick="toggleEquipHat('${item.id}')">${isEq ? 'UNEQUIP' : 'EQUIP'}</button>`;
        } else if (item.type === 'mount') {
          const isMt = localPlayer.isMounted;
          btnHTML = `<button onclick="toggleMount()">${isMt ? 'DISMOUNT' : 'MOUNT'}</button>`;
        } else {
          btnHTML = `<button onclick="useItem(${index})">USE</button>`;
        }

        div.innerHTML = `<span>${item.name}</span>${btnHTML}`;
        container.appendChild(div);
      });
    }

    function toggleEquipHat(hatId) {
      if (localPlayer.equippedHat === hatId) {
        localPlayer.equippedHat = null;
        showNotification("Hat unequipped", 'normal');
      } else {
        localPlayer.equippedHat = hatId;
        showNotification("Hat equipped!", 'success');
      }
      playEquipSFX();
      savePlayerData();
      renderInventory();
      broadcast({ type: 'move', player: localPlayer, vehicles });
    }

    function toggleMount() {
      localPlayer.isMounted = !localPlayer.isMounted;
      if (localPlayer.isMounted) {
        showNotification("Hoverboard Equipped!", 'success');
        playEquipSFX();
      }
      renderInventory();
      broadcast({ type: 'move', player: localPlayer, vehicles });
    }

    function useItem(index) {
      const item = localPlayer.inventory[index];
      if (!item) return;

      if (item.id === 'item_energy') {
        localPlayer.hasAura = true;
        showNotification("Energy Boost! (+Speed)", 'success');
        playPowerupSFX();
        setTimeout(() => {
          localPlayer.hasAura = false;
          broadcast({ type: 'move', player: localPlayer, vehicles });
        }, 8000);
      } else if (item.id === 'item_teleport') {
        localPlayer.location = `house_${localPlayer.avatar}`;
        localPlayer.x = localPlayer.avatar === 'facu' ? 880 : 310; 
        localPlayer.y = 350;
        let homeObj = houses.find(h => h.id === localPlayer.location);
        document.getElementById('location-tag').innerText = homeObj ? homeObj.name.toUpperCase() : "HOME";
        showNotification("Teleported Home!", 'success');
        playPowerupSFX();
      }

      localPlayer.inventory.splice(index, 1);
      savePlayerData();
      renderInventory();
      broadcast({ type: 'move', player: localPlayer, vehicles });
      updatePlayerList();
    }

    function toggleChat() {
      const chatContainer = document.getElementById('chat-container');
      const toggleIcon = document.getElementById('chat-toggle-icon');
      chatContainer.classList.toggle('minimized');
      toggleIcon.innerText = chatContainer.classList.contains('minimized') ? '[+]' : '[–]';
    }

    function sanitizeText(str) {
      let temp = document.createElement('div');
      temp.textContent = str;
      return temp.innerHTML;
    }

    function resetPosition() {
      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) v.driver = null;
        localPlayer.vehicle = null;
      }
      localPlayer.isMounted = false;
      localPlayer.location = `house_${localPlayer.avatar}`;
      localPlayer.x = localPlayer.avatar === 'facu' ? 880 : 310; 
      localPlayer.y = 350;
      let homeObj = houses.find(h => h.id === localPlayer.location);
      document.getElementById('location-tag').innerText = homeObj ? homeObj.name.toUpperCase() : "HOME";
      showNotification("Rescued to safe zone!", 'success');
      broadcast({ type: 'move', player: localPlayer, vehicles });
      updatePlayerList();
    }

    function enterHouse() {
      initAudio();
      const customName = document.getElementById('username-input').value.trim();
      selectedAvatar = document.getElementById('avatar-select').value;
      selectedColor = document.getElementById('color-select').value;
      activeWorldRoom = document.getElementById('world-id-input').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || "main-city";
      window.location.hash = activeWorldRoom;
      document.getElementById('display-room-code').innerText = activeWorldRoom.toUpperCase();

      localPlayer.name = customName || (selectedAvatar.charAt(0).toUpperCase() + selectedAvatar.slice(1));
      localPlayer.avatar = selectedAvatar;
      localPlayer.color = selectedColor;
      localPlayer.id = Math.random().toString(36).substring(2, 7);
      localPlayer.location = `house_${selectedAvatar}`;
      localPlayer.x = selectedAvatar === 'facu' ? 880 : 310;
      localPlayer.y = 350;

      const savedCoins = localStorage.getItem(`nh_coins_${localPlayer.name}`);
      localPlayer.coins = savedCoins !== null ? parseInt(savedCoins, 10) : 100;

      const savedInv = localStorage.getItem(`nh_inventory_${localPlayer.name}`);
      if (savedInv) {
        try { localPlayer.inventory = JSON.parse(savedInv); } catch(e) { localPlayer.inventory = []; }
      }

      const savedHat = localStorage.getItem(`nh_hat_${localPlayer.name}`);
      if (savedHat) localPlayer.equippedHat = savedHat;

      savePlayerData();
      let homeObj = houses.find(h => h.id === localPlayer.location);
      document.getElementById('location-tag').innerText = homeObj ? homeObj.name.toUpperCase() : "HOME";

      document.getElementById('setup-modal').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      setupMobileControls();
      initMultiplayerGlobal();

      if (heartbeatInterval) clearInterval(heartbeatInterval);
      heartbeatInterval = setInterval(() => {
        if (localPlayer.id && Object.keys(connections).length > 0) {
          broadcast({ type: 'move', player: localPlayer, vehicles, isHeartbeat: true });
        }
      }, 1000);

      requestAnimationFrame(gameLoop);
    }

    function setupMobileControls() {
      const bindTouch = (id, keyName) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        const start = (e) => { e.preventDefault(); keys[keyName] = true; };
        const end = (e) => { e.preventDefault(); keys[keyName] = false; };
        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
      };
      bindTouch('btn-up', 'ArrowUp'); bindTouch('btn-down', 'ArrowDown');
      bindTouch('btn-left', 'ArrowLeft'); bindTouch('btn-right', 'ArrowRight');
    }

    function initMultiplayerGlobal() {
      const hostRoomId = `nh-${activeWorldRoom}-host-v410`;
      setTimeout(() => {
        peer = new Peer(hostRoomId);
        peer.on('open', () => {
          isHost = true;
          document.getElementById('status-tag').innerText = "HOSTING MEGA CITY";
        });
        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            peer = new Peer();
            peer.on('open', () => {
              document.getElementById('status-tag').innerText = "CONNECTED";
              connectToHost(hostRoomId);
            });
            peer.on('connection', (conn) => bindConnectionEvents(conn));
          }
        });
        peer.on('connection', (conn) => bindConnectionEvents(conn));
      }, Math.floor(Math.random() * 300));
    }

    function connectToHost(hostRoomId) {
      let hostConn = peer.connect(hostRoomId, { reliable: true });
      bindConnectionEvents(hostConn);
    }

    function bindConnectionEvents(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.send({ type: 'sync', player: localPlayer, vehicles, version: GAME_VERSION });
      });

      conn.on('data', (data) => {
        if (data.type === 'leave') {
          delete players[data.id];
          updatePlayerList();
          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        } else if (data.type === 'sync' || data.type === 'move') {
          data.player.lastSeen = Date.now();
          players[data.player.id] = data.player;
          if (data.vehicles) vehicles = data.vehicles;
          
          if (data.type === 'sync' && !isHost) conn.send({ type: 'move', player: localPlayer, vehicles });

          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        } else if (data.type === 'chat') {
          let sameLocation = (data.location === localPlayer.location);
          let dist = Math.hypot(localPlayer.x - data.x, localPlayer.y - data.y);
          let isNear = sameLocation && dist < 500;
          let text = isNear ? data.message : "...[distant chat]...";
          addChatMessage(data.name, text);
          if (players[data.id] && sameLocation) setSpeechBubble(players[data.id], data.message);
          
          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        } else if (data.type === 'emote') {
          if (players[data.id]) setEmote(players[data.id], data.emote);
          if (isHost) {
            for (let pId in connections) if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
          }
        }
        updatePlayerList();
      });

      conn.on('close', () => {
        delete connections[conn.peer];
        delete players[conn.peer];
        updatePlayerList();
      });
    }

    function broadcast(data) {
      for (let peerId in connections) {
        if (connections[peerId].open) connections[peerId].send(data);
      }
    }

    function cleanupGhostPlayers() {
      const now = Date.now();
      let changed = false;
      for (let id in players) {
        if (id !== localPlayer.id && players[id].lastSeen && (now - players[id].lastSeen > PLAYER_TIMEOUT_MS)) {
          delete players[id]; changed = true;
        }
      }
      if (changed) updatePlayerList();
    }

    function updatePlayerList() {
      const listEl = document.getElementById('player-names');
      let html = `<div>• ${localPlayer.name} (You)</div>`;
      for (let id in players) {
        if (id !== localPlayer.id && players[id].location === localPlayer.location) {
          html += `<div>• ${players[id].name}</div>`;
        }
      }
      listEl.innerHTML = html;
    }

    window.addEventListener('keydown', e => {
      if (document.activeElement === document.getElementById('chat-input')) return;
      keys[e.key] = true;
      if (e.key.toLowerCase() === 'e') triggerInteraction();
      if (e.key.toLowerCase() === 'b') toggleShop();
      if (e.key.toLowerCase() === 'i') toggleInventory();
    });
    window.addEventListener('keyup', e => {
      if (document.activeElement === document.getElementById('chat-input')) return;
      keys[e.key] = false;
    });

    const chatInput = document.getElementById('chat-input');
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && chatInput.value.trim() !== '') {
        const msg = sanitizeText(chatInput.value.trim());
        addChatMessage(localPlayer.name, msg);
        setSpeechBubble(localPlayer, msg);
        broadcast({ type: 'chat', id: localPlayer.id, name: localPlayer.name, message: msg, x: localPlayer.x, y: localPlayer.y, location: localPlayer.location });
        chatInput.value = ''; chatInput.blur();
      }
    });

    function setSpeechBubble(p, text) { p.bubble = { text, timer: Date.now() + 4500 }; }
    function sendEmote(emote) { setEmote(localPlayer, emote); broadcast({ type: 'emote', id: localPlayer.id, emote }); }
    function setEmote(p, emote) { p.emote = { symbol: emote, timer: Date.now() + 3000 }; }
    function addChatMessage(sender, text) {
      const logs = document.getElementById('chat-logs');
      const msgDiv = document.createElement('div');
      msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
      logs.appendChild(msgDiv); logs.scrollTop = logs.scrollHeight;
    }

    function triggerInteraction() {
      if (localPlayer.location === 'world') {
        if (localPlayer.vehicle) {
          let v = vehicles.find(item => item.id === localPlayer.vehicle);
          if (v) { v.driver = null; localPlayer.x = v.x + 50; localPlayer.y = v.y + 50; }
          localPlayer.vehicle = null;
          broadcast({ type: 'move', player: localPlayer, vehicles });
          return;
        }
        vehicles.forEach(v => {
          if (!v.driver && Math.hypot(localPlayer.x - v.x, localPlayer.y - v.y) < 65) {
            v.driver = localPlayer.id; localPlayer.vehicle = v.id; localPlayer.isMounted = false;
          }
        });
        houses.forEach(h => {
          if (Math.hypot(localPlayer.x - h.doorX, localPlayer.y - h.doorY) < 45) {
            localPlayer.location = h.id; localPlayer.x = 350; localPlayer.y = 400;
            document.getElementById('location-tag').innerText = h.name.toUpperCase();
          }
        });
      } else {
        if (Math.hypot(localPlayer.x - 350, localPlayer.y - 480) < 50) {
          let h = houses.find(item => item.id === localPlayer.location);
          localPlayer.location = 'world'; localPlayer.x = h ? h.exitX : 300; localPlayer.y = h ? h.exitY : 370;
          document.getElementById('location-tag').innerText = "WORLD";
        }
      }
      broadcast({ type: 'move', player: localPlayer, vehicles });
      updatePlayerList();
    }

    function checkWallCollision(newX, newY, radius) {
      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v && v.type === 'plane') return false;
      }
      let solids = localPlayer.location === 'world' ? outdoorSolids : houseSolids;
      for (let s of solids) {
        let closestX = Math.max(s.x, Math.min(newX, s.x + s.w));
        let closestY = Math.max(s.y, Math.min(newY, s.y + s.h));
        if (Math.hypot(newX - closestX, newY - closestY) < radius) return true;
      }
      return false;
    }

    function checkCoinPickups() {
      if (localPlayer.location !== 'world') return;
      mapCoins.forEach(coin => {
        if (coin.active && Math.hypot(localPlayer.x - coin.x, localPlayer.y - coin.y) < 25) {
          coin.active = false; localPlayer.coins += 10;
          savePlayerData(); playCoinSFX(); showNotification("+$10 Coins!", 'success');
          setTimeout(() => {
            coin.x = Math.floor(Math.random() * (WORLD_WIDTH - 200)) + 100;
            coin.y = Math.floor(Math.random() * (WORLD_HEIGHT - 200)) + 100;
            coin.active = true;
          }, 10000);
        }
      });
    }

    function updateNPCs() {
      if (animFrame % 180 === 0) {
        trafficLights.forEach(tl => {
          tl.state = (tl.state === 'green') ? 'red' : 'green';
        });
      }

      npcCitizens.forEach(npc => {
        npc.x += npc.vx;
        npc.y += npc.vy;
        npc.walkCycle += 0.15;
        if (npc.vx !== 0 && (npc.x < npc.minX || npc.x > npc.maxX)) npc.vx *= -1;
        if (npc.vy !== 0 && (npc.y < npc.minY || npc.y > npc.maxY)) npc.vy *= -1;
      });

      npcVehicles.forEach(car => {
        car.x += car.vx;
        car.y += car.vy;
        if (car.x < 100) car.x = WORLD_WIDTH - 200;
        if (car.x > WORLD_WIDTH - 100) car.x = 200;
      });
    }

    function update() {
      animFrame++;
      cleanupGhostPlayers();
      updateNPCs();

      clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > WORLD_WIDTH + 100) c.x = -100;
      });

      let currentSpeed = localPlayer.speed;
      if (localPlayer.hasAura) currentSpeed += 3;
      if (localPlayer.isMounted) currentSpeed += 2;
      
      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) currentSpeed = v.speed;
      }

      let nextX = localPlayer.x; let nextY = localPlayer.y;
      localPlayer.isMoving = false;

      if (keys['ArrowUp'] || keys['w']) { nextY -= currentSpeed; localPlayer.dir = 'up'; localPlayer.isMoving = true; }
      if (keys['ArrowDown'] || keys['s']) { nextY += currentSpeed; localPlayer.dir = 'down'; localPlayer.isMoving = true; }
      if (keys['ArrowLeft'] || keys['a']) { nextX -= currentSpeed; localPlayer.dir = 'left'; localPlayer.isMoving = true; }
      if (keys['ArrowRight'] || keys['d']) { nextX += currentSpeed; localPlayer.dir = 'right'; localPlayer.isMoving = true; }

      if (!checkWallCollision(nextX, localPlayer.y, localPlayer.radius)) localPlayer.x = nextX;
      if (!checkWallCollision(localPlayer.x, nextY, localPlayer.radius)) localPlayer.y = nextY;

      checkCoinPickups();

      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) { v.x = localPlayer.x; v.y = localPlayer.y; }
        if (localPlayer.isMoving && animFrame % 10 === 0) playVehicleSFX();
      } else if (localPlayer.isMoving && animFrame % 18 === 0) {
        playFootstepSFX();
      }

      if (localPlayer.isMoving && Object.keys(connections).length > 0) {
        broadcast({ type: 'move', player: localPlayer, vehicles });
      }
    }

    function drawCrosswalk(x, y, w, h, horizontal = true) {
      ctx.fillStyle = '#ffffff';
      let stripeSize = 14;
      let gap = 10;
      if (horizontal) {
        for (let currX = x; currX < x + w; currX += stripeSize + gap) {
          ctx.fillRect(currX, y, stripeSize, h);
        }
      } else {
        for (let currY = y; currY < y + h; currY += stripeSize + gap) {
          ctx.fillRect(x, currY, w, stripeSize);
        }
      }
    }

    function drawWorld() {
      ctx.fillStyle = '#1c1c1c';
      ctx.fillRect(0, 400, WORLD_WIDTH, 140);
      ctx.fillRect(0, 1500, WORLD_WIDTH, 140);
      ctx.fillRect(1400, 0, 140, WORLD_HEIGHT);
      ctx.fillRect(2800, 0, 140, WORLD_HEIGHT);

      ctx.fillStyle = '#7f8c8d';
      ctx.fillRect(0, 360, WORLD_WIDTH, 40);
      ctx.fillRect(0, 540, WORLD_WIDTH, 40);
      ctx.fillRect(0, 1460, WORLD_WIDTH, 40);
      ctx.fillRect(0, 1640, WORLD_WIDTH, 40);

      ctx.fillRect(1360, 0, 40, WORLD_HEIGHT);
      ctx.fillRect(1540, 0, 40, WORLD_HEIGHT);
      ctx.fillRect(2760, 0, 40, WORLD_HEIGHT);
      ctx.fillRect(2940, 0, 40, WORLD_HEIGHT);

      let intersectionsX = [1400, 2800];
      let intersectionsY = [400, 1500];

      intersectionsX.forEach(ix => {
        intersectionsY.forEach(iy => {
          drawCrosswalk(ix - 40, iy, 40, 140, false);
          drawCrosswalk(ix + 140, iy, 40, 140, false);
          drawCrosswalk(ix, iy - 40, 140, 40, true);
          drawCrosswalk(ix, iy + 140, 140, 40, true);
        });
      });

      ctx.strokeStyle = '#f1c40f';
      ctx.lineWidth = 4;
      ctx.setLineDash([25, 20]);
      ctx.beginPath(); ctx.moveTo(0, 470); ctx.lineTo(WORLD_WIDTH, 470); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 1570); ctx.lineTo(WORLD_WIDTH, 1570); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(1470, 0); ctx.lineTo(1470, WORLD_HEIGHT); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2870, 0); ctx.lineTo(2870, WORLD_HEIGHT); ctx.stroke();
      ctx.setLineDash([]);

      // Dibujar Casas y sus Garages Independientes al lado
      houses.forEach(h => {
        // Sombra de la casa
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(h.x + 10, h.y + 10, h.w, h.h);

        // Estilo particular para Facu (Color azulado/moderno distintivo)
        let houseColor = '#3e2723';
        if (h.id === 'house_martin') houseColor = '#1b4f72';
        if (h.id === 'house_gaby') houseColor = '#7d3c98';
        if (h.id === 'house_facu') houseColor = '#117a65';
        if (h.id === 'house_bar') houseColor = '#4a148c';
        if (h.id === 'house_shop') houseColor = '#006064';
        if (h.id === 'house_hospital') houseColor = '#b71c1c';

        // Cuerpo de la casa
        ctx.fillStyle = houseColor;
        ctx.fillRect(h.x, h.y, h.w, h.h);
        ctx.strokeStyle = '#f5f5f5'; ctx.lineWidth = 3;
        ctx.strokeRect(h.x, h.y, h.w, h.h);

        // Techo / Marquesina superior
        ctx.fillStyle = '#212121';
        ctx.fillRect(h.x - 6, h.y - 20, h.w + 12, 24);
        ctx.strokeStyle = '#fff'; ctx.strokeRect(h.x - 6, h.y - 20, h.w + 12, 24);

        ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
        ctx.fillText(h.name, h.x + h.w / 2, h.y - 33);
        ctx.font = '8px monospace'; ctx.fillText(h.furniture, h.x + h.w / 2, h.y + 30);

        // Ventanas
        ctx.fillStyle = '#81d4fa';
        ctx.fillRect(h.x + 15, h.y + 45, 20, 30);
        ctx.fillRect(h.x + h.w - 35, h.y + 45, 20, 30);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.strokeRect(h.x + 15, h.y + 45, 20, 30);
        ctx.strokeRect(h.x + h.w - 35, h.y + 45, 20, 30);

        // Puerta principal
        ctx.fillStyle = '#ffeb3b'; ctx.fillRect(h.doorX - 16, h.doorY - 6, 32, 12);
        ctx.fillStyle = '#fff'; ctx.font = '8px monospace'; ctx.fillText("🚪 ENTRANCE", h.doorX, h.doorY - 12);

        // Garage Integrado Independiente al Lado
        if (h.hasGarage) {
          ctx.fillStyle = '#2c3e50';
          ctx.fillRect(h.garageX, h.garageY, h.garageW, h.garageH);
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
          ctx.strokeRect(h.garageX, h.garageY, h.garageW, h.garageH);

          // Cortina del garage
          ctx.fillStyle = '#566573';
          ctx.fillRect(h.garageX + 10, h.garageY + 20, h.garageW - 20, h.garageH - 30);
          ctx.strokeStyle = '#111';
          for (let gy = h.garageY + 30; gy < h.garageY + h.garageH - 20; gy += 15) {
            ctx.beginPath(); ctx.moveTo(h.garageX + 10, gy); ctx.lineTo(h.garageX + h.garageW - 10, gy); ctx.stroke();
          }
          ctx.fillStyle = '#fff'; ctx.font = '8px monospace'; ctx.fillText("🚘 GARAGE", h.garageX + h.garageW / 2, h.garageY - 8);
        }
      });

      trafficLights.forEach(tl => {
        ctx.fillStyle = '#222';
        ctx.fillRect(tl.x - 6, tl.y - 28, 12, 36);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.strokeRect(tl.x - 6, tl.y - 28, 12, 36);

        ctx.fillStyle = tl.state === 'red' ? '#e74c3c' : '#555';
        ctx.beginPath(); ctx.arc(tl.x, tl.y - 18, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = tl.state === 'green' ? '#2ecc71' : '#555';
        ctx.beginPath(); ctx.arc(tl.x, tl.y - 6, 4, 0, Math.PI * 2); ctx.fill();
      });

      npcCitizens.forEach(npc => {
        drawCharacterEntity(npc.x, npc.y, npc.color, npc.name + ' [NPC]', npc.walkCycle, npc.vx !== 0 ? 'walkX' : 'walkY');
      });

      npcVehicles.forEach(veh => {
        drawDetailedVehicle(veh.x, veh.y, veh.color, veh.type, veh.vx > 0 ? 0 : Math.PI);
      });

      sceneryTrees.forEach(t => {
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath(); ctx.arc(t.x + 6, t.y + 8, t.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4e342e';
        ctx.fillRect(t.x - 6, t.y, 12, 22);
        ctx.fillStyle = '#1b5e20';
        ctx.beginPath(); ctx.arc(t.x, t.y - 8, t.r, 0, Math.PI * 2); ctx.fill();
      });

      streetLights.forEach(l => {
        ctx.fillStyle = '#37474f';
        ctx.fillRect(l.x - 4, l.y - 30, 8, 35);
        ctx.fillStyle = '#fff176';
        ctx.beginPath(); ctx.arc(l.x, l.y - 30, 7, 0, Math.PI * 2); ctx.fill();
      });

      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 28, 0, Math.PI * 2);
        ctx.arc(c.x + 24, c.y - 12, 22, 0, Math.PI * 2);
        ctx.arc(c.x + 48, c.y, 25, 0, Math.PI * 2);
        ctx.fill();
      });

      vehicles.forEach(v => {
        if (v.location === 'world') {
          if (v.type === 'plane') {
            ctx.font = '34px monospace'; ctx.textAlign = 'center'; ctx.fillText('✈️', v.x, v.y);
          } else {
            drawDetailedVehicle(v.x, v.y, v.color, 'car', 0);
          }
        }
      });

      mapCoins.forEach(coin => {
        if (coin.active) {
          ctx.font = '18px monospace'; ctx.textAlign = 'center';
          ctx.fillText('🪙', coin.x, coin.y + Math.sin(animFrame * 0.1) * 4);
        }
      });
    }

    function drawDetailedVehicle(x, y, color, type, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      if (type === 'truck') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-45, -22, 90, 44);
        ctx.fillStyle = color;
        ctx.fillRect(20, -18, 22, 36);
        ctx.fillStyle = '#ecf0f1';
        ctx.fillRect(-42, -20, 60, 40);
      } else if (type === 'moto') {
        ctx.fillStyle = color;
        ctx.fillRect(-12, -6, 24, 12);
      } else {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-32, -18, 64, 36);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(-28, -16, 56, 32, 6);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawHouseInterior() {
      ctx.fillStyle = '#2c1e1a'; ctx.fillRect(100, 100, 600, 400);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(100, 100, 600, 400);
      
      ctx.fillStyle = '#3e2723'; ctx.fillRect(250, 200, 300, 200);
      ctx.strokeStyle = '#fff'; ctx.strokeRect(250, 200, 300, 100);

      ctx.fillStyle = '#0f0'; ctx.fillRect(300, 490, 100, 10);
      ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.fillText("EXIT TO CITY", 350, 480);
      
      let houseObj = houses.find(h => h.id === localPlayer.location);
      ctx.fillText(houseObj ? houseObj.furniture : '🛋️ Modern Interior', 400, 255);
    }

    function drawCharacterEntity(x, y, color, nameText, cycleVal = 0, motionType = 'none') {
      ctx.save();
      let legOffset = motionType !== 'none' ? Math.sin(cycleVal) * 4 : 0;

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(x, y + 14, 8, 4, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = color;
      ctx.fillRect(x - 6, y - 2, 4, 12 + legOffset);
      ctx.fillRect(x + 2, y - 2, 4, 12 - legOffset);
      ctx.fillRect(x - 8, y - 10, 16, 12);
      ctx.beginPath(); ctx.arc(x, y - 16, 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      
      if (nameText) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px monospace'; 
        ctx.textAlign = 'center';
        ctx.fillText(nameText, x, y + 28);
      }
    }

    function drawAvatar(p) {
      ctx.save();
      if (p.hasAura) { ctx.shadowBlur = 18; ctx.shadowColor = '#00ffff'; }
      let renderY = p.y;

      if (!p.vehicle) {
        if (p.isMounted) {
          ctx.fillStyle = '#ff00ff';
          ctx.fillRect(p.x - 14, renderY + 8, 28, 6);
          renderY -= 5;
        }
        let cycle = p.isMoving ? animFrame * 0.3 : 0;
        drawCharacterEntity(p.x, renderY, p.color || '#ffffff', '', cycle, p.isMoving ? 'walk' : 'none');

        if (p.equippedHat === 'item_sunglasses') {
          ctx.fillStyle = '#000';
          ctx.fillRect(p.x - 6, renderY - 18, 5, 3);
          ctx.fillRect(p.x + 1, renderY - 18, 5, 3);
        } else if (p.equippedHat === 'item_crown') {
          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.moveTo(p.x - 6, renderY - 24);
          ctx.lineTo(p.x - 8, renderY - 32);
          ctx.lineTo(p.x, renderY - 34);
          ctx.lineTo(p.x + 8, renderY - 32);
          ctx.lineTo(p.x + 6, renderY - 24);
          ctx.closePath();
          ctx.fill();
        }
      }
      ctx.restore();
      
      ctx.fillStyle = '#ffffff';
      ctx.font = '11px monospace'; 
      ctx.textAlign = 'center';
      ctx.fillText(p.name, p.x, p.y + 28);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      if (localPlayer.location === 'world') {
        let camX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, localPlayer.x - canvas.width / 2));
        let camY = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, localPlayer.y - canvas.height / 2));
        ctx.translate(-camX, -camY);
        drawWorld();
      } else {
        drawHouseInterior();
      }
      drawAvatar(localPlayer);
      for (let id in players) if (id !== localPlayer.id && players[id].location === localPlayer.location) drawAvatar(players[id]);
      ctx.restore();
    }

    function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
  </script>
