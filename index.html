<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neighborhood World - Multiplayer Game (v1.7.2)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body { background: #000; color: #fff; overflow: hidden; }

    /* Modal Setup / Login */
    #setup-modal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100;
    }
    .setup-box {
      border: 2px solid #fff; padding: 20px; background: #111;
      display: flex; flex-direction: column; gap: 15px; width: 320px;
    }
    .setup-box input, .setup-box button, .setup-box select {
      background: #000; color: #fff; border: 1px solid #fff; padding: 10px;
      font-family: monospace; cursor: pointer;
    }
    .setup-box button:hover { background: #fff; color: #000; }

    /* UI Principal del Juego */
    #game-container { display: none; width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; background: #050505; width: 100vw; height: 100vh; }

    #hud {
      position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8);
      border: 1px solid #fff; padding: 10px; z-index: 10; font-size: 12px;
      display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    }
    
    #hud-controls {
      position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; gap: 5px;
    }
    #hud-controls button {
      background: rgba(0,0,0,0.8); color: #fff; border: 1px solid #fff;
      padding: 6px 10px; font-family: monospace; cursor: pointer;
    }
    #hud-controls button:hover { background: #fff; color: #000; }

    /* Modales de Tienda e Inventario */
    .game-modal {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); background: #111; border: 2px solid #fff;
      padding: 15px; width: 300px; z-index: 20; color: #fff;
    }
    .game-modal h3 { border-bottom: 1px solid #fff; padding-bottom: 5px; margin-bottom: 10px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; }
    .item-row button { background: #000; color: #fff; border: 1px solid #fff; padding: 2px 8px; cursor: pointer; }
    .item-row button:hover { background: #fff; color: #000; }

    /* Chat Container */
    #chat-container {
      position: absolute; bottom: 10px; left: 10px; width: 300px;
      background: rgba(0,0,0,0.85); border: 1px solid #fff; z-index: 10;
    }
    #chat-container.minimized #chat-logs { display: none; }
    #chat-header {
      background: #222; padding: 5px 10px; cursor: pointer;
      display: flex; justify-content: space-between; border-bottom: 1px solid #fff;
    }
    #chat-logs { height: 120px; overflow-y: auto; padding: 8px; font-size: 11px; }
    #chat-input-box { border-top: 1px solid #fff; display: flex; }
    #chat-input { background: #000; color: #fff; border: none; padding: 8px; width: 100%; font-family: monospace; }

    /* Notificaciones */
    #notification-zone {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      z-index: 30; pointer-events: none; display: flex; flex-direction: column; gap: 5px;
    }
    .toast {
      background: rgba(0,0,0,0.9); border: 1px solid #fff; padding: 6px 12px;
      font-size: 11px; text-align: center;
    }
    .toast.success { border-color: #0f0; color: #0f0; }
    .toast.error { border-color: #f00; color: #f00; }

    /* Mandos táctiles para móviles */
    #mobile-controls {
      display: none; position: absolute; bottom: 20px; right: 20px; z-index: 10;
    }
    .dpad-row { display: flex; justify-content: center; }
    .dpad-btn {
      width: 44px; height: 44px; background: rgba(255,255,255,0.2);
      border: 1px solid #fff; color: #fff; font-size: 18px; display: flex;
      align-items: center; justify-content: center; user-select: none;
    }
    @media (pointer: coarse) { #mobile-controls { display: block; } }
  </style>
</head>
<body>

  <!-- Modal de Setup Inicial -->
  <div id="setup-modal">
    <div class="setup-box">
      <h2 style="text-align:center;">ENTER NEIGHBORHOOD</h2>
      <div style="font-size: 10px; text-align: center; color: #888;">BUILD: v1.7.2</div>
      <input type="text" id="username-input" placeholder="Enter Username..." maxlength="12">
      <input type="text" id="world-id-input" placeholder="World ID (Default: main-town)">
      <select id="avatar-select">
        <option value="martin">Martin</option>
        <option value="gaby">Gaby</option>
        <option value="default">Citizen</option>
      </select>
      <select id="color-select">
        <option value="#ffffff">White</option>
        <option value="#00ffff">Cyan</option>
        <option value="#ff00ff">Magenta</option>
        <option value="#ffff00">Yellow</option>
      </select>
      <button onclick="enterHouse()">START GAME</button>
    </div>
  </div>

  <!-- Contenedor Principal del Juego -->
  <div id="game-container">
    <div id="hud">
      <div>BUILD: <span style="color:#0f0;">v1.7.2</span></div>
      <div>ROOM: <span id="display-room-code">MAIN-TOWN</span></div>
      <div>STATUS: <span id="status-tag" style="color:#0f0;">CONNECTING...</span></div>
      <div>LOCATION: <span id="location-tag">HOME</span></div>
      <div>COINS: $<span id="coins-display">100</span></div>
      <div id="player-names" style="margin-top:5px; font-size:10px; color:#aaa;"></div>
    </div>

    <div id="hud-controls">
      <button onclick="sendEmote('👋')">👋</button>
      <button onclick="sendEmote('❤️')">❤️</button>
      <button onclick="sendEmote('😂')">😂</button>
      <button onclick="toggleShop()">SHOP (B)</button>
      <button onclick="toggleInventory()">BACKPACK (I)</button>
      <button onclick="resetPosition()">RESET</button>
    </div>

    <div id="notification-zone"></div>

    <!-- Tienda -->
    <div id="shop-modal" class="game-modal">
      <h3>SHOP</h3>
      <div id="shop-item-list"></div>
      <button onclick="toggleShop()" style="width:100%; margin-top:10px; background:#000; color:#fff; border:1px solid #fff; padding:4px; cursor:pointer;">CLOSE</button>
    </div>

    <!-- Inventario -->
    <div id="inventory-modal" class="game-modal">
      <h3>BACKPACK</h3>
      <div id="inventory-item-list"></div>
      <button onclick="toggleInventory()" style="width:100%; margin-top:10px; background:#000; color:#fff; border:1px solid #fff; padding:4px; cursor:pointer;">CLOSE</button>
    </div>

    <!-- Chat Base -->
    <div id="chat-container">
      <div id="chat-header" onclick="toggleChat()">
        <span>WORLD CHAT</span>
        <span id="chat-toggle-icon">[–]</span>
      </div>
      <div id="chat-logs"></div>
      <div id="chat-input-box">
        <input type="text" id="chat-input" placeholder="Press Enter to chat..." maxlength="60">
      </div>
    </div>

    <!-- D-Pad Móvil -->
    <div id="mobile-controls">
      <div class="dpad-row"><div class="dpad-btn" id="btn-up">▲</div></div>
      <div class="dpad-row">
        <div class="dpad-btn" id="btn-left">◄</div>
        <div class="dpad-btn" style="opacity:0;"></div>
        <div class="dpad-btn" id="btn-right">►</div>
      </div>
      <div class="dpad-row"><div class="dpad-btn" id="btn-down">▼</div></div>
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    const GAME_VERSION = "1.7.2";
    const WORLD_WIDTH = 2400;
    const WORLD_HEIGHT = 1600;
    const PLAYER_TIMEOUT_MS = 10000;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let peer = null;
    let connections = {};
    let isHost = false;
    let activeWorldRoom = "main-town";
    let heartbeatInterval = null;
    let animFrame = 0;

    let selectedAvatar = 'martin';
    let selectedColor = '#ffffff';

    let keys = {};
    let players = {};

    let localPlayer = {
      id: '',
      name: 'Player',
      avatar: 'martin',
      color: '#ffffff',
      x: 400,
      y: 450,
      radius: 12,
      speed: 4,
      location: 'house_martin',
      coins: 100,
      inventory: [],
      equippedHat: null,
      vehicle: null,
      isMoving: false,
      dir: 'down'
    };

    let houses = [
      { id: 'house_martin', name: "Martin's House", x: 200, y: 200, w: 300, h: 200, doorX: 350, doorY: 400, exitX: 350, exitY: 430, furniture: '📺 TV Room' },
      { id: 'house_gaby', name: "Gaby's House", x: 1000, y: 200, w: 300, h: 200, doorX: 1150, doorY: 400, exitX: 1150, exitY: 430, furniture: '🌺 Garden Couch' },
      { id: 'house_default', name: "Community Hub", x: 1800, y: 200, w: 300, h: 200, doorX: 1950, doorY: 400, exitX: 1950, exitY: 430, furniture: '☕ Coffee Bar' }
    ];

    let outdoorSolids = [
      { x: 200, y: 200, w: 300, h: 200 },
      { x: 1000, y: 200, w: 300, h: 200 },
      { x: 1800, y: 200, w: 300, h: 200 }
    ];

    let houseSolids = [
      { x: 100, y: 100, w: 600, h: 10 },
      { x: 100, y: 100, w: 10, h: 400 },
      { x: 690, y: 100, w: 10, h: 400 },
      { x: 100, y: 490, w: 250, h: 10 },
      { x: 450, y: 490, w: 250, h: 10 },
      { x: 250, y: 200, w: 300, h: 100 }
    ];

    let vehicles = [
      { id: 'v_car1', type: 'car', icon: '🏎️', x: 600, y: 530, speed: 7, driver: null, location: 'world' },
      { id: 'v_plane1', type: 'plane', icon: '🛩️', x: 1200, y: 1150, speed: 10, driver: null, location: 'world' }
    ];

    let mapCoins = [
      { id: 1, x: 500, y: 600, active: true },
      { id: 2, x: 900, y: 700, active: true },
      { id: 3, x: 1400, y: 400, active: true },
      { id: 4, x: 300, y: 900, active: true },
      { id: 5, x: 1700, y: 900, active: true }
    ];

    let shopItems = [
      { id: 'item_hat', name: 'Party Hat 🎉', price: 30, type: 'hat' },
      { id: 'item_speed', name: 'Speed Boost ⚡', price: 50, type: 'buff' }
    ];

    // Audio SFX sintético
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playCoinSFX() {
      if (!audioCtx) return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(987.77, audioCtx.currentTime);
      osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    }
    function playFootstepSFX() {
      if (!audioCtx) return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(120, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }
    function playVehicleSFX() {
      if (!audioCtx) return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(60, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }
    function playDoorSFX() {
      if (!audioCtx) return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }
    function playChatChime() {
      if (!audioCtx) return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }
    function playEquipSFX() {
      if (!audioCtx) return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    // UI Utilities
    function showNotification(msg, type = 'normal') {
      const zone = document.getElementById('notification-zone');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerText = msg;
      zone.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3000);
    }

    function savePlayerData() {
      document.getElementById('coins-display').innerText = localPlayer.coins;
      localStorage.setItem(`nh_coins_${localPlayer.name}`, localPlayer.coins);
      localStorage.setItem(`nh_inventory_${localPlayer.name}`, JSON.stringify(localPlayer.inventory));
      localStorage.setItem(`nh_hat_${localPlayer.name}`, localPlayer.equippedHat || '');
    }

    function toggleShop() {
      const modal = document.getElementById('shop-modal');
      modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
      if (modal.style.display === 'block') renderShop();
    }

    function renderShop() {
      const container = document.getElementById('shop-item-list');
      container.innerHTML = '';
      shopItems.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `
          <span>${item.name} ($${item.price})</span>
          <button onclick="buyItem('${item.id}')">BUY</button>
        `;
        container.appendChild(div);
      });
    }

    function buyItem(itemId) {
      const item = shopItems.find(i => i.id === itemId);
      if (!item) return;
      if (localPlayer.coins >= item.price) {
        localPlayer.coins -= item.price;
        localPlayer.inventory.push({ ...item, instanceId: Math.random().toString(36).substring(2, 7) });
        savePlayerData();
        playCoinSFX();
        showNotification(`Purchased ${item.name}!`, 'success');
        if (document.getElementById('inventory-modal').style.display === 'block') {
          renderInventory();
        }
      } else {
        showNotification("Not enough coins!", 'error');
      }
    }

    function toggleInventory() {
      const modal = document.getElementById('inventory-modal');
      modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
      if (modal.style.display === 'block') renderInventory();
    }

    function renderInventory() {
      const container = document.getElementById('inventory-item-list');
      container.innerHTML = '';
      if (localPlayer.inventory.length === 0) {
        container.innerHTML = '<div style="font-size:10px; color:#aaa; text-align:center;">Empty Backpack</div>';
        return;
      }

      localPlayer.inventory.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'item-row';

        let actionBtnHTML = '';
        if (item.type === 'hat') {
          const isEquipped = localPlayer.equippedHat === item.id;
          actionBtnHTML = `<button onclick="toggleEquipHat('${item.id}')">${isEquipped ? 'UNEQUIP' : 'EQUIP'}</button>`;
        } else if (item.type === 'buff') {
          actionBtnHTML = `<button onclick="useBuffItem(${index})">USE</button>`;
        }

        div.innerHTML = `
          <span>${item.name}</span>
          ${actionBtnHTML}
        `;
        container.appendChild(div);
      });
    }

    function toggleEquipHat(hatId) {
      if (localPlayer.equippedHat === hatId) {
        localPlayer.equippedHat = null;
        showNotification("Hat unequipped", 'normal');
      } else {
        localPlayer.equippedHat = hatId;
        showNotification("Hat equipped!", 'success');
      }
      playEquipSFX();
      savePlayerData();
      renderInventory();
      broadcast({ type: 'move', player: localPlayer, vehicles });
    }

    function useBuffItem(index) {
      const item = localPlayer.inventory[index];
      if (!item) return;

      if (item.id === 'item_speed') {
        localPlayer.speed += 2;
        showNotification("Speed Boost Activated! (+2 Speed)", 'success');
        playEquipSFX();
      }

      localPlayer.inventory.splice(index, 1);
      savePlayerData();
      renderInventory();
      broadcast({ type: 'move', player: localPlayer, vehicles });
    }

    function toggleChat() {
      const chatContainer = document.getElementById('chat-container');
      const toggleIcon = document.getElementById('chat-toggle-icon');
      chatContainer.classList.toggle('minimized');
      toggleIcon.innerText = chatContainer.classList.contains('minimized') ? '[+]' : '[–]';
    }

    function sanitizeText(str) {
      let temp = document.createElement('div');
      temp.textContent = str;
      return temp.innerHTML;
    }

    function resetPosition() {
      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) v.driver = null;
        localPlayer.vehicle = null;
      }
      localPlayer.location = `house_${localPlayer.avatar}`;
      localPlayer.x = 400;
      localPlayer.y = 450;
      let homeObj = houses.find(h => h.id === localPlayer.location);
      document.getElementById('location-tag').innerText = homeObj ? homeObj.name.toUpperCase() : "HOME";
      broadcast({ type: 'move', player: localPlayer, vehicles });
      updatePlayerList();
    }

    function enterHouse() {
      initAudio();
      
      const customName = document.getElementById('username-input').value.trim();
      selectedAvatar = document.getElementById('avatar-select').value;
      selectedColor = document.getElementById('color-select').value;
      activeWorldRoom = document.getElementById('world-id-input').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || "main-town";
      window.location.hash = activeWorldRoom;
      document.getElementById('display-room-code').innerText = activeWorldRoom.toUpperCase();

      localPlayer.name = customName || (selectedAvatar.charAt(0).toUpperCase() + selectedAvatar.slice(1));
      localPlayer.avatar = selectedAvatar;
      localPlayer.color = selectedColor;
      localPlayer.id = Math.random().toString(36).substring(2, 7);
      localPlayer.location = `house_${selectedAvatar}`;
      localPlayer.x = 400;
      localPlayer.y = 450;

      const savedCoins = localStorage.getItem(`nh_coins_${localPlayer.name}`);
      localPlayer.coins = savedCoins !== null ? parseInt(savedCoins, 10) : 100;

      const savedInv = localStorage.getItem(`nh_inventory_${localPlayer.name}`);
      if (savedInv) {
        try { localPlayer.inventory = JSON.parse(savedInv); } catch(e) { localPlayer.inventory = []; }
      } else {
        localPlayer.inventory = [];
      }

      const savedHat = localStorage.getItem(`nh_hat_${localPlayer.name}`);
      if (savedHat) localPlayer.equippedHat = savedHat;

      savePlayerData();

      localStorage.setItem('nh_name', localPlayer.name);
      localStorage.setItem('nh_avatar', selectedAvatar);
      localStorage.setItem('nh_color', selectedColor);
      localStorage.setItem('nh_room', activeWorldRoom);

      let homeObj = houses.find(h => h.id === localPlayer.location);
      document.getElementById('location-tag').innerText = homeObj ? homeObj.name.toUpperCase() : "HOME";

      document.getElementById('setup-modal').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      setupMobileControls();
      initMultiplayerGlobal();

      if (heartbeatInterval) clearInterval(heartbeatInterval);
      heartbeatInterval = setInterval(() => {
        if (localPlayer.id && Object.keys(connections).length > 0) {
          broadcast({ type: 'move', player: localPlayer, vehicles, isHeartbeat: true });
        }
      }, 1000);

      requestAnimationFrame(gameLoop);
    }

    function setupMobileControls() {
      const bindTouch = (id, keyName) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        const start = (e) => { e.preventDefault(); keys[keyName] = true; };
        const end = (e) => { e.preventDefault(); keys[keyName] = false; };
        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
      };
      bindTouch('btn-up', 'ArrowUp'); bindTouch('btn-down', 'ArrowDown');
      bindTouch('btn-left', 'ArrowLeft'); bindTouch('btn-right', 'ArrowRight');
    }

    function initMultiplayerGlobal() {
      const hostRoomId = `nh-${activeWorldRoom}-host-v172`;
      const joinDelay = Math.floor(Math.random() * 300);

      setTimeout(() => {
        peer = new Peer(hostRoomId);

        peer.on('open', () => {
          isHost = true;
          document.getElementById('status-tag').innerText = "HOSTING WORLD";
          showNotification("You are hosting this world", "success");
        });

        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            peer = new Peer();
            peer.on('open', () => {
              document.getElementById('status-tag').innerText = "CONNECTED";
              connectToHost(hostRoomId);
            });
            peer.on('connection', (conn) => bindConnectionEvents(conn));
          }
        });

        peer.on('connection', (conn) => bindConnectionEvents(conn));
      }, joinDelay);
    }

    function connectToHost(hostRoomId) {
      let hostConn = peer.connect(hostRoomId, { reliable: true });
      bindConnectionEvents(hostConn);
    }

    function bindConnectionEvents(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        conn.send({ type: 'sync', player: localPlayer, vehicles, version: GAME_VERSION });
      });

      conn.on('data', (data) => {
        if (data.type === 'leave') {
          delete players[data.id];
          updatePlayerList();

          if (isHost) {
            for (let pId in connections) {
              if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
            }
          }
        } else if (data.type === 'sync' || data.type === 'move') {
          data.player.lastSeen = Date.now();
          players[data.player.id] = data.player;
          if (data.vehicles) vehicles = data.vehicles;
          
          if (data.type === 'sync' && !isHost) {
            conn.send({ type: 'move', player: localPlayer, vehicles, version: GAME_VERSION });
          }

          if (isHost) {
            for (let pId in connections) {
              if (pId !== conn.peer && connections[pId].open) {
                connections[pId].send(data);
              }
            }
          }
        } else if (data.type === 'chat') {
          let sameLocation = (data.location === localPlayer.location);
          let dist = Math.hypot(localPlayer.x - data.x, localPlayer.y - data.y);
          let isNear = sameLocation && dist < 500;
          let text = isNear ? data.message : "...[distant chat]...";
          
          addChatMessage(data.name, text);
          if (players[data.id] && sameLocation) setSpeechBubble(players[data.id], data.message);
          playChatChime();

          if (isHost) {
            for (let pId in connections) {
              if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
            }
          }
        } else if (data.type === 'emote') {
          if (players[data.id]) setEmote(players[data.id], data.emote);
          if (isHost) {
            for (let pId in connections) {
              if (pId !== conn.peer && connections[pId].open) connections[pId].send(data);
            }
          }
        }
        updatePlayerList();
      });

      conn.on('close', () => {
        delete connections[conn.peer];
        delete players[conn.peer];
        updatePlayerList();
      });
    }

    function broadcast(data) {
      for (let peerId in connections) {
        if (connections[peerId].open) connections[peerId].send(data);
      }
    }

    function cleanupGhostPlayers() {
      const now = Date.now();
      let changed = false;
      for (let id in players) {
        if (id !== localPlayer.id) {
          if (players[id].lastSeen && (now - players[id].lastSeen > PLAYER_TIMEOUT_MS)) {
            delete players[id];
            changed = true;
          }
        }
      }
      if (changed) updatePlayerList();
    }

    function updatePlayerList() {
      const listEl = document.getElementById('player-names');
      let html = `<div>• ${localPlayer.name} (You)</div>`;
      for (let id in players) {
        if (id !== localPlayer.id && players[id].location === localPlayer.location) {
          html += `<div>• ${players[id].name}</div>`;
        }
      }
      listEl.innerHTML = html;
    }

    window.addEventListener('keydown', e => {
      if (document.activeElement === document.getElementById('chat-input')) return;
      keys[e.key] = true;
      if (e.key === 'e' || e.key === 'E') triggerInteraction();
      if (e.key === 'b' || e.key === 'B') toggleShop();
      if (e.key === 'i' || e.key === 'I') toggleInventory();
    });
    window.addEventListener('keyup', e => {
      if (document.activeElement === document.getElementById('chat-input')) return;
      keys[e.key] = false;
    });

    const chatInput = document.getElementById('chat-input');
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && chatInput.value.trim() !== '') {
        const msg = sanitizeText(chatInput.value.trim());
        addChatMessage(localPlayer.name, msg);
        setSpeechBubble(localPlayer, msg);
        broadcast({ 
          type: 'chat', id: localPlayer.id, name: localPlayer.name, 
          message: msg, x: localPlayer.x, y: localPlayer.y, location: localPlayer.location 
        });
        chatInput.value = '';
        chatInput.blur();
      }
    });

    function setSpeechBubble(p, text) { p.bubble = { text, timer: Date.now() + 4500 }; }
    function sendEmote(emote) { setEmote(localPlayer, emote); broadcast({ type: 'emote', id: localPlayer.id, emote }); }
    function setEmote(p, emote) { p.emote = { symbol: emote, timer: Date.now() + 3000 }; }

    function addChatMessage(sender, text) {
      const logs = document.getElementById('chat-logs');
      const msgDiv = document.createElement('div');
      msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
      logs.appendChild(msgDiv);
      logs.scrollTop = logs.scrollHeight;
    }

    function triggerInteraction() {
      if (localPlayer.location === 'world') {
        if (localPlayer.vehicle) {
          let v = vehicles.find(item => item.id === localPlayer.vehicle);
          if (v) {
            v.driver = null;
            localPlayer.x = v.x + 40;
            localPlayer.y = v.y + 40;
          }
          localPlayer.vehicle = null;
          broadcast({ type: 'move', player: localPlayer, vehicles });
          return;
        }

        vehicles.forEach(v => {
          if (!v.driver && Math.hypot(localPlayer.x - v.x, localPlayer.y - v.y) < 50) {
            v.driver = localPlayer.id;
            localPlayer.vehicle = v.id;
          }
        });

        houses.forEach(h => {
          if (Math.hypot(localPlayer.x - h.doorX, localPlayer.y - h.doorY) < 40) {
            localPlayer.location = h.id;
            localPlayer.x = 400; localPlayer.y = 450;
            playDoorSFX();
            document.getElementById('location-tag').innerText = h.name.toUpperCase();
          }
        });
      } else {
        if (Math.hypot(localPlayer.x - 400, localPlayer.y - 480) < 50) {
          let h = houses.find(item => item.id === localPlayer.location);
          localPlayer.location = 'world';
          localPlayer.x = h ? h.exitX : 300;
          localPlayer.y = h ? h.exitY : 430;
          playDoorSFX();
          document.getElementById('location-tag').innerText = "WORLD";
        }
      }
      broadcast({ type: 'move', player: localPlayer, vehicles });
      updatePlayerList();
    }

    function checkWallCollision(newX, newY, radius) {
      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v && v.type === 'plane') return false;
      }

      let solids = localPlayer.location === 'world' ? outdoorSolids : houseSolids;
      for (let s of solids) {
        let closestX = Math.max(s.x, Math.min(newX, s.x + s.w));
        let closestY = Math.max(s.y, Math.min(newY, s.y + s.h));
        if (Math.hypot(newX - closestX, newY - closestY) < radius) return true;
      }
      return false;
    }

    function checkCoinPickups() {
      if (localPlayer.location !== 'world') return;
      mapCoins.forEach(coin => {
        if (coin.active && Math.hypot(localPlayer.x - coin.x, localPlayer.y - coin.y) < 25) {
          coin.active = false;
          localPlayer.coins += 10;
          savePlayerData();
          playCoinSFX();
          showNotification("+$10 Coins!", 'success');
          setTimeout(() => {
            coin.x = Math.floor(Math.random() * (WORLD_WIDTH - 200)) + 100;
            coin.y = Math.floor(Math.random() * (WORLD_HEIGHT - 200)) + 100;
            coin.active = true;
          }, 10000);
        }
      });
    }

    function update() {
      animFrame++;
      cleanupGhostPlayers();

      let currentSpeed = localPlayer.speed;

      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) currentSpeed = v.speed;
      }

      let nextX = localPlayer.x;
      let nextY = localPlayer.y;
      localPlayer.isMoving = false;

      if (keys['ArrowUp'] || keys['w']) { nextY -= currentSpeed; localPlayer.dir = 'up'; localPlayer.isMoving = true; }
      if (keys['ArrowDown'] || keys['s']) { nextY += currentSpeed; localPlayer.dir = 'down'; localPlayer.isMoving = true; }
      if (keys['ArrowLeft'] || keys['a']) { nextX -= currentSpeed; localPlayer.dir = 'left'; localPlayer.isMoving = true; }
      if (keys['ArrowRight'] || keys['d']) { nextX += currentSpeed; localPlayer.dir = 'right'; localPlayer.isMoving = true; }

      if (!checkWallCollision(nextX, localPlayer.y, localPlayer.radius)) localPlayer.x = nextX;
      if (!checkWallCollision(localPlayer.x, nextY, localPlayer.radius)) localPlayer.y = nextY;

      checkCoinPickups();

      if (localPlayer.vehicle) {
        let v = vehicles.find(item => item.id === localPlayer.vehicle);
        if (v) { v.x = localPlayer.x; v.y = localPlayer.y; }
        if (localPlayer.isMoving && animFrame % 10 === 0) playVehicleSFX();
      } else if (localPlayer.isMoving && animFrame % 18 === 0) {
        playFootstepSFX();
      }

      if (localPlayer.isMoving && Object.keys(connections).length > 0) {
        broadcast({ type: 'move', player: localPlayer, vehicles });
      }
    }

    function drawWorld() {
      ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 2;

      ctx.strokeStyle = '#333'; ctx.lineWidth = 60; ctx.beginPath();
      ctx.moveTo(0, 500); ctx.lineTo(WORLD_WIDTH, 500);
      ctx.moveTo(800, 0); ctx.lineTo(800, WORLD_HEIGHT);
      ctx.moveTo(1600, 0); ctx.lineTo(1600, WORLD_HEIGHT);
      ctx.stroke();

      ctx.fillStyle = '#222'; ctx.fillRect(800, 1150, 900, 100);
      ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.fillText("AIRSTRIP", 1200, 1205);

      ctx.lineWidth = 2;
      houses.forEach(h => {
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(h.x, h.y, h.w, h.h);
        ctx.fillText(h.name, h.x + 150, h.y + 150);
        
        ctx.fillStyle = '#0f0';
        ctx.fillRect(h.doorX - 20, h.doorY - 5, 40, 10);
        ctx.fillStyle = '#fff';
      });

      vehicles.forEach(v => {
        if (v.location === 'world') {
          ctx.font = '24px monospace'; ctx.textAlign = 'center';
          ctx.fillText(v.icon, v.x, v.y);
        }
      });

      mapCoins.forEach(coin => {
        if (coin.active) {
          ctx.font = '16px monospace'; ctx.textAlign = 'center';
          ctx.fillText('🪙', coin.x, coin.y + Math.sin(animFrame * 0.1) * 3);
        }
      });
    }

    function drawHouseInterior() {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
      ctx.strokeRect(100, 100, 600, 400);

      ctx.fillStyle = '#0f0';
      ctx.fillRect(350, 490, 100, 10);
      ctx.fillStyle = '#fff'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
      ctx.fillText("EXIT TO WORLD", 400, 480);

      ctx.strokeRect(250, 200, 300, 100);
      let houseObj = houses.find(h => h.id === localPlayer.location);
      ctx.fillText(houseObj ? houseObj.furniture : '🛋️ Interior', 400, 255);
    }

    function drawAvatar(p) {
      ctx.fillStyle = p.color || '#ffffff';
      ctx.strokeStyle = p.color || '#ffffff';
      ctx.lineWidth = 2;

      let bobY = (p.isMoving && !p.vehicle) ? Math.sin(animFrame * 0.3) * 3 : 0;
      let renderY = p.y + bobY;

      if (!p.vehicle) {
        ctx.beginPath();
        if (p.avatar === 'martin') {
          ctx.arc(p.x, renderY - 4, 10, 0, Math.PI * 2);
          ctx.rect(p.x - 8, renderY + 6, 16, 12);
          ctx.stroke();
          ctx.fillRect(p.x - 6, renderY - 6, 12, 4);
        } else if (p.avatar === 'gaby') {
          ctx.arc(p.x, renderY - 4, 10, 0, Math.PI * 2);
          ctx.rect(p.x - 8, renderY + 6, 16, 12);
          ctx.stroke();
          ctx.fillRect(p.x - 12, renderY - 8, 4, 8);
          ctx.fillRect(p.x + 8, renderY - 8, 4, 8);
        } else {
          ctx.arc(p.x, renderY - 4, 10, 0, Math.PI * 2);
          ctx.rect(p.x - 8, renderY + 6, 16, 12);
          ctx.stroke();
          ctx.fillRect(p.x - 10, renderY - 12, 16, 3);
        }

        if (p.equippedHat === 'item_hat') {
          ctx.font = '16px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('🥳', p.x, renderY - 15);
        }
      }

      ctx.fillStyle = '#ffffff';
      ctx.font = '11px monospace'; 
      ctx.textAlign = 'center';
      ctx.fillText(p.name, p.x, renderY + 26);

      if (p.bubble && Date.now() < p.bubble.timer) {
        const maxLen = 14;
        let displayMsg = p.bubble.text;
        if (displayMsg.length > maxLen) {
          displayMsg = displayMsg.substring(0, maxLen) + '...';
        }

        ctx.font = '10px monospace';
        let textWidth = ctx.measureText(displayMsg).width;
        let boxWidth = Math.max(textWidth + 12, 28);
        let boxHeight = 18;
        let bubbleX = p.x - boxWidth / 2;
        let bubbleY = renderY - 32;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bubbleX, bubbleY, boxWidth, boxHeight);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1;
        ctx.strokeRect(bubbleX, bubbleY, boxWidth, boxHeight);

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(p.x - 4, bubbleY + boxHeight);
        ctx.lineTo(p.x + 4, bubbleY + boxHeight);
        ctx.lineTo(p.x, bubbleY + boxHeight + 4);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#000000';
        ctx.beginPath();
        ctx.moveTo(p.x - 4, bubbleY + boxHeight);
        ctx.lineTo(p.x, bubbleY + boxHeight + 4);
        ctx.lineTo(p.x + 4, bubbleY + boxHeight);
        ctx.stroke();

        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.fillText(displayMsg, p.x, bubbleY + 13);
      }

      if (p.emote && Date.now() < p.emote.timer) {
        ctx.font = '16px monospace'; 
        ctx.textAlign = 'center';
        ctx.fillText(p.emote.symbol, p.x, renderY - 40);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();

      if (localPlayer.location === 'world') {
        let camX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, localPlayer.x - canvas.width / 2));
        let camY = Math.max(0, Math.min(WORLD_HEIGHT - canvas.height, localPlayer.y - canvas.height / 2));
        ctx.translate(-camX, -camY);

        drawWorld();
      } else {
        drawHouseInterior();
      }

      drawAvatar(localPlayer);

      for (let id in players) {
        if (id !== localPlayer.id && players[id].location === localPlayer.location) {
          drawAvatar(players[id]);
        }
      }

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
